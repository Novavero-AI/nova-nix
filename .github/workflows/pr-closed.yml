name: PR closed

# Cancels a closed pull request's CI run.  Nothing pushes to a pull request
# once it merges or closes, so ci.yml's concurrency group never cancels its
# run, and a run whose change reaches the builder keeps building the seed
# ladder for hours on the Windows runners the merge queue's runs then wait
# for.  A run that enters a concurrency group with cancel-in-progress
# cancels the group's run in progress, whichever workflow it belongs to, so
# this workflow joins ci.yml's group for the pull request and does nothing
# else.  It takes no token and checks nothing out, so a pull request from a
# fork runs it as safely as one from a branch.
on:
  pull_request:
    types: [closed]

permissions: {}

# ci.yml's group for a pull request's run, ci-<event>-<ref>, with the
# event and the ref a pull request's run has.
concurrency:
  group: ci-pull_request-refs/pull/${{ github.event.pull_request.number }}/merge
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel the pull request's CI run
    runs-on: ubuntu-latest
    steps:
      - name: Joined ci.yml's group
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "pull request $PR closed; its CI run in this group is cancelled"
