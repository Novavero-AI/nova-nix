name: Windows sandbox probe

# A throwaway probe of what a Windows build sandbox would rest on, run
# before nova-nix-sandbox's Windows backend is written: build accounts,
# the design, and restricted and write-restricted tokens, the candidates
# for a tier without the service the accounts need, with the store DACL
# the design proposes and nested job objects.  It builds
# probe/windows-sandbox.c with GHC's own C compiler, the one that builds
# the shipped helper, uploads it for running on a desktop too, and prints
# one PASS or FAIL line per check.  The job fails when a check the design
# depends on fails.  The probe's layout is under the runner's temporary
# directory; the probe also makes, and removes, two local accounts and a
# file in the user's profile for each pass, and the trace step turns
# failure auditing on for its own steps alone.

on:
  push:
    branches: [probe/windows-sandbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Windows sandbox probe
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # Who the probe runs as decides what it can show: the hosted runner's
      # user is an administrator, where nova-nix's usual user is not.
      # A DLL on the known-DLL list is mapped from the system's own copy;
      # any other is read from its file, under the token that loads it.
      # The list and the ACLs of the System32 DLLs the checks load say
      # which is which here.
      - name: Describe the runner
        run: |
          "image: $env:ImageOS $env:ImageVersion"
          [System.Environment]::OSVersion.VersionString
          whoami /user /groups /priv
          reg query 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\KnownDLLs'
          foreach ($dll in 'kernel32.dll', 'advapi32.dll', 'cryptbase.dll', 'ucrtbase.dll') {
            icacls (Join-Path $env:SystemRoot "System32\$dll")
          }
          $global:LASTEXITCODE = 0

      # The probe and the tools it runs under each token sit in a directory
      # granting S-1-5-12 read and execute, which what is put there
      # inherits.  Users is granted the same, for the build accounts the
      # probe makes, which are in Users; and the runner's user by name, so
      # the probe's stand-in for a standard user, which holds the
      # Administrators group deny-only, can start the probe from there too.
      # The probe makes the rest of its layout itself.
      - name: Lay out the probe's root
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nova-nix-sandbox-probe'
          $tools = Join-Path $root 'tools'
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          New-Item -ItemType Directory -Path (Join-Path $tools 'bin') | Out-Null
          icacls $tools /grant '*S-1-5-12:(OI)(CI)RX' '*S-1-5-32-545:(OI)(CI)RX' "*${user}:(OI)(CI)RX"
          if ($LASTEXITCODE -ne 0) { throw "icacls failed with $LASTEXITCODE" }
          icacls $tools
          "PROBE_ROOT=$root" >> $env:GITHUB_ENV

      # ghc --info prints each setting as a Haskell string, its backslashes
      # and quotes escaped.  The probe links no C runtime (the file's
      # header says why), so it names its own entry point.  Should GHC's
      # compiler not build it, the runner's MinGW gcc does, with a warning,
      # so that the run still answers the probe's questions.
      - name: Build the probe with GHC's C compiler
        run: |
          $probe = Join-Path $env:PROBE_ROOT 'tools\bin\probe.exe'
          $common = @('-std=c99', '-Wall', '-Wextra', '-pedantic', '-O1', '-ffreestanding', '-fno-stack-protector',
                      '-mno-stack-arg-probe', '-nostdlib', '-Wl,-e,probe_entry', '-Wl,--subsystem,console',
                      'probe/windows-sandbox.c', '-o', $probe, '-lkernel32', '-ladvapi32')
          $built = $false
          try {
            $info = (ghc --info) -join "`n"
            $libdir = (ghc --print-libdir).Trim()
            function Get-GhcSetting([string] $name) {
              $pattern = '\("' + [regex]::Escape($name) + '","((?:[^"\\]|\\.)*)"\)'
              $found = [regex]::Match($info, $pattern)
              if (-not $found.Success) { throw "ghc --info has no '$name'" }
              ($found.Groups[1].Value -replace '\\(.)', '$1').Replace('$topdir', $libdir)
            }
            $cc = Get-GhcSetting 'C compiler command'
            $flags = @((Get-GhcSetting 'C compiler flags') -split '\s+' | Where-Object { $_ })
            $linkFlags = @((Get-GhcSetting 'C compiler link flags') -split '\s+' | Where-Object { $_ })
            "C compiler command: $cc"
            "C compiler flags: $flags"
            "C compiler link flags: $linkFlags"
            & $cc --version
            & $cc @flags @linkFlags @common
            if ($LASTEXITCODE -eq 0) {
              $built = $true
              "built with GHC's C compiler: $cc"
            }
          } catch {
            "GHC's C compiler could not be found or run: $_"
          }
          if (-not $built) {
            "::warning::GHC's C compiler did not build the probe; building it with C:\mingw64\bin\gcc.exe"
            & 'C:\mingw64\bin\gcc.exe' @common
            if ($LASTEXITCODE -ne 0) { throw "neither GHC's C compiler nor the runner's gcc built the probe" }
            "built with the runner's gcc: C:\mingw64\bin\gcc.exe"
          }
          # What the probe's header says it imports, read from the binary.
          if (Test-Path 'C:\mingw64\bin\objdump.exe') {
            & 'C:\mingw64\bin\objdump.exe' -p $probe | Select-String 'DLL Name'
          } else {
            "no objdump at C:\mingw64\bin to list the probe's imports"
          }

      - name: Upload the probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sandbox-probe
          path: ${{ env.PROBE_ROOT }}/tools/bin/probe.exe
          if-no-files-found: error

      # The runner keeps MSYS2 at C:\msys64, off PATH, and a UCRT MinGW-w64
      # gcc at C:\mingw64.  They are copied under the probe's root, so the
      # restricted token is granted only what the probe owns.
      - name: Copy MSYS2's bash and MinGW gcc under the probe's root
        run: |
          $tools = Join-Path $env:PROBE_ROOT 'tools'
          function Copy-Tree([string] $from, [string] $to) {
            robocopy $from $to /E /MT:16 /NFL /NDL /NJH /NJS /NP | Out-Null
            # robocopy's statuses below 8 all mean the copy was made.
            if ($LASTEXITCODE -ge 8) { throw "robocopy of $from failed with $LASTEXITCODE" }
          }
          $bash = '-'
          $gcc = '-'
          if (Test-Path 'C:\msys64\usr\bin\bash.exe') {
            Copy-Tree 'C:\msys64\usr\bin' (Join-Path $tools 'msys64\usr\bin')
            Copy-Tree 'C:\msys64\etc' (Join-Path $tools 'msys64\etc')
            $bash = Join-Path $tools 'msys64\usr\bin\bash.exe'
            "bash: C:\msys64\usr\bin\bash.exe"
          } else {
            "no bash at C:\msys64\usr\bin"
          }
          if (Test-Path 'C:\mingw64\bin\gcc.exe') {
            & 'C:\mingw64\bin\gcc.exe' --version | Select-Object -First 1
            Copy-Tree 'C:\mingw64' (Join-Path $tools 'mingw64')
            $gcc = Join-Path $tools 'mingw64\bin\gcc.exe'
            "gcc: C:\mingw64\bin\gcc.exe"
          } else {
            "no gcc at C:\mingw64\bin; on PATH: $((Get-Command gcc -ErrorAction SilentlyContinue).Source)"
          }
          "PROBE_BASH=$bash" >> $env:GITHUB_ENV
          "PROBE_GCC=$gcc" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      # Each trace step runs one thing under a build's token while failure
      # auditing covers every file and registry key, so the Security log
      # names each object a restricted token of the runner's user was
      # refused, and the process refused it: event 4656 with a
      # RestrictedSidCount above 0.  Other kernel objects (tokens,
      # processes, object directories) are not covered.  The control step
      # is a file refusal the probe already knows of; each step's counts,
      # of every failure event, of those under a restricted token and of
      # those the runner's user's, say whether a silent step recorded
      # nothing or had what it recorded filtered out.  No step controls for
      # keys.  The trace informs: it never fails the job, and the auditing
      # it turns on is turned off after it.
      - name: Trace what a restricted build is refused
        continue-on-error: true
        run: |
          $probe = Join-Path $env:PROBE_ROOT 'tools\bin\probe.exe'
          # The File System and Registry audit subcategories.
          $subcategories = '{0CCE921D-69AE-11D9-BED3-505054503030}', '{0CCE921E-69AE-11D9-BED3-505054503030}'
          $types = 'File', 'Key'
          $auditing = $true
          foreach ($subcategory in $subcategories) {
            auditpol /set "/subcategory:$subcategory" /failure:enable
            if ($LASTEXITCODE -ne 0) { $auditing = $false }
          }
          foreach ($type in $types) {
            auditpol /resourceSACL /set "/type:$type" /user:Everyone /failure /access:GA
            if ($LASTEXITCODE -ne 0) { $auditing = $false }
          }
          if (-not $auditing) { '::warning::failure auditing could not be turned on, so the trace shows outcomes alone' }
          try {
            $starts = foreach ($step in 'control', 'spawn-probe', 'spawn-cmd', 'bash', 'gcc') {
              [pscustomobject]@{ Step = $step; Start = (Get-Date) }
              & $probe trace $step $env:PROBE_BASH $env:PROBE_GCC | Out-Host
            }
          } finally {
            foreach ($type in $types) { auditpol /resourceSACL /clear "/type:$type" | Out-Host }
            foreach ($subcategory in $subcategories) { auditpol /set "/subcategory:$subcategory" /failure:disable | Out-Host }
          }
          if ($auditing) {
            # Audit Failure, the keyword a refused request is logged with.
            $failure = 0x10000000000000
            $filter = @{ LogName = 'Security'; Id = 4656; Keywords = $failure; StartTime = $starts[0].Start }
            function Get-Events([hashtable] $filter) {
              try {
                @(Get-WinEvent -FilterHashtable $filter -ErrorAction Stop)
              } catch {
                if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') {
                  "::warning::the Security log could not be read: $_" | Out-Host
                }
                @()
              }
            }
            $events = @(Get-Events $filter)
            $unkeyed = @(Get-Events @{ LogName = 'Security'; Id = 4656; StartTime = $starts[0].Start })
            "4656 events since the trace began: $($unkeyed.Count), $($events.Count) with the Audit Failure keyword"
            # The build tokens carry the runner's user; restricted service
            # tokens on the machine carry their service accounts.
            $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            # A step's records run until the next step starts, so a record
            # written late still falls to the step that caused it.
            for ($i = 0; $i -lt $starts.Count; $i++) {
              $from = $starts[$i].Start
              $until = if ($i + 1 -lt $starts.Count) { $starts[$i + 1].Start } else { [datetime]::MaxValue }
              $during = @($events | Where-Object { $_.TimeCreated -ge $from -and $_.TimeCreated -lt $until })
              $fields = @($during | ForEach-Object {
                $data = @{}
                foreach ($field in ([xml]$_.ToXml()).Event.EventData.Data) { $data[$field.Name] = $field.'#text' }
                [pscustomobject]$data
              })
              $restricted = @($fields | Where-Object { [int]$_.RestrictedSidCount -gt 0 })
              $mine = @($restricted | Where-Object { $_.SubjectUserSid -eq $user })
              ("refused during $($starts[$i].Step): $($during.Count) failure events, $($restricted.Count) under a " +
                "restricted token, $($mine.Count) of them the runner's user's")
              $mine | ForEach-Object {
                $process = [System.IO.Path]::GetFileName([string]$_.ProcessName)
                '  {0}: {1} {2}, access {3}' -f $process, $_.ObjectType, $_.ObjectName, $_.AccessMask
              } | Select-Object -Unique
              if ($mine.Count -eq 0) {
                # What was recorded but filtered out, so the filter can be checked.
                $fields | Select-Object -First 3 | ForEach-Object {
                  '  unmatched: {0} {1} {2}, restricted SIDs {3}, subject {4}' -f
                    [System.IO.Path]::GetFileName([string]$_.ProcessName), $_.ObjectType, $_.ObjectName,
                    $_.RestrictedSidCount, $_.SubjectUserSid
                }
              }
            }
          }
          $global:LASTEXITCODE = 0

      # The build accounts are started through the Secondary Logon service,
      # which starts on demand; starting it here says so when it cannot.
      # write-profile lets the probe make a file in the runner user's
      # profile, which it removes, for a build to try to delete.
      - name: Run the probe
        run: |
          try { Start-Service seclogon } catch { "::warning::the Secondary Logon service did not start: $_" }
          & (Join-Path $env:PROBE_ROOT 'tools\bin\probe.exe') run $env:PROBE_ROOT $env:PROBE_BASH $env:PROBE_GCC write-profile
          exit $LASTEXITCODE

      # The probe removes the build accounts it makes, and their batch
      # logon right; this removes any account a run that ended early left,
      # by the name prefix the probe gives them, and leaves such an
      # account's right on its SID, which the discarded runner takes with
      # it.
      # Windows PowerShell carries the LocalAccounts module itself, where
      # PowerShell 7 loads it through a compatibility session.
      - name: Remove leftover build accounts
        if: always()
        shell: powershell
        run: |
          Get-LocalUser | Where-Object Name -like 'nnprobe*' | ForEach-Object {
            "removing the leftover account $($_.Name)"
            Remove-LocalUser -SID $_.SID
          }
