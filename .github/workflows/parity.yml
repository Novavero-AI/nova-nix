name: Parity

# Proves the EVALUATOR is correct: nova-nix's computed hello.drvPath must
# byte-match what upstream Nix (nix-instantiate) computes from the SAME
# nixpkgs tree.  A derivation store-path hash transitively encodes the hash
# of every input derivation, so one matching path validates the whole
# build-time closure at once.
#
# Linux-only on purpose: it is the one place a real Nix exists to diff
# against.  The "runs natively on Windows" claim is proven separately by the
# Windows build job; this job proves the evaluation it does is correct.

on:
  workflow_dispatch:
  # Reusable: the publish workflow runs this on the exact tagged commit,
  # so nothing reaches Hackage without the drvPath oracle passing there.
  workflow_call:
  # Always report, including documentation-only PRs and the merge queue.
  # The oracle inputs below are fixed, so upstream churn cannot change the
  # meaning of this gate between two runs of the same commit.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

# Preserve the oracle from the last passing main run (33095182332).
# Bump these deliberately, independently of changes to the evaluator.
env:
  NIX_VERSION: "2.24.9"
  NIXPKGS_REV: "50ab793786d9de88ee30ec4e4c24fb4236fc2674"

jobs:
  parity:
    name: drvPath vs upstream Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install

      - name: Verify the oracle version
        run: |
          set -euo pipefail
          actual=$(nix-instantiate --version)
          expected="nix-instantiate (Nix) $NIX_VERSION"
          echo "$actual"
          [ "$actual" = "$expected" ] || { echo "expected $expected" >&2; exit 1; }

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-Linux-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-Linux-

      - name: Cache the pinned nixpkgs tree
        id: nixpkgs-cache
        uses: actions/cache@v5
        with:
          path: nixpkgs-ref
          key: parity-nixpkgs-${{ runner.os }}-${{ env.NIXPKGS_REV }}

      - name: Fetch the pinned nixpkgs tree
        if: steps.nixpkgs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init nixpkgs-ref
          git -C nixpkgs-ref remote add origin https://github.com/NixOS/nixpkgs
          git -C nixpkgs-ref fetch --depth 1 origin "$NIXPKGS_REV"
          git -C nixpkgs-ref checkout --detach FETCH_HEAD

      # Validate cache hits too; neither evaluator may silently use another
      # revision or a modified tracked file from a restored tree.
      - name: Verify nixpkgs (both evaluators read this same tree)
        run: |
          set -euo pipefail
          actual=$(git -C nixpkgs-ref rev-parse HEAD)
          echo "nixpkgs rev: $actual"
          [ "$actual" = "$NIXPKGS_REV" ] || { echo "unexpected nixpkgs revision" >&2; exit 1; }
          git -C nixpkgs-ref diff --exit-code HEAD --
          [ -z "$(git -C nixpkgs-ref ls-files --others --exclude-standard)" ] \
            || { echo "unexpected untracked files in nixpkgs" >&2; exit 1; }
          echo "NIXPKGS=$PWD/nixpkgs-ref" >> "$GITHUB_ENV"

      - name: Upstream Nix drvPath (the oracle)
        run: |
          REF=$(nix-instantiate \
            -E '(import <nixpkgs> { system = "x86_64-linux"; config = {}; overlays = []; }).hello' \
            -I nixpkgs="$NIXPKGS")
          echo "upstream: $REF"
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Build nova-nix
        run: cabal build exe:nova-nix

      - name: nova-nix drvPath
        run: |
          RAW=$(cabal run -v0 nova-nix -- eval \
            --expr '(import <nixpkgs> { system = "x86_64-linux"; config = {}; overlays = []; }).hello.drvPath' \
            --nix-path nixpkgs="$NIXPKGS" --nix-path nix="$PWD/data/nix")
          NOVA=$(printf '%s' "$RAW" | tr -d '"' | tail -n1)
          echo "nova-nix: $NOVA"
          echo "NOVA=$NOVA" >> "$GITHUB_ENV"

      # A dependent derivation with a multi-output input: anchors the
      # input-derivation-modulo substitution (and output-name sorting)
      # against upstream, which run-to-run determinism alone cannot - a
      # consistently wrong hash would also be deterministic.
      - name: Upstream Nix dependent drvPath (the oracle)
        run: |
          DEPREF=$(nix-instantiate "$PWD/.github/parity/dependent.nix")
          echo "upstream dependent: $DEPREF"
          echo "DEPREF=$DEPREF" >> "$GITHUB_ENV"

      - name: nova-nix dependent drvPath
        run: |
          RAW=$(cabal run -v0 nova-nix -- eval \
            --expr "(import $PWD/.github/parity/dependent.nix).drvPath")
          DEPNOVA=$(printf '%s' "$RAW" | tr -d '"' | tail -n1)
          echo "nova-nix dependent: $DEPNOVA"
          echo "DEPNOVA=$DEPNOVA" >> "$GITHUB_ENV"

      - name: Compare
        run: |
          echo "upstream nix : $REF"
          echo "nova-nix     : $NOVA"
          echo "upstream dep : $DEPREF"
          echo "nova-nix dep : $DEPNOVA"
          FAIL=0
          if [ "$REF" = "$NOVA" ]; then
            echo "::notice title=Parity OK::nova-nix hello.drvPath byte-matches upstream Nix"
          else
            echo "::error title=Parity mismatch::nova-nix and upstream Nix disagree on hello.drvPath"
            FAIL=1
          fi
          if [ "$DEPREF" = "$DEPNOVA" ]; then
            echo "::notice title=Parity OK::dependent drvPath byte-matches upstream Nix"
          else
            echo "::error title=Parity mismatch::nova-nix and upstream Nix disagree on the dependent drvPath"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi

      # The drvPath oracle above agrees or it does not; what it cannot do is
      # say WHERE a disagreement lives, and it only exercises whatever
      # nixpkgs' hello happens to reach.  This runs a case set through both
      # evaluators and names the expressions that differ, so the next
      # divergence arrives as the expression that demonstrates it rather
      # than as a hash that is off by everything.
      - name: Evaluation case set vs upstream Nix
        run: |
          NOVA_NIX_BIN=$(cabal list-bin exe:nova-nix) .github/parity/eval-cases.sh
