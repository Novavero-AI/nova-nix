name: Parity

# Proves the EVALUATOR is correct: nova-nix's computed hello.drvPath must
# byte-match what upstream Nix (nix-instantiate) computes from the SAME
# nixpkgs tree.  A derivation store-path hash transitively encodes the hash
# of every input derivation, so one matching path validates the whole
# build-time closure at once.
#
# Linux-only on purpose: it is the one place a real Nix exists to diff
# against.  The "runs natively on Windows" claim is proven separately by the
# Windows build job; this job proves the evaluation it does is correct.

on:
  workflow_dispatch:
  # Promote to `push: { branches: [main] }` once green to make it a
  # permanent regression guard.

jobs:
  parity:
    name: drvPath vs upstream Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ~/.cabal/store
          key: cabal-Linux-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-Linux-

      - name: Fetch nixpkgs (both evaluators read this same tree)
        run: |
          git clone --depth 1 --branch nixos-24.11 https://github.com/NixOS/nixpkgs nixpkgs-ref
          echo "NIXPKGS=$PWD/nixpkgs-ref" >> "$GITHUB_ENV"
          echo "nixpkgs rev: $(git -C nixpkgs-ref rev-parse HEAD)"

      - name: Upstream Nix drvPath (the oracle)
        run: |
          REF=$(nix-instantiate \
            -E '(import <nixpkgs> { system = "x86_64-linux"; config = {}; overlays = []; }).hello' \
            -I nixpkgs="$NIXPKGS")
          echo "upstream: $REF"
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Build nova-nix
        run: cabal build exe:nova-nix

      - name: nova-nix drvPath
        run: |
          RAW=$(cabal run -v0 nova-nix -- eval \
            --expr '(import <nixpkgs> { system = "x86_64-linux"; config = {}; overlays = []; }).hello.drvPath' \
            --nix-path nixpkgs="$NIXPKGS" --nix-path nix="$PWD/data/nix")
          NOVA=$(printf '%s' "$RAW" | tr -d '"' | tail -n1)
          echo "nova-nix: $NOVA"
          echo "NOVA=$NOVA" >> "$GITHUB_ENV"

      - name: closure diff (debug)
        run: |
          set +e
          E='(import <nixpkgs> { system = "x86_64-linux"; config = {}; overlays = []; })'
          cabal run -v0 nova-nix -- eval --aterm --recursive --expr "$E.hello" --nix-path nixpkgs="$NIXPKGS" --nix-path nix="$PWD/data/nix" > nova.tsv 2>/dev/null
          nix derivation show "$REF" -r > up.json
          echo "nova drvs: $(wc -l < nova.tsv)  upstream drvs: $(jq 'length' up.json)"
          cut -f1 nova.tsv | sort > nova_paths.txt
          jq -r 'keys[]' up.json | sort > up_paths.txt
          comm -23 nova_paths.txt up_paths.txt > divergent.txt
          echo "matching: $(comm -12 nova_paths.txt up_paths.txt | wc -l)  divergent: $(wc -l < divergent.txt)"
          echo "===== ROOTS (divergent, but all inputs match) ====="
          : > roots.txt
          while IFS=$'\t' read -r dp aterm; do
            grep -qxF "$dp" divergent.txt || continue
            isroot=1
            for ip in $(printf '%s' "$aterm" | grep -oE '/nix/store/[a-z0-9]{32}-[^"]*\.drv'); do
              grep -qxF "$ip" divergent.txt && { isroot=0; break; }
            done
            [ "$isroot" = 1 ] && echo "$dp" >> roots.txt
          done < nova.tsv
          sort -u roots.txt
          echo "===== first root: normalized diff (< nova | > upstream), store hashes masked ====="
          ROOT=$(sort -u roots.txt | head -1)
          NAME=$(printf '%s' "$ROOT" | sed -E 's#.*/[a-z0-9]{32}-##; s#\.drv$##')
          echo "root: $ROOT  (name: $NAME)"
          NOVA_AT=$(awk -F'\t' -v r="$ROOT" '$1==r{print $2; exit}' nova.tsv)
          UPDRV=$(jq -r --arg n "$NAME" 'to_entries[]|select(.value.name==$n)|.key' up.json | head -1)
          UP_AT=$(cat "$UPDRV" 2>/dev/null)
          norm() { printf '%s' "$1" | sed -E 's#/nix/store/[a-z0-9]{32}-#@#g; s#\),\(#),\n(#g'; }
          diff <(norm "$NOVA_AT") <(norm "$UP_AT")

      - name: Compare
        run: |
          echo "upstream nix : $REF"
          echo "nova-nix     : $NOVA"
          if [ "$REF" = "$NOVA" ]; then
            echo "::notice title=Parity OK::nova-nix hello.drvPath byte-matches upstream Nix"
          else
            echo "::error title=Parity mismatch::nova-nix and upstream Nix disagree on hello.drvPath"
            exit 1
          fi
