name: Parity

# Proves the EVALUATOR is correct: for every case in
# .github/parity/drvpath-cases.txt, nova-nix's computed drvPath must
# byte-match what upstream Nix (nix-instantiate) computes from the SAME
# nixpkgs tree.  A derivation store-path hash transitively encodes the hash
# of every input derivation, so one matching path validates the whole
# build-time closure at once.  Beside the evaluator, it checks that upstream
# substitutes from a binary cache that `nova-nix push` writes to a directory,
# and that a profile nova-nix keeps goes through the generations upstream's
# does.
#
# Linux-only on purpose: it is the one place a real Nix exists to diff
# against.  The "runs natively on Windows" claim is proven separately by the
# Windows build job; this job proves the evaluation it does is correct.

on:
  workflow_dispatch:
  # Reusable: the publish workflow runs this on the exact tagged commit,
  # so nothing reaches Hackage without the drvPath oracle passing there.
  workflow_call:
  # Always report, including documentation-only PRs and the merge queue.
  # A draft pull request runs no job until it is marked ready for review,
  # as in ci.yml (the comment above its ASCII source), whose pull_request
  # types these are.  The oracle inputs below are fixed, so upstream churn
  # cannot change the meaning of this gate between two runs of the same
  # commit.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight, so that one
# is cancelled.  A run on main or in the merge queue is not cancelled once
# it starts, but one still waiting when a newer run joins the group is:
# GitHub cancels a group's pending run, here as in ci.yml's group.
concurrency:
  group: parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: Nix ${{ matrix.nix }}, nixpkgs ${{ matrix.channel }}
    # A push to main by the merge queue carries the commit its merge group's
    # run tested, here as in ci.yml, so the rows skip it.  A push by anyone
    # else reaches main untested and runs them.  A draft pull request runs
    # none, as it runs no job of ci.yml's.
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest pairing held, the current stable channel with the Nix
        # it defaults to, and the newest of both.  Bump a row deliberately,
        # independently of changes to the evaluator, so that a red row
        # means nova-nix changed.
        include:
          - channel: "24.11"
            nix: "2.24.9"
            rev: 50ab793786d9de88ee30ec4e4c24fb4236fc2674
          - channel: "26.05"
            nix: "2.34.9"
            rev: 6f06d204d8f2d8761d9da78778745974a3216381
          - channel: unstable
            nix: "2.36.0"
            rev: 619c39f6eac5d1ed6b8f073a9414baf7034b2356
    # An evaluator that loops on one case would otherwise hold the runner
    # for GitHub's six-hour default.
    timeout-minutes: 30
    env:
      NIX_VERSION: ${{ matrix.nix }}
      NIXPKGS_REV: ${{ matrix.rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install

      - name: Verify the oracle version
        run: |
          set -euo pipefail
          actual=$(nix-instantiate --version)
          expected="nix-instantiate (Nix) $NIX_VERSION"
          echo "$actual"
          [ "$actual" = "$expected" ] || { echo "expected $expected" >&2; exit 1; }

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # The store's key names this plan (.github/actions/cabal-store).
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      - name: Restore the pinned nixpkgs tree
        id: nixpkgs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nixpkgs-ref
          key: parity-nixpkgs-${{ runner.os }}-${{ env.NIXPKGS_REV }}

      - name: Fetch the pinned nixpkgs tree
        if: steps.nixpkgs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init nixpkgs-ref
          git -C nixpkgs-ref remote add origin https://github.com/NixOS/nixpkgs
          git -C nixpkgs-ref fetch --depth 1 origin "$NIXPKGS_REV"
          git -C nixpkgs-ref checkout --detach FETCH_HEAD

      # Validate cache hits too; neither evaluator may silently use another
      # revision or a modified tracked file from a restored tree.
      - name: Verify nixpkgs (both evaluators read this same tree)
        run: |
          set -euo pipefail
          actual=$(git -C nixpkgs-ref rev-parse HEAD)
          echo "nixpkgs rev: $actual"
          [ "$actual" = "$NIXPKGS_REV" ] || { echo "unexpected nixpkgs revision" >&2; exit 1; }
          git -C nixpkgs-ref diff --exit-code HEAD --
          [ -z "$(git -C nixpkgs-ref ls-files --others --exclude-standard)" ] \
            || { echo "unexpected untracked files in nixpkgs" >&2; exit 1; }
          echo "NIXPKGS=$PWD/nixpkgs-ref" >> "$GITHUB_ENV"

      - name: Build nova-nix
        id: build
        run: cabal build exe:nova-nix

      # One row per case, both evaluators reading the tree verified above;
      # any mismatch or failure in either evaluator fails the step.  The
      # fetchgit case fetches a pinned rev from GitHub during evaluation,
      # the host this job already depends on for the checkout and nixpkgs.
      - name: drvPath cases vs upstream Nix
        run: |
          NOVA_NIX_BIN=$(cabal list-bin exe:nova-nix) .github/parity/drvpath-cases.sh

      # The drvPath cases agree or they do not; what they cannot do is say
      # WHERE inside a closure a disagreement lives.  This runs a case set
      # through both evaluators and names the expressions that differ, so
      # the next divergence arrives as the expression that demonstrates it
      # rather than as a hash that is off by everything.  It runs when the
      # drvPath cases fail, which is when it is needed.
      - name: Evaluation case set vs upstream Nix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NOVA_NIX_BIN=$(cabal list-bin exe:nova-nix) .github/parity/eval-cases.sh

      # What a program can observe of `derivation`, which nova-nix defines
      # in Nix source of its own: every probe in test/data's corpus for
      # every argument, through both evaluators.  It runs when the drvPath
      # cases fail too, since a wrapper that differs fails those first and
      # this names how.
      - name: derivation probes vs upstream Nix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NOVA_NIX_BIN=$(cabal list-bin exe:nova-nix) .github/parity/derivation-cases.sh

      # A file:// cache that nova-nix pushes, signed with a key made for the
      # run and then made read-only, which this row's upstream must
      # substitute from under that key and refuse under another.  It reads nothing of the nixpkgs tree, so
      # it runs whatever the evaluator cases found.
      - name: Upstream substitutes from a cache nova-nix pushes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NOVA_NIX_BIN=$(cabal list-bin exe:nova-nix) .github/parity/push-cases.sh

      # One sequence of changes to a profile on each side, compared after
      # every step, and a builtin:buildenv derivation in buildenv.nix's shape
      # built by both.  A profile's tree links into /nix/store, so nova-nix's
      # side runs in a private mount namespace with a scratch directory over
      # /nix, as this user, through sudo.  It reads nothing of the nixpkgs
      # tree, so it runs whatever the evaluator cases found.
      - name: Profiles and builtin:buildenv vs upstream Nix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NOVA_NIX_BIN=$(cabal list-bin exe:nova-nix) .github/parity/profile-cases.sh

  # The one context branch protection requires of this workflow, so that
  # bumping a matrix row leaves the required name unchanged.  A required
  # check that is skipped counts as passed, so this job runs whatever the
  # rows did and passes only when every row succeeded.
  gate:
    name: Parity
    needs: [parity]
    # Skipped with the rows on a push by the merge queue and on a draft,
    # where always() would otherwise run it and fail it on rows that never
    # ran.
    if: ${{ always() && !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every row passed
        env:
          ROWS: ${{ needs.parity.result }}
        run: test "$ROWS" = success
