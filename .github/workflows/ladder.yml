          retention-days: 1

      # What this job built and its checks ran on (.github/cache/publish.sh).
      - name: Publish the stage to the public cache
        if: inputs.publish
        shell: bash
        env:
          NOVA_CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
        run: bash .github/cache/publish.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # The config.log files of a build that failed, from the directory it
      # kept: configure writes each test's commands and what they printed
      # there, and only its verdicts to the job's log.  A job that failed
      # anywhere but a build, or in a build that runs no configure, has
      # none.  The builds are under the store's .nova-nix, a hidden
      # directory.  Kept two weeks: a failure is read within days of its
      # run, and one that stands fails the next run too, which uploads its
      # own.
      - name: Upload a failed build's config.log files
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-logs-native-x86_64-${{ inputs.os }}
          path: C:\nix\store\.nova-nix\builds\**\config.log
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Stdenv: the package set's stdenv, the seed stdenv's builder and tools
  # with the native x86_64 toolchain, whose compilers and linker its
  # builds run through the wrappers stdenv.cc writes, and GNU Hello built
  # with it, which runs here and names neither the store directory nor its
  # build directory, and the set's other five packages built with it,
  # which work.
  # test/data/stdenv.nix's flags has the stdenv's commands compile
  # and link programs, and finds C compiled at -std=gnu17 and C++ at the
  # compiler's default, no time stamp in a program any of them links, and
  # no directory that a variable of the environment names among those the
  # compiler searches.
  #
  # The timeout is twice an estimate of this stage on the ARM64 leg, about
  # 22 minutes: on x64 the stage takes about 7 minutes, Hello 2 of them and
  # the five other packages 4, and the seed stdenv's Hello takes three
  # times as long on ARM64 as on x64.
  # ---------------------------------------------------------------------------
  stdenv-windows:
    name: Stdenv
    needs: [native-x86_64-windows]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 44
    environment:
      name: ${{ inputs.publish && 'cache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nova-nix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ladder-nova-nix
          path: ${{ runner.temp }}

      - name: Download the handoff server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ladder-handoff-server
          path: ${{ runner.temp }}/handoff-server

      - name: Download the Native x86_64 stage's handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handoff-native-x86_64-${{ inputs.os }}
          path: ${{ runner.temp }}/handoff

      # The keep-failed setting, which -K turns on, for every build below:
      # a build that fails keeps its directory, under the store's
      # .nova-nix\builds, for the job's last step to upload from.  It goes
      # in the machine-wide nix.conf, which nova-nix reads on Windows from
      # %ProgramData%\nix, since the steps below replace NIX_CONFIG with
      # the substituters they name.
      - name: Keep a failed build's directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ProgramData\nix" | Out-Null
          Set-Content -Path "$env:ProgramData\nix\nix.conf" -Value 'keep-failed = true'

      - name: Serve the handoff
        shell: bash
        run: bash .github/cache/handoff-serve.sh "$RUNNER_TEMP/handoff-server/bin/nova-cache-server.exe" "$RUNNER_TEMP/handoff"

      # The handoff for every step below: what a stage before this one
      # built, the sources among it, comes from there.
      - name: Name the handoff as a substituter
        shell: bash
        run: bash .github/cache/name-substituters.sh "$HANDOFF_URL" "$HANDOFF_PUBLIC_KEY"

      # The rungs of the stage before (pkgs/windows/rungs.nix), each from the
      # handoff, which holds them all.  The script fails if one is built: a
      # handoff that answers and cannot be used would have this job build
      # the stages before it again and stay green.  It runs before the
      # public cache is named, which would serve an unchanged rung in the
      # handoff's place.  The builds below take what else they reach of
      # the stages before from the handoff.
      - name: Take the Native x86_64 stage's rungs from the handoff
        shell: bash
        run: CACHE_URL=$HANDOFF_URL bash .github/cache/substitute-rungs.sh "$RUNNER_TEMP/bin/nova-nix.exe" native-x86_64 fail

      # Substitute mode names the public cache after the handoff, so that
      # only what no stage before this one built comes from it.
      - name: Name the handoff and the public cache as substituters
        if: inputs.mode == 'substitute'
        shell: bash
        run: bash .github/cache/name-substituters.sh "$HANDOFF_URL" "$HANDOFF_PUBLIC_KEY" "$CACHE_URL" "$CACHE_PUBLIC_KEY"

      # This stage's rungs, each downloaded where the public cache holds it
      # and built where the change alters it.  The script fails if a rung
      # the cache holds is built, for the reason the handoff's check does.
      # The build steps below then find each rung valid, and the time each
      # prints is the time to find it so.
      - name: Take the unchanged rungs from the public cache
        if: inputs.mode == 'substitute'
        shell: bash
        run: bash .github/cache/substitute-rungs.sh "$RUNNER_TEMP/bin/nova-nix.exe" stdenv build

      # The stdenv's wrappers, and GNU Hello built with it: pkgs/windows'
      # hello package, configured, compiled and installed by busybox's sh,
      # its applets, GNU make and the native x86_64 toolchain through the
      # wrappers, each timed.
      - name: Build GNU Hello with the stdenv
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A stdenv.cc
          echo "== stdenv.cc built in $((SECONDS - start)) s"
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/stdenv.nix -A hello
          echo "== hello built in $((SECONDS - start)) s"

      # hello prints its greeting, or the one --greeting gives it, and its
      # version, each line ending in a carriage return, as msvcrt's
      # text-mode stdout writes it.  Each greeting is checked against bytes
      # the runner's own printf writes, and the first line of --version
      # with its carriage return removed.
      - name: GNU Hello built with the stdenv runs
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/stdenv.nix -A hello | tail -n 1); then
            echo "::error::hello did not build"
            exit 1
          fi
          hello=$(cygpath -u "$out")/bin/hello.exe
          work="$(cygpath -u "$RUNNER_TEMP")/stdenv-hello"
          mkdir "$work"
          status=0
          runs() {
            local want_out=$1 code=0
            shift
            "$hello" "$@" > "$work/out.txt" || code=$?
            printf '%s\r\n' "$want_out" > "$work/want.txt"
            if [ "$code" = 0 ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    hello.exe${*:+ $*} prints $want_out"
            else
              echo "::error::hello.exe${*:+ $*} exited $code and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs 'Hello, world!'
          runs 'Hello from the stdenv' --greeting='Hello from the stdenv'
          code=0
          out=$("$hello" --version) || code=$?
          version=${out%%$'\n'*}
          version=${version%$'\r'}
          if [ "$code" = 0 ] && [ "$version" = 'hello (GNU Hello) 2.12.3' ]; then
            echo "ok    hello.exe --version prints $version"
          else
            echo "::error::hello.exe --version exited $code and printed $version"
            status=1
          fi
          exit "$status"

      # GNU Hello as the stdenv builds it, with the default CFLAGS its
      # config.site gives configure, names neither the store directory nor
      # its build directory (.github/bootstrap/no-build-path.sh says why).
      - name: GNU Hello built with the stdenv names no store or build directory
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/stdenv.nix -A hello | tail -n 1); then
            echo "::error::hello did not build"
            exit 1
          fi
          bash .github/bootstrap/no-build-path.sh hello "$out" bin/hello.exe

      # test/data/stdenv.nix's flags has busybox's sh run
      # stdenv-flags/flags.sh with the stdenv's PATH: gcc, cc, g++
      # and c++ by name, gcc with -std=c99 and from a make recipe, each
      # compile and link a program that prints the standard it was compiled
      # as, ld links one, and each program's line has the time stamp of its
      # PE header; gcc -v exits 0; and for each variable that names
      # directories GCC searches, the stdenv's gcc and g++ name no directory
      # it names where gcc-native-x86_64's own drivers do.  The lines are
      # compared with test/data/stdenv-flags-answer.txt.
      - name: The stdenv's compilers take C at gnu17, link with no time stamp and search no directory from the environment
        shell: bash
        run: |
          set -uo pipefail
          expected=test/data/stdenv-flags-answer.txt
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/stdenv.nix -A flags | tail -n 1); then
            echo "::error::flags did not build"
            exit 1
          fi
          lines=$(cygpath -u "$out")
          if cmp "$expected" "$lines"; then
            echo "ok    flags wrote the lines of $expected"
          else
            echo "::error::flags' lines differ from $expected:"
            diff "$expected" "$lines"
            exit 1
          fi

      # The set's five other packages, each with the stdenv: GNU sed, from
      # a .tar.xz; zlib, through its own win32 makefile, as a DLL with its
      # import library; libgreet, a static library from a directory; and
      # zdemo and greeter, programs linking zlib and libgreet as
      # buildInputs.  Each is timed.
      - name: Build the set's other packages with the stdenv
        shell: bash
        run: |
          set -euo pipefail
          for package in sed zlib libgreet zdemo greeter; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/stdenv.nix -A "$package"
            echo "== $package built in $((SECONDS - start)) s"
          done

      # What each package is for: sed substitutes and names its version;
      # zlib installs its DLL, import library, static library and header,
      # and libgreet its library and header; zdemo carries zlib1.dll beside
      # it, which the stdenv's fixup phase copied from zlib, and runs,
      # round-tripping a string through the zlib it names; greeter prints
      # libgreet's greeting.  A program's lines end in a carriage return, as
      # msvcrt's text-mode stdout writes them, which is removed before a
      # line is compared.  Each check reads its program's output through a
      # pipe into the step's own shell (lastpipe), so a failure reaches
      # the step's exit status.
      - name: The set's other packages built with the stdenv work
        shell: bash
        run: |
          set -uo pipefail
          shopt -s lastpipe
          status=0
          outputOf() {
            local out
            if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/stdenv.nix -A "$1" | tail -n 1); then
              echo "::error::$1 did not build" >&2
              return 1
            fi
            cygpath -u "$out"
          }
          has() {
            if [ -e "$1/$2" ]; then
              echo "ok    $3 has $2"
            else
              echo "::error::$3 has no $2"
              status=1
            fi
          }
          prints() {
            local label=$1 want=$2 got
            got=$(tr -d '\r')
            if printf '%s\n' "$got" | grep -qxF -- "$want"; then
              echo "ok    $label prints $want"
            else
              echo "::error::$label does not print $want; it printed:"
              printf '%s\n' "$got" | head -n 8
              status=1
            fi
          }
          sed=$(outputOf sed) || exit 1
          printf 'abc\n' | "$sed/bin/sed.exe" s/b/x/ | prints "sed s/b/x/ of abc" axc
          # The first line of --version names the program as it was run,
          # here by its path, then the package and its version.
          version=$("$sed/bin/sed.exe" --version | head -n 1 | tr -d '\r')
          case $version in
            *" (GNU sed) 4.10") echo "ok    sed --version names GNU sed 4.10" ;;
            *) echo "::error::sed --version printed $version"; status=1 ;;
          esac
          zlib=$(outputOf zlib) || exit 1
          for file in bin/zlib1.dll lib/libz.dll.a lib/libz.a include/zlib.h; do
            has "$zlib" "$file" zlib
          done
          libgreet=$(outputOf libgreet) || exit 1
          for file in lib/libgreet.a include/greet.h; do
            has "$libgreet" "$file" libgreet
          done
          zdemo=$(outputOf zdemo) || exit 1
          has "$zdemo" bin/zlib1.dll zdemo
          zdemoOut=$("$zdemo/bin/zdemo.exe") || { echo "::error::zdemo.exe exited $?"; status=1; }
          printf '%s\n' "$zdemoOut" | prints zdemo.exe "linked zlib version: 1.3.2"
          printf '%s\n' "$zdemoOut" | prints zdemo.exe "round-trip: OK"
          greeter=$(outputOf greeter) || exit 1
          "$greeter/bin/greeter.exe" | prints greeter.exe "Hello from libgreet, a dependency built from source by nova-nix!"
          exit "$status"

      # A job whose handoff never served has no server to stop.
      - name: Stop the handoff server
        if: ${{ !cancelled() }}
        shell: pwsh
        run: if ($env:HANDOFF_SERVER_PID) { Stop-Process -Id $env:HANDOFF_SERVER_PID }

      # What this job built and its checks ran on (.github/cache/publish.sh).
      - name: Publish the stage to the public cache
        if: inputs.publish
        shell: bash
        env:
          NOVA_CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
        run: bash .github/cache/publish.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # The config.log files of a build that failed, from the directory it
      # kept: configure writes each test's commands and what they printed
      # there, and only its verdicts to the job's log.  A job that failed
      # anywhere but a build, or in a build that runs no configure, has
      # none.  The builds are under the store's .nova-nix, a hidden
      # directory.  Kept two weeks: a failure is read within days of its
      # run, and one that stands fails the next run too, which uploads its
      # own.
      - name: Upload a failed build's config.log files
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-logs-stdenv-${{ inputs.os }}
          path: C:\nix\store\.nova-nix\builds\**\config.log
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
