name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  ascii:
    name: ASCII source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source must be ASCII-only
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.hs' '*.c' '*.h' '*.nix' '*.sh' '*.cabal' '*.md'; then
            echo "Non-ASCII characters found above; keep the source ASCII-only (no smart quotes, em-dashes, or Unicode arrows)."
            exit 1
          fi

  hlint:
    name: HLint
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.8"
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: warning

  ormolu:
    name: Ormolu
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/run-ormolu@v17
        with:
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs

  c99-lint:
    name: C99 Strict
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile C99 with strict warnings
        run: |
          for f in cbits/*.c; do
            echo "Checking $f ..."
            gcc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -Icbits "$f"
          done

  cabal-check:
    name: Cabal Check
    needs: [hlint, ormolu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "latest"
      - name: Validate package
        run: cabal check

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.os }})
    needs: [cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.8"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Build
        run: cabal build --ghc-options="-Werror"

      - name: Test
        run: cabal test
