name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.8"
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: warning

  ormolu:
    name: Ormolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/run-ormolu@v16
        with:
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs

  cabal-check:
    name: Cabal Check
    needs: [hlint, ormolu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "latest"
      - name: Validate package
        run: cabal check

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.os }})
    needs: [cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            C:\cabal\store
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Build
        run: cabal build --ghc-options="-Werror"

      - name: Test
        run: cabal test

  # ---------------------------------------------------------------------------
  # Seed nova-cache (Linux + macOS, main branch only)
  # ---------------------------------------------------------------------------

  seed-cache:
    name: Seed Cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v30

      - uses: Novavero-AI/nova-cache/.github/actions/seed@main
        with:
          cache-url: https://cache.novavero.ai
          api-key: ${{ secrets.NOVA_CACHE_API_KEY }}

  # ---------------------------------------------------------------------------
  # Publish to Hackage (tag-triggered, after all builds pass)
  # ---------------------------------------------------------------------------

  publish:
    name: Publish to Hackage
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version:.*/version:            $TAG_VERSION/" nova-nix.cabal
          echo "Set version to $TAG_VERSION"

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            C:\cabal\store
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Build sdist
        run: cabal sdist

      - name: Upload to Hackage
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          SDIST=$(ls dist-newstyle/sdist/nova-nix-*.tar.gz)
          curl --fail --silent --show-error \
            --header "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            --form "package=@${SDIST}" \
            https://hackage.haskell.org/packages/
