name: CI

# The checks a change needs before it merges, run on each pull request
# that is ready for review, in the merge queue and on main.  The seed
# ladder and the publishing to the public cache are workflows of their own
# (seed-ladder.yml, public-cache.yml), each with the triggers it needs.
on:
  push:
    branches: [main]
  # No base-branch filter on pull_request: a stacked PR bases on its
  # predecessor, not main, and a [main] filter leaves it checkless -
  # unmergeable under branch protection's required contexts.  The types
  # are GitHub's default three and ready_for_review, which starts the run
  # of a draft marked ready: a draft runs no job (the comment above ASCII
  # source).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue tests each entry against a temporary
  # gh-readonly-queue/main branch, so every required check must also
  # report there or the queue times the context out to a failure and
  # ejects the pull request.  Same jobs, matched by check name.
  # checks_requested is the only activity type the event has.
  merge_group:
    types: [checks_requested]
  workflow_call:
  # Runs every job on any branch, a draft pull request's included.
  workflow_dispatch:


# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight, so that one
# is cancelled.  A run on main is the verdict on a commit in main's history
# and a merge group's run is the queue's evidence for its merge, so neither
# is cancelled once it starts; one still waiting when a newer run joins the
# group is, as GitHub cancels a group's pending run.  The event is in the
# group so that a run seed.yml calls on main neither waits behind nor
# cancels a push's.  pr-closed.yml spells a pull request's group out to
# cancel its run once it closes, so a change to the group changes it too.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The public cache's address and signing key: E2E (Windows) and the Stage0
# legs take every source pkgs/windows fetches from it.  seed-ladder.yml and
# public-cache.yml spell the same two, and test/Test/Pkgs.hs holds the three to
# one of each.  publish.yml's installer check spells them inline, as
# install-nova-nix's own check does, so a cache move or a key rotation
# edits all four.
env:
  CACHE_URL: https://cache.novavero.ai
  CACHE_PUBLIC_KEY: cache.novavero.ai-1:9gQ7tLWMM+2tdC9H5sKMJltDIPfD7X2GWlZe8Aa8hHQ=

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  # A push to main by the merge queue carries the commit its merge group's
  # run tested, since the queue moves main to that commit, and that run ran
  # every job here there, so each skips on such a push.  A push by anyone
  # else reaches main untested and runs every job.  github.actor stays the
  # queue when such a run is re-run.  What a merge group's run does not
  # run, the ladder and the publishing to the public cache, are workflows
  # of their own (seed-ladder.yml, public-cache.yml) and run on every push
  # to main.
  #
  # A draft pull request runs no job until it is marked ready for review,
  # which runs every job.  A draft is pushed to again before it merges,
  # often rebased once the pull request it stacks on merges, so its runs
  # are mostly thrown away.  A check a draft reports as skipped counts as
  # passed under branch protection and admits nothing: a draft cannot be
  # merged, and the merge queue runs every job on its merge group.  Every
  # other event has no github.event.pull_request, which the
  # condition reads as no draft; a run that seed.yml or publish.yml calls
  # has its caller's event, a schedule or a tag's push.
  #
  # Each job states both conditions, rather than leaving them to a skipped
  # need, so that they hold whatever the job comes to need.
  ascii:
    name: ASCII source
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source must be ASCII-only
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.hs' '*.c' '*.h' '*.nix' '*.sh' '*.cabal' '*.md'; then
            echo "Non-ASCII characters found above; keep the source ASCII-only (no smart quotes, em-dashes, or Unicode arrows)."
            exit 1
          fi

  # The workflows lint everything but themselves: Haskell, C and source
  # encoding are all covered, while a .github/workflows change is validated
  # only by GitHub agreeing to parse it after the push.  actionlint checks
  # `uses:` refs, ${{ }} expressions, matrix references, job dependencies,
  # and runs shellcheck over every `run:` block.  Pinned rather than
  # floating: a lint that changes under you turns an unrelated PR red.
  actionlint:
    name: Actionlint
    needs: [ascii]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the workflows
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

  # Fragments are pasted into CHANGELOG.md verbatim at release, so a malformed
  # one is only noticed while cutting the release, which is the worst time.
  changelog:
    name: Changelog fragments
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fragments are well-formed
        run: |
          status=0
          for fragment in changelog.d/*.md; do
            [ -e "$fragment" ] || continue
            if ! head -n1 "$fragment" | grep -q '^- \*\*'; then
              echo "$fragment: must open with a bold lead, '- **...**'" >&2
              status=1
            fi
            if [ ! -s "$fragment" ]; then
              echo "$fragment: is empty" >&2
              status=1
            fi
          done
          exit $status

      # The release notes are the fragments the assembly script prints, so a
      # fragment it drops is a change the release leaves out.
      - name: The assembly script prints every fragment once
        run: bash scripts/assemble-changelog-cases.sh

  hlint:
    name: HLint
    needs: [ascii]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
        with:
          version: "3.10"
      - uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2.4.10
        with:
          path: '["src/", "cli/", "app/", "test/"]'
          fail-on: warning

  ormolu:
    name: Ormolu
    needs: [ascii]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version the repo is formatted with: formatting is
      # not stable across ormolu releases, and a floating version would
      # fail CI on untouched code when upstream ships one.  Upgrades
      # bump this and the local binary together.
      #
      # Built from Hackage, not fetched prebuilt: run-ormolu@v21
      # downloads binaries from mrkkrp/ormolu, and that repository
      # vanished from GitHub on 2026-08-20, taking every prebuilt
      # ormolu with it (the action then misreports the 404 as
      # "unformatted files").  The Hackage build depends on nothing but
      # the package index; the binary caches.yml saves from main makes a
      # run seconds.
      # Undo into the action if prebuilt assets return to a stable home
      # a released run-ormolu points at.
      - name: Restore the formatter binary
        id: formatter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/ormolu
          key: ormolu-0.9.0.0-${{ runner.os }}

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Build ormolu 0.9.0.0 from Hackage
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        run: cabal install ormolu-0.9.0.0 --install-method=copy --installdir="$HOME/.local/bin" --overwrite-policy=always

      - name: Check formatting
        run: git ls-files '*.hs' | xargs ormolu --mode check

  c99-lint:
    name: C99 Strict
    needs: [ascii]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The sources that build on Linux: test/cbits/nn_test_dacl.c and
      # sandbox/windows.c build on Windows alone, and sandbox/darwin.c on
      # macOS alone, against headers this runner does not have.  The macOS
      # build checks sandbox/darwin.c, and the Windows build
      # sandbox/windows.c and test/cbits/nn_test_sandbox_windows.c, which
      # builds here as the stubs it holds for every other OS.
      - name: Compile C99 with strict warnings
        run: |
          for f in cbits/*.c sandbox/*.c test/cbits/sandbox_check.c test/cbits/keyring.c test/cbits/process_wait.c test/cbits/nn_test_sandbox_windows.c; do
            case "$f" in sandbox/darwin.c | sandbox/windows.c) continue ;; esac
            echo "Checking $f ..."
            gcc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -Icbits -Isandbox "$f"
          done

  cabal-check:
    name: Cabal Check
    needs: [hlint, ormolu, c99-lint]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - name: Validate package
        run: cabal check

  # ---------------------------------------------------------------------------
  # Build from the sdist, exactly as a Hackage user does (Linux-only).
  # CI otherwise builds the git tree, where cabal.project and dev-only
  # settings apply; the tarball is what users install, and divergence
  # (files missing from the sdist, constraints that only exist in-repo)
  # is invisible without this job.
  # ---------------------------------------------------------------------------

  sdist:
    name: Build from sdist
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # Unpacked outside the checkout, where no cabal.project applies, and
      # planned there, with the plan copied into the checkout for hashFiles,
      # which reads the workspace alone.  The store's key names this plan
      # (.github/actions/cabal-store).
      - name: Unpack and plan the tarball a Hackage user gets
        run: |
          cabal sdist -o "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/sdist/nova-nix-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/nova-nix-*/
          cabal build --enable-tests --dry-run
          cp dist-newstyle/cache/plan.json "$GITHUB_WORKSPACE/sdist-plan.json"

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-sdist-${{ runner.os }}
          plan-hash: ${{ hashFiles('sdist-plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      - name: Build the tarball a Hackage user gets
        run: |
          cd "$RUNNER_TEMP"/nova-nix-*/
          cabal build --enable-tests

  # ---------------------------------------------------------------------------
  # Exercise the C data layer under ASan/UBSan (Linux-only).  The C99-strict
  # job only compiles; this one RUNS the full suite with instrumented cbits,
  # so memory errors and UB in the manual-memory surface (arena, attrset,
  # thunk, bytecode, ...) fail CI instead of lurking.  Linux is the host:
  # sanitizer support under mingw is unreliable, and the eval C layer is
  # platform-independent, so Linux execution is real coverage.  The
  # Windows-only nn_winfs body is compiled by the Windows build alone: the
  # strict job's Linux gcc compiles its stub.
  # ---------------------------------------------------------------------------

  sanitizers:
    name: ASan/UBSan
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # Dependencies build unsanitized (the flags below are scoped to this
      # package), so the Linux store applies as-is.  The plan is made before
      # the flags are written, as every other Linux job makes it.
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      # Scoped via cabal.project.local so only this package's cbits compile
      # instrumented and only its executables link the sanitizer runtimes -
      # a command-line --ghc-options would rebuild every dependency too.
      # -fno-sanitize-recover makes every UBSan report fatal rather than a
      # log line CI would scroll past.  No -Werror here: the warnings gate
      # is the build matrix; this job's signal is runtime findings.
      - name: Scope sanitizer flags to this package
        run: |
          {
            echo "package nova-nix"
            echo "  ghc-options: -optc-fsanitize=address,undefined -optc-fno-sanitize-recover=all -optl-fsanitize=address,undefined"
          } > cabal.project.local

      - name: Build with instrumented cbits
        run: cabal build --enable-tests

      # The sandbox helper builds instrumented too, and the suite's Linux
      # sandbox group runs it.  It runs with an empty environment, so
      # ASAN_OPTIONS below does not reach it and LeakSanitizer checks it.
      - name: Let the instrumented sandbox helper make namespaces
        uses: ./.github/actions/sandbox-helper

      # detect_leaks=0: LeakSanitizer would report the GHC RTS's deliberate
      # process-lifetime allocations, not cbits defects - the arena's
      # bulk-free discipline is exercised by the suite itself.
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: cabal test

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  #
  # The graph is two tiers by design: cheap textual gates run serially
  # (ascii -> lints -> cabal-check), then every expensive job - the build
  # matrix, sdist, sanitizers, e2e - runs in parallel off cabal-check.
  # They are independent verdicts on the same commit, and serializing them
  # would add their durations instead of taking their maximum: e2e alone
  # is ~20 minutes, so putting the matrix before it would slow every green
  # run by its full build time for no extra signal.
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.os }})
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHC's macOS bindist names the Command Line Tools SDK as a library
      # directory of its rts, so every link reads that SDK's .tbd stubs
      # whichever toolchain is selected.  A runner image can ship Command
      # Line Tools newer than its default Xcode, and that Xcode's ld then
      # fails on the stubs with "tapi error: malformed file" before
      # anything of ours is linked.  Selecting the Command Line Tools pairs
      # the SDK with its own ld.  The step precedes GHC's setup so that the
      # install sees the same toolchain as every build after it.  Drop it
      # once the pinned GHC's rts package config no longer names that SDK.
      - name: Use the Command Line Tools linker
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      # The GHC installation from the cache, made on this image and saved
      # by caches.yml (.github/actions/macos-ghc).  Linux and Windows images
      # carry the version already.
      - name: Restore the GHC installation (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-ghc
        with:
          ghc-version: "9.14.1"

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # The store's key names this plan (.github/actions/cabal-store).
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      # --enable-tests compiles the test suite under -Werror too (a bare
      # `cabal build` skips test components entirely, so test-code warnings
      # would never fail CI) and shares one solver plan with the test step.
      - name: Build
        run: cabal build --enable-tests --ghc-options="-Werror"

      # Haddock is the library's documentation, published to Hackage with
      # each release, so it is built on every change: an export with no
      # documentation, or a reference that names no identifier or more than
      # one, fails here rather than shipping.  A missing link destination in
      # another package only means its documentation is not installed, and
      # is not checked.
      - name: Haddock documents every export and resolves every reference
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          cabal haddock nova-nix:lib:nova-nix 2>&1 | tee haddock.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          coverage=$(grep -E '^ *[0-9]+% \( *[0-9]+ / *[0-9]+\) in ' haddock.log || true)
          if [ -z "$coverage" ]; then
            echo "::error::haddock printed no coverage report to check"
            exit 1
          fi
          failed=0
          if grep -vE '^ *100% ' <<<"$coverage"; then
            echo "::error::the modules above export names with no Haddock"
            failed=1
          fi
          if grep -E 'Warning: .* is (out of scope|ambiguous)' haddock.log; then
            echo "::error::the references above do not name exactly one identifier"
            failed=1
          fi
          exit "$failed"

      # The store probes its volume's case sensitivity, and the one
      # answer the runners cannot give on their own is the sensitive
      # one on macOS: the runner's disk is default APFS, which folds, so
      # the suite's store/case-sensitive-volume group would skip there
      # and a broken probe would pass.  A case-sensitive APFS image
      # attached for the test step makes the group run against the real
      # pathconf answer.  Linux needs none (its temp directory already
      # qualifies) and Windows answers by construction.  The runner is
      # discarded with the job, so nothing detaches it.
      - name: Attach a case-sensitive volume
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 64m -fs "Case-sensitive APFS" -volname nova-cs "$RUNNER_TEMP/nova-cs.dmg"
          hdiutil attach "$RUNNER_TEMP/nova-cs.dmg" -mountpoint "$RUNNER_TEMP/nova-cs" -nobrowse
          echo "NOVA_NIX_TEST_CASE_SENSITIVE_DIR=$RUNNER_TEMP/nova-cs" >> "$GITHUB_ENV"

      # The suite's Linux sandbox group runs the helper this job built, and
      # skips where the action has not named it.
      - name: Let the built sandbox helper make namespaces (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/sandbox-helper

      # The macOS sandbox backend builds against macOS's headers alone, so
      # the C99 Strict job, on Linux, leaves it to this step.
      - name: Compile the macOS sandbox backend as C99 with strict warnings (macOS)
        if: runner.os == 'macOS'
        run: cc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -Icbits -Isandbox sandbox/darwin.c

      # The Windows sandbox backend, and the Windows calls its tests make,
      # build against Windows' headers alone, so the C99 Strict job, on
      # Linux, leaves them to this step, which compiles each as the build
      # does, with GHC's own C compiler, and fails on any warning.
      - name: Compile the Windows sandbox backend as C99 with strict warnings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c99-strict"
          mkdir -p "$out"
          for f in sandbox/windows.c test/cbits/nn_test_sandbox_windows.c; do
            echo "Checking $f ..."
            ghc -c "$f" -Isandbox -optc-std=c99 -optc-Wall -optc-Wextra -optc-pedantic -optc-Werror -o "$out/$(basename "$f" .c).o"
          done

      # The suite's macOS and Windows sandbox groups run the helper this job
      # built, and skip where nothing names it.
      - name: Name the built sandbox helper (macOS, Windows)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: echo "NOVA_NIX_TEST_SANDBOX_HELPER=$(cabal list-bin exe:nova-nix-sandbox)" >> "$GITHUB_ENV"

      # Upstream's worker-protocol fixtures are the bytes its own
      # serialiser tests read and write.  They are LGPL-2.1, so they are
      # fetched rather than kept here, at the release whose protocol
      # nova-nix follows, and the tag is held to the commit it named when
      # it was pinned.  The suite's daemon/fixtures group reads the
      # directory this names and skips where it is not named; the codec is
      # pure Haskell, so one OS reads them.
      - name: Fetch upstream's worker-protocol fixtures (Linux)
        if: runner.os == 'Linux'
        env:
          NIX_TAG: "2.35.4"
          NIX_COMMIT: 21286d605815196c3fff1960550ab08700fc4e6f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nix-$NIX_TAG"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$NIX_TAG" \
            --filter=blob:none --sparse https://github.com/NixOS/nix "$dir"
          git -C "$dir" sparse-checkout set src/libstore-tests/data/worker-protocol
          actual=$(git -C "$dir" rev-parse HEAD)
          if [ "$actual" != "$NIX_COMMIT" ]; then
            echo "::error::tag $NIX_TAG names $actual, not the pinned $NIX_COMMIT"
            exit 1
          fi
          echo "NOVA_NIX_TEST_WORKER_PROTOCOL_DIR=$dir/src/libstore-tests/data/worker-protocol" >> "$GITHUB_ENV"

      # The suite runs directly rather than through cabal test, which
      # reports a suite killed by a signal as a bare FAIL: its exit status
      # survives, so a crash names its signal (128 + the number on POSIX).
      - name: Test
        timeout-minutes: 15
        shell: bash
        run: |
          set -u
          suite=$(cabal list-bin test:nova-nix-test)
          "$suite"
          status=$?
          if [ "$status" -gt 128 ]; then
            echo "::error::the test suite was killed by signal $((status - 128))"
          fi
          exit "$status"

      # The sandbox helper's Windows backend, run as the service that logs
      # each build slot on would run it: as a virtual service account
      # granted the privileges that start a process as another account.
      # The suite, run as the runner's administrator, makes the build
      # accounts' group, nixbld, two build-slot accounts in it and a test
      # service running as its virtual account, starts the service, which
      # runs the account checks, the store's layout among them, and prints
      # their log; it removes the service, the accounts, each one's rights
      # first, and the group, however the checks end.  The user a build must be kept from is the
      # runner's: its profile, TEMP, APPDATA and hive, this step's process,
      # a file only it may read and a file in its profile, both of which
      # the step makes and removes.  The checks' directory is made in the
      # runner's temporary directory, outside the runner user's profile,
      # which the service and the slots cannot enter.
      - name: The sandbox helper runs builds as build accounts, checked as a service (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $suite = cabal list-bin test:nova-nix-test
          $helper = cabal list-bin exe:nova-nix-sandbox
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) { throw "no MSYS2 bash at $bash" }
          $userOnly = Join-Path $env:TEMP 'nova-nix-sandbox-user-only.txt'
          $profileFile = Join-Path $env:USERPROFILE 'nova-nix-sandbox-profile.txt'
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          try {
            Set-Content -LiteralPath $userOnly -Value 'the runner user alone may read this'
            icacls $userOnly /inheritance:r /grant:r "*${user}:F" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls failed with $LASTEXITCODE" }
            Set-Content -LiteralPath $profileFile -Value 'a file in the runner user profile'
            & $suite --windows-sandbox-install $env:RUNNER_TEMP $helper $bash $user $env:USERPROFILE $env:TEMP `
              $env:APPDATA $PID $userOnly $profileFile
            $result = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $userOnly, $profileFile -Force -ErrorAction SilentlyContinue
          }
          exit $result

      # The account checks remove the accounts, the group and the test
      # service they make, and their rights; this removes any a run that
      # ended early left, by the name prefixes the checks give them
      # (test/Test/WindowsSandbox.hs) and the group's name, and leaves such
      # an account's or service's rights on its SID, which the discarded
      # runner takes with it.  Windows PowerShell carries the LocalAccounts
      # module itself, where PowerShell 7 loads it through a compatibility
      # session, and sc.exe deletes a service, for which it has no cmdlet.
      - name: Remove leftover build accounts and test services (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          # Listed in full first, so that removing one does not cut the
          # listing short.
          @(Get-Service -Name 'nnsandbox*') | ForEach-Object {
            "removing the leftover service $($_.Name)"
            if ($_.Status -ne 'Stopped') { Stop-Service -Name $_.Name -Force }
            sc.exe delete $_.Name
          }
          @(Get-LocalUser | Where-Object Name -like 'nnslot*') | ForEach-Object {
            "removing the leftover account $($_.Name)"
            Remove-LocalUser -SID $_.SID
          }
          # The runner has no nixbld group of its own, so one here is the
          # checks'.
          $group = Get-LocalGroup -Name 'nixbld' -ErrorAction SilentlyContinue
          if ($group) {
            'removing the leftover group nixbld'
            Remove-LocalGroup -SID $group.SID
          }

      # A crash or a memory-pressure kill on macOS leaves a report the
      # runner keeps; print this job's, since the runner is discarded.
      - name: Crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$dir" -maxdepth 1 -newer "$GITHUB_WORKSPACE/nova-nix.cabal" \
              \( -name 'nova-nix-test*' -o -name 'JetsamEvent*' \) -print -exec head -c 200000 {} \; 2>/dev/null || true
          done

      # A released binary is a copied binary, and Cabal's datadir is baked in
      # at configure time, naming the machine that built it.  Both fallbacks
      # are checked with nova_nix_datadir pointed at nothing, so a pass can
      # only come from the path under test and never from the Cabal default.
      - name: The data dir survives relocation
        shell: bash
        run: |
          set -euo pipefail
          cabal install exe:nova-nix --install-method=copy --installdir=reloc-src --overwrite-policy=always
          root=$(mktemp -d)/nova-nix
          mkdir -p "$root/bin" "$root/share/nova-nix/nix"
          cp reloc-src/nova-nix* "$root/bin/"
          cp data/nix/fetchurl.nix "$root/share/nova-nix/nix/"
          exe="$root/bin/nova-nix"
          [ -x "$exe" ] || exe="$root/bin/nova-nix.exe"

          echo "== exe-relative share/ =="
          got=$(nova_nix_datadir=/nonexistent "$exe" eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)')
          [ "$got" = '"lambda"' ] || { echo "expected \"lambda\", got $got" >&2; exit 1; }

          echo "== NIX_DATA_DIR overrides it =="
          got=$(NIX_DATA_DIR="$PWD/data" nova_nix_datadir=/nonexistent "$exe" eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)')
          [ "$got" = '"lambda"' ] || { echo "expected \"lambda\", got $got" >&2; exit 1; }

          echo "== neither present is still a clean error, not a crash =="
          rm -rf "$root/share"
          if nova_nix_datadir=/nonexistent "$exe" eval --expr 'import <nix/fetchurl.nix>' 2>err.txt; then
            echo "expected a failure with no data dir" >&2; exit 1
          fi
          grep -q "was not found in the Nix search path" err.txt

      # With nothing setting cores, a builder is told of the CPU limit of
      # the cgroup v2 group nova-nix runs in, as upstream's getMaxCPU reads
      # it: under a 150% quota, cpu.max is "150000 100000", and that is 2.
      # The test suite runs the parsing over files it writes; this runs the
      # reads against the kernel's own.  The scope runs nova-nix as root,
      # whose builds run as the members of build-users-group, nixbld by
      # default, which this runner does not have; with the setting empty
      # the build runs as root, which is all the check needs.
      - name: A build in a cgroup with a CPU quota is told of its cores
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cabal list-bin exe:nova-nix)
          store=$(mktemp -d)
          out=$(sudo systemd-run --quiet --scope -p CPUQuota=150% \
            --setenv=NIX_CONFIG='build-users-group =' \
            "$exe" --store "$store" build --no-sandbox \
            --expr 'derivation { name = "cores"; system = builtins.currentSystem; builder = "/bin/sh"; args = [ "-c" "echo $NIX_BUILD_CORES > $out" ]; }' |
            tail -n 1)
          got=$(cat "$out")
          if [ "$got" != 2 ]; then
            echo "::error::a builder under a 150% CPU quota was told of $got cores, not 2"
            exit 1
          fi
          echo "ok    a builder under a 150% CPU quota is told of 2 cores"

      # A store nova-nix creates on Windows, its state directory, the
      # parent it makes for them, and the directory a build runs in each
      # carry a protected access control list, where a directory made
      # under a drive root takes the root's, which lets every signed-in
      # user modify it.  The store's grants full control to this user,
      # SYSTEM and Administrators and read and execute to Users, as
      # install-nova-nix's does on C:\nix; the parent's, made at the drive
      # root as C:\nix is without the installer, grants the same less
      # Users; and a build directory's grants full control to this user
      # alone, each passed down (OI)(CI).  The test suite reads the lists
      # through the API; this reads them as icacls prints them, a build
      # directory's through a builder that runs icacls in it.  The entries
      # must be exactly these, so an inherited one, which icacls marks
      # (I), fails the check, as does one for Authenticated Users or
      # Everyone.
      - name: A new store, the parent made for it and a build directory are closed to other users (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = cabal list-bin exe:nova-nix
          $parent = Join-Path $env:SystemDrive 'nova-nix-acl'
          $store = Join-Path $parent 'store'
          $drv = Join-Path $env:RUNNER_TEMP 'acl.nix'
          Set-Content -LiteralPath $drv -Value 'derivation { name = "acl"; system = builtins.currentSystem; builder = "cmd.exe"; args = [ "/c" "icacls . >%out%" ]; }'
          $out = (& $exe --store $store build --no-out-link $drv) | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "the build exited $LASTEXITCODE" }

          # icacls prints the path and the first entry on one line, each
          # other entry on a line of its own, then a blank line and a
          # count of what it processed.  No path here holds a space.
          function Get-AclEntry([string[]]$Lines) {
            $entries = for ($i = 0; $i -lt $Lines.Count; $i++) {
              $line = $Lines[$i].Trim()
              if ($i -eq 0) { $line = $line -replace '^\S+\s+', '' }
              if ($line -match ':\(') { $line }
            }
            return @($entries | Sort-Object)
          }
          function Assert-AclEntry([string]$Label, [string[]]$Lines, [string[]]$Expected) {
            $Lines | Write-Output
            $found = @(Get-AclEntry $Lines) -join ', '
            $want = @($Expected | Sort-Object) -join ', '
            if ($found -ne $want) {
              Write-Output "::error::$Label carries $found, not $want"
              exit 1
            }
            Write-Output "ok    $Label carries exactly $want"
          }

          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $parentEntries = @(
            "${user}:(OI)(CI)(F)",
            'NT AUTHORITY\SYSTEM:(OI)(CI)(F)',
            'BUILTIN\Administrators:(OI)(CI)(F)'
          )
          $storeEntries = $parentEntries + @('BUILTIN\Users:(OI)(CI)(RX)')
          Assert-AclEntry 'the parent made for the store' @(icacls $parent) $parentEntries
          Assert-AclEntry 'the store' @(icacls $store) $storeEntries
          Assert-AclEntry 'the state directory' @(icacls (Join-Path $store '.nova-nix')) $storeEntries
          Assert-AclEntry 'the build directory' @(Get-Content -LiteralPath $out) @("${user}:(OI)(CI)(F)")

      # nova-nix refuses a store under a directory another account could
      # change, naming the directory, before it makes anything in it.  A
      # folder made at the drive root, as another user can make C:\nix
      # before nova-nix runs, takes the root's access control list, which
      # lets other users change what is made in it.  The parent the step
      # above made for its store, given to LOCAL SERVICE, stands for a
      # C:\nix another account owns.
      - name: A store under a directory another account could change is refused (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = cabal list-bin exe:nova-nix
          $drv = Join-Path $env:RUNNER_TEMP 'acl.nix'
          $log = Join-Path $env:RUNNER_TEMP 'refused.log'
          function Assert-Refused([string]$Directory, [string]$Store) {
            & $exe --store $Store build --no-out-link $drv 2> $log | Out-Null
            $code = $LASTEXITCODE
            $said = Get-Content -Raw -LiteralPath $log
            Write-Output $said
            # The runner ends the step with the last native command's exit
            # status, and this refusal is the outcome the step wants.
            $global:LASTEXITCODE = 0
            if ($code -eq 0) {
              Write-Output "::error::a build in $Store ran"
              exit 1
            }
            if (-not $said.Contains("error: $Directory ") -or -not $said.Contains("so the store in $Store cannot be trusted; move $Directory aside")) {
              Write-Output "::error::the build in $Store failed, but not with a refusal naming $Directory"
              exit 1
            }
            Write-Output "ok    a store in $Store is refused, naming $Directory"
          }

          $inherited = Join-Path $env:SystemDrive 'nova-nix-inherited'
          New-Item -ItemType Directory -Path $inherited | Out-Null
          Assert-Refused $inherited (Join-Path $inherited 'store')
          if (@(Get-ChildItem -Force -LiteralPath $inherited).Count -ne 0) {
            Write-Output "::error::nova-nix made something in $inherited before refusing it"
            exit 1
          }

          $parent = Join-Path $env:SystemDrive 'nova-nix-acl'
          icacls $parent /setowner '*S-1-5-19'
          if ($LASTEXITCODE -ne 0) { throw "icacls exited $LASTEXITCODE" }
          Assert-Refused $parent (Join-Path $parent 'store')

      # An installed nova-nix finds the helper beside it, and no profile
      # names that copy, so with the restriction on, which the step asserts,
      # a sandboxed build runs unsandboxed after one warning naming the
      # cause, or with sandbox-fallback off fails in upstream's words.  As
      # root, which the restriction does not reach, a sandboxed build with
      # build-users-group empty is refused, since it would build as root.
      - name: Without a profile, a sandboxed build falls back, or fails with sandbox-fallback off, and as root is refused (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ] \
            || { echo "::error::the runner no longer restricts unprivileged user namespaces"; exit 1; }
          bin=$(mktemp -d)
          cabal install exe:nova-nix exe:nova-nix-sandbox --install-method=copy --installdir="$bin" --overwrite-policy=always
          # $out is the builder's, so the expression is quoted whole.
          # shellcheck disable=SC2016
          expr='derivation { name = "fallback"; system = builtins.currentSystem; builder = "/bin/sh"; args = [ "-c" "echo ok > $out" ]; }'
          out=$(NIX_CONFIG='sandbox = true' "$bin/nova-nix" --store "$(mktemp -d)" build --no-out-link --expr "$expr" 2>fallback.txt | tail -n 1)
          cat fallback.txt
          grep -qF "warning: building without a sandbox, since AppArmor restricts unprivileged user namespaces" fallback.txt
          [ "$(cat "$out")" = ok ]
          if NIX_CONFIG=$'sandbox = true\nsandbox-fallback = false' "$bin/nova-nix" --store "$(mktemp -d)" build --no-out-link --expr "$expr" 2>refused.txt; then
            echo "::error::a sandboxed build without the namespaces ran with sandbox-fallback off"
            exit 1
          fi
          cat refused.txt
          grep -qF "this system does not support the kernel namespaces that are required for sandboxing; use '--no-sandbox' to disable sandboxing" refused.txt
          if sudo env NIX_CONFIG='build-users-group =' "$bin/nova-nix" --store "$(mktemp -d)" build --sandbox --no-out-link --expr "$expr" 2>root.txt; then
            echo "::error::a sandboxed build ran as root"
            exit 1
          fi
          cat root.txt
          grep -qF "a sandboxed build as root needs build users: set 'build-users-group' to a group of build users" root.txt

      # As root a build runs as a member of build-users-group, as
      # upstream's does.  The step makes the group, nixbld, and two members
      # with no home and no login shell, as upstream's installer makes
      # them, then runs the suite's checks as root, given the helper and
      # busybox the suite's sandbox group uses and a directory beneath /,
      # whose ancestors every user may search and none every user may
      # write, which the checks remove.  They build unsandboxed and in the
      # sandbox, and hold whom each build ran as, with which groups and in
      # which session, its output's owner and mode, the refusal of an output
      # holding another user's file and of a build below a directory every
      # user may write, the end of a process a build left, and a build's
      # wait for a free member.
      - name: Builds as root run as build users (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd --system nixbld
          for n in 1 2; do
            sudo useradd --system --no-create-home --home-dir /var/empty --shell /usr/sbin/nologin --gid nixbld --groups nixbld "nixbld$n"
          done
          suite=$(cabal list-bin test:nova-nix-test)
          sudo "$suite" --build-users-root "$NOVA_NIX_TEST_SANDBOX_HELPER" "$NOVA_NIX_TEST_BUSYBOX" /nova-nix-build-users nixbld

      # SIGINT mid-evaluation is upstream's error, exit 1, where it once
      # ended the process by the signal with nothing said.  POSIX only:
      # Windows has no SIGINT to send.  set -m starts the job with SIGINT
      # at its default; a background job in a non-interactive shell would
      # otherwise ignore it.
      - name: An interrupt is reported
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          set -m
          exe=$(cabal list-bin exe:nova-nix)
          "$exe" eval --expr 'builtins.length (builtins.genericClosure { startSet = [ { key = 0; } ]; operator = item: [ { key = item.key + 1; } ]; })' 2>interrupt.txt &
          pid=$!
          sleep 3
          kill -INT "$pid"
          status=0
          wait "$pid" || status=$?
          cat interrupt.txt
          [ "$status" -eq 1 ] || { echo "expected exit 1 after SIGINT, got $status" >&2; exit 1; }
          grep -qx 'error: interrupted by the user' interrupt.txt

      # The README links to what owns each detail rather than copying it
      # (CONTRIBUTING.md).  What can drift mechanically is checked here: a
      # relative link, which Hackage renders as /package/<target> and 404s,
      # and a command or flag in a README console block that --help does not
      # list.
      - name: The README's links and commands are current
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cabal list-bin exe:nova-nix)
          help=$("$exe" --help)
          failed=0
          links=$(grep -noE '\]\([^)]*\)|^\[[^]]+\]:[[:space:]]+[^[:space:]]+' README.md || true)
          relative=$(grep -vE '\]\((https?://|#)|\]:[[:space:]]+https?://' <<<"$links" || true)
          if [ -n "$relative" ]; then
            printf '%s\n' "$relative"
            echo "::error file=README.md::the relative link above 404s on Hackage; link to the file on GitHub"
            failed=1
          fi
          commands=$(awk '/^```console/ { inside = 1; next } /^```/ { inside = 0 } inside && /nova-nix/' README.md)
          while read -r flag; do
            if ! grep -qE -- "(^| )${flag}( |,|$)" <<<"$help"; then
              echo "::error file=README.md::the README passes ${flag}, which nova-nix --help does not list"
              failed=1
            fi
          done < <(grep -oE '(^| )(-[A-Za-z]|--[a-z][a-z-]*)' <<<"$commands" | tr -d ' ' | sort -u)
          while read -r command; do
            if ! grep -qE "^  ${command}( |$)" <<<"$help"; then
              echo "::error file=README.md::the README runs nova-nix ${command}, which nova-nix --help does not list"
              failed=1
            fi
          done < <(sed -E 's/.*nova-nix(\.exe)? //' <<<"$commands" | awk '{ print ($1 == "store" ? $1 " " $2 : $1) }' | sort -u)
          exit "$failed"

      # CI is the only place that compiles for all three platforms, and it
      # discarded every result.  Keeping them means a Windows or macOS
      # failure can be reproduced on a real machine without installing a
      # toolchain there.  Staged after the tests so a binary that failed
      # them is never published.
      # bin/ beside share/ rather than a bare executable: the <nix/*> search
      # path resolves relative to the binary's own location, so an artifact
      # without share/ can evaluate but cannot build, which is most of what
      # someone downloads it to try.  Same layout a release archive ships.
      - name: Stage the executable
        shell: bash
        run: |
          set -euo pipefail
          targets=(exe:nova-nix)
          if [ "$RUNNER_OS" != Windows ]; then targets+=(exe:nova-nix-sandbox); fi
          cabal install "${targets[@]}" --install-method=copy --installdir=staged/bin --overwrite-policy=always
          mkdir -p staged/share/nova-nix/nix staged/share/nova-nix/develop
          cp data/nix/fetchurl.nix staged/share/nova-nix/nix/
          cp data/develop/get-env.sh data/develop/COPYING staged/share/nova-nix/develop/

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nova-nix-${{ matrix.name }}-${{ runner.arch }}
          path: staged/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # ---------------------------------------------------------------------------
  # End-to-end (Windows-only): the executable this repo ships, driving a real
  # build through the package set's stdenv - its tools taken from the public
  # cache, GNU hello built with them here, and the produced hello.exe run,
  # or, for a change to the toolchain, left to the seed ladder.
  # Deliberately no store cache: a warm store would let the builder skip the
  # exact work this job exists to exercise.
  # ---------------------------------------------------------------------------

  e2e-windows:
    name: E2E (Windows)
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # The store's key names this plan (.github/actions/cabal-store).
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      # Installed rather than run from dist-newstyle: the bundled <nix/*>
      # search-path entry is the cabal data dir, which only exists for an
      # installed binary - and installing is how the README says to use it.
      - name: Install nova-nix
        run: cabal install exe:nova-nix --install-method=copy --installdir="$env:RUNNER_TEMP\bin" --overwrite-policy=always

      # A rooted path with no drive names the store's drive, C: for the
      # default C:\nix\store, so it reads the same file from every current
      # drive.  The file exists on C: only, so a pass from D:\ cannot come
      # from D:.
      - name: A path with no drive reads from the store's drive
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\bin\nova-nix.exe"
          $fixture = 'C:\probe\f.txt'
          [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($fixture)) | Out-Null
          [IO.File]::WriteAllText($fixture, 'probe')
          if (-not [IO.File]::Exists($fixture)) { Write-Error "fixture $fixture was not created"; exit 1 }
          if ([IO.File]::Exists('D:\probe\f.txt')) { Write-Error "D:\probe\f.txt exists, so D: would answer too"; exit 1 }
          $exprs = @(
            'builtins.pathExists "/probe/f.txt"',
            'builtins.pathExists /probe/f.txt',
            'builtins.readFile "/probe/f.txt" == "probe"',
            'builtins.pathExists "C:/probe/f.txt"',
            'builtins.pathExists "C:\\probe\\f.txt"'
          )
          foreach ($dir in 'C:\', 'D:\') {
            foreach ($expr in $exprs) {
              Push-Location $dir
              try {
                $got = (& $exe eval --expr $expr) -join "`n"
                $code = $LASTEXITCODE
              } finally {
                Pop-Location
              }
              Write-Host "from ${dir}: $expr -> $got"
              if ($code -ne 0 -or $got -ne 'true') {
                Write-Error "from ${dir}, $expr gave '$got' (exit $code), expected true"
                exit 1
              }
            }
          }

      # Every source pkgs/windows fetches, from the public cache where it
      # holds it, so the builds below fetch none.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # The stdenv's toolchain from the public cache, which the seed ladder's
      # runs on main publish; built from the seed it takes hours.  The
      # ladder builds the native x86_64 toolchain from every stage before
      # it, so a change to any rung under it alters the toolchain's rungs,
      # and the cache lacks them until main publishes them.  The ladder's
      # Stdenv job then builds that toolchain and Hello on it, and this job
      # builds neither.  The stdenv's wrappers (stdenv.cc) take moments, so
      # ones the change alters build here.
      - name: Name the public cache as a substituter
        shell: bash
        run: bash .github/cache/name-substituters.sh "$CACHE_URL" "$CACHE_PUBLIC_KEY"
      - name: Take the native toolchain from the public cache
        id: toolchain
        shell: bash
        run: bash .github/cache/substitute-rungs.sh "$RUNNER_TEMP/bin/nova-nix.exe" native-x86_64 defer
      - name: Take the stdenv's wrappers from the public cache, or build them
        if: steps.toolchain.outputs.held == 'true'
        shell: bash
        run: bash .github/cache/substitute-rungs.sh "$RUNNER_TEMP/bin/nova-nix.exe" stdenv build

      # pkgs/windows/hello.nix points at the by-name hello package, which
      # builds through the real stdenv (genericBuild, setup.sh) rather than
      # driving cmd.exe directly - the smallest thing that exercises a real
      # mkDerivation package.  The workspace lives on D: while the store is
      # anchored on C: - building from here is deliberate: it exercises
      # canonical /nix/store text rendered through the store dir.
      # With no substituter, so that Hello itself is built here, and its
      # [build] line is required: from the public cache, which serves it
      # once main publishes it, Hello would arrive with no build at all.
      - name: Build hello.nix through the real stdenv
        if: steps.toolchain.outputs.held == 'true'
        shell: bash
        env:
          NIX_CONFIG: ""
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/hello-build.log"
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/hello.nix 2> "$log" | tail -n 1); then
            cat "$log"
            echo "::error::nova-nix build failed"
            exit 1
          fi
          cat "$log"
          # A line may end in the carriage return of Windows' text mode.
          grep -q -E '^[[:space:]]*\[build\][[:space:]]+hello[[:space:]]*$' "$log" || {
            echo "::error::hello was not built here"
            exit 1
          }
          echo "out path: $out"
          # setup.sh installs with `make install prefix=`, so autotools lands
          # the binary under bin/, not at the output root.
          hello="$(cygpath -u "$out")/bin/hello.exe"
          [ -f "$hello" ] || { echo "::error::no bin/hello.exe in $out"; exit 1; }
          # hello.exe ends its line with a carriage return, as a native
          # Windows program does.
          got=$("$hello" | tr -d '\r')
          echo "output: $got"
          [ "$got" = "Hello, world!" ] || { echo "::error::unexpected hello output: $got"; exit 1; }

      - name: Diagnose store layout on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($d in "C:\nix\store", "D:\nix\store") {
            Write-Host "== $d =="
            if (Test-Path $d) {
              Get-ChildItem $d -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }
            } else { Write-Host "(absent)" }
          }

  # ---------------------------------------------------------------------------
  # Sandboxed build (Linux and macOS): GNU Hello from a pinned nixpkgs, its
  # build closure taken from cache.nixos.org, built again under sandbox = true
  # by the executable this repo ships, beside an output already in the store,
  # and compared with it byte for byte.  The suite's sandbox groups pin each
  # refusal with derivations of their own; Hello is a real stdenv package,
  # whose configure script, compiler and test suite run in the sandbox.  On
  # Linux the output is the cache's, so the comparison holds what the sandbox
  # makes to what upstream's builders made, every build there seeing its
  # directory at /build.  On macOS a rebuild matches the cache's output only
  # by chance.  ld64 leaves a program's debug map out of the hash it makes
  # LC_UUID from, but writes the map's strings, which name the build
  # directory, right before the code signature, so their length moves the
  # signature's offset and size, which the hash covers: LC_UUID follows the
  # length of the build directory's path.  Upstream names a macOS build
  # directory after its process id and a random counter, so that length varies
  # from build to build, upstream's own included.  So on macOS the output is
  # Hello's under another name, which the cache does not hold, built first by
  # nova-nix, whose build directory is named by the output's hash and so has
  # one length; the comparison holds the sandbox's build to itself.  The store
  # is /nix/store, since cache.nixos.org's programs load their libraries from
  # there alone.
  # ---------------------------------------------------------------------------

  sandboxed-build:
    name: Sandboxed build (${{ matrix.os }})
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # A nixpkgs-unstable revision.  cache.nixos.org holds its Hello for
      # x86_64-linux and aarch64-darwin, the runners' systems, and every
      # path Hello's build takes.
      NIXPKGS_REV: 619c39f6eac5d1ed6b8f073a9414baf7034b2356
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer the README points users to, at its v1.2.0 release.
      - name: Check out install-nova-nix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Novavero-AI/install-nova-nix
          ref: d7d5434340cb0526ed1ba793b38ad38ffb8e7dbc # v1.2.0
          path: install-nova-nix

      # The store as the installer and its action set it up: /nix given to
      # the runner's user on Linux, and on macOS, whose root volume is
      # read-only, an APFS volume of its own mounted at /nix without a
      # restart.  No runner image carries upstream Nix, whose database
      # would make nova-nix refuse the store.
      - name: Set up /nix/store
        run: sh install-nova-nix/install.sh --store-only

      # GHC as the Build job sets it up, for the reasons given there.
      - name: Use the Command Line Tools linker
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Restore the GHC installation (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-ghc
        with:
          ghc-version: "9.14.1"

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # The store's key names this plan (.github/actions/cabal-store).
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      # Installed with the sandbox helper beside it, where nova-nix looks
      # for it.  An installed binary finds the bundled <nix/*> search path
      # in Cabal's data dir, and nixpkgs' bootstrap files import its
      # fetchurl.nix.
      - name: Install nova-nix and its sandbox helper
        run: cabal install exe:nova-nix exe:nova-nix-sandbox --install-method=copy --installdir="$RUNNER_TEMP/bin" --overwrite-policy=always

      # Ubuntu gives a user namespace capabilities only to a program that an
      # AppArmor profile with a userns rule covers.  This profile covers the
      # installed helper, as .github/actions/sandbox-helper's covers the one
      # the Build job tests.  A sandboxed build sees no host program that
      # sandbox-paths does not name, and Hello's configure script and tests
      # run /bin/sh, which a release archive gives them as a static busybox;
      # here Ubuntu's busybox-static is that shell.
      - name: Let the installed sandbox helper make namespaces, and install the builders' shell (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends busybox-static
          profile="$RUNNER_TEMP/nova-nix-sandbox.apparmor"
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            "profile nova-nix-sandbox $RUNNER_TEMP/bin/nova-nix-sandbox flags=(unconfined) {" '  userns,' '}' > "$profile"
          sudo apparmor_parser -r "$profile"

      # Fetched by its commit id, which names the tree's content, as Parity
      # fetches its trees.
      - name: Fetch the pinned nixpkgs
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nixpkgs"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/NixOS/nixpkgs
          git -C "$dir" fetch -q --depth 1 origin "$NIXPKGS_REV"
          git -C "$dir" checkout -q --detach FETCH_HEAD
          echo "NIXPKGS=$dir" >> "$GITHUB_ENV"

      # As nix-build --check checks it: Hello's inputs are taken from
      # cache.nixos.org, and Hello is built again in the sandbox beside its
      # valid output, each output compared with the store's.  On Linux that
      # output is the cache's too.  On macOS it is that of Hello under
      # another name (the comment above the job says why), which nova-nix
      # builds in the sandbox first, so that build is the one [build] line.
      # With sandbox-fallback off, a Linux system that cannot make the
      # sandbox fails the build rather than building without it, as macOS
      # always does.  Each derivation's line says how it was realised.  The
      # check finds every input in the store or the cache, so a [build] line
      # there is a derivation the cache did not supply, and the rebuild is
      # the one [check] line.  On macOS what the profile refuses goes to the
      # system log, for the last step.
      - name: Build Hello again in the sandbox, beside cache.nixos.org's (Linux) or its own (macOS)
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # nova-nix's status for a check that found an output different
          # (checkMismatchStatus in Nix.Realise), as upstream's is when it
          # builds without a daemon, which passes the error on without it.
          readonly MISMATCH_STATUS=104
          settings=(
            'sandbox = true'
            'sandbox-fallback = false'
            'substituters = https://cache.nixos.org'
            'trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY='
          )
          case $RUNNER_OS in
            Linux) settings+=("extra-sandbox-paths = /bin/sh=$(command -v busybox)") ;;
            macOS) settings+=('darwin-log-sandbox-violations = true') ;;
          esac
          NIX_CONFIG=$(printf '%s\n' "${settings[@]}")
          export NIX_CONFIG
          printf '%s\n' "$NIX_CONFIG"
          hello="(import $NIXPKGS { config = { }; overlays = [ ]; }).hello"
          case $RUNNER_OS in
            Linux)
              expr=$hello
              name='hello'
              against="the Hello cache.nixos.org holds"
              ;;
            macOS)
              expr="$hello.overrideAttrs (_: { pname = \"hello-uncached\"; })"
              name='hello-uncached'
              against="nova-nix's first build of it"
              ;;
          esac
          date '+%Y-%m-%d %H:%M:%S%z' > "$RUNNER_TEMP/build-started"
          if [ "$RUNNER_OS" = macOS ]; then
            first="$RUNNER_TEMP/hello-first.log"
            "$RUNNER_TEMP/bin/nova-nix" build --no-out-link --expr "$expr" \
              2>&1 > /dev/null | tee "$first" >&2
            builds=$(grep -cE '^  \[build\] ' "$first" || true)
            named=$(grep -cE "^  \\[build\\]  $name-[0-9.]+\$" "$first" || true)
            if [ "$builds" != 1 ] || [ "$named" != 1 ]; then
              echo "::error::nova-nix printed $builds lines building derivations, $named of them building $name, where Hello's first build is the one line building $name"
              exit 1
            fi
          fi
          log="$RUNNER_TEMP/hello.log"
          status=0
          "$RUNNER_TEMP/bin/nova-nix" build --check --keep-failed --no-out-link --expr "$expr" \
            2>&1 > "$RUNNER_TEMP/hello-out" | tee "$log" >&2 || status=$?
          case $status in
            0) ;;
            "$MISMATCH_STATUS")
              # Under keep-failed the rebuild stays beside the valid output,
              # and the message names both.
              differing=$(grep -oE 'output "[^"]+" differs from "[^"]+"' "$log" | head -n 1 || true)
              if [ -n "$differing" ]; then
                valid=${differing#output \"}
                valid=${valid%%\"*}
                echo "HELLO_VALID=$valid" >> "$GITHUB_ENV"
                echo "HELLO_REBUILT=$valid.check" >> "$GITHUB_ENV"
              fi
              echo "::error::Hello built again in the sandbox differs from $against"
              exit 1
              ;;
            *)
              echo "::error::checking Hello in the sandbox failed with status $status"
              exit 1
              ;;
          esac
          if grep -E '^  \[build\] ' "$log"; then
            echo "::error::nova-nix built the derivations above, which cache.nixos.org did not supply"
            exit 1
          fi
          checks=$(grep -cE "^  \\[check\\]  $name-[0-9.]+\$" "$log" || true)
          if [ "$checks" != 1 ]; then
            echo "::error::nova-nix printed $checks lines checking $name, not one, so this step no longer reads its output"
            exit 1
          fi
          echo "HELLO=$(cat "$RUNNER_TEMP/hello-out")" >> "$GITHUB_ENV"

      # The output in the store is the one the check found the rebuild equal
      # to.
      - name: Hello runs
        run: |
          set -euo pipefail
          case $HELLO in
            /nix/store/*-hello-*) ;;
            *) echo "::error::not a path in /nix/store: $HELLO"; exit 1 ;;
          esac
          got=$("$HELLO/bin/hello")
          echo "output: $got"
          [ "$got" = 'Hello, world!' ] || { echo "::error::hello printed $got"; exit 1; }

      # Where the sandboxed rebuild differs from the Hello it was checked
      # against: each file that differs, how many of its bytes do, and the
      # first of them; for a Mach-O file, its load commands and code
      # signature side by side, since those hold what a build's path or time
      # can change.
      - name: How the rebuild differs
        if: failure() && env.HELLO_REBUILT != ''
        run: |
          # Every comparison here exits non-zero when it finds a difference,
          # which is what this step reports, so none ends it.
          set +e
          set -u
          echo "valid:   $HELLO_VALID"
          echo "rebuilt: $HELLO_REBUILT"
          diff -rq "$HELLO_VALID" "$HELLO_REBUILT" | tee "$RUNNER_TEMP/differing.txt"
          grep -E '^Files ' "$RUNNER_TEMP/differing.txt" | while read -r _ valid _ rebuilt _; do
            echo "== $valid"
            echo "differing bytes: $(cmp -l "$valid" "$rebuilt" | wc -l | tr -d ' ') of $(wc -c < "$valid" | tr -d ' ')"
            cmp -l "$valid" "$rebuilt" | head -n 40
            if file "$valid" | grep -q 'Mach-O'; then
              diff <(otool -l "$valid") <(otool -l "$rebuilt") | head -n 80
              diff <(codesign -d --verbose=4 "$valid" 2>&1) <(codesign -d --verbose=4 "$rebuilt" 2>&1) | head -n 40
            fi
          done
          tar -C "$(dirname "$HELLO_VALID")" -czf "$RUNNER_TEMP/hello-outputs.tar.gz" \
            "$(basename "$HELLO_VALID")" "$(basename "$HELLO_REBUILT")"
      - name: Upload both Hellos
        if: failure() && env.HELLO_REBUILT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-outputs-${{ matrix.os }}
          path: ${{ runner.temp }}/hello-outputs.tar.gz

      # What the profile refused while Hello built, which macOS logs under
      # darwin-log-sandbox-violations as "Sandbox: PROGRAM(PID) deny(1)
      # OPERATION PATH", among the refusals of every other sandboxed
      # program on the runner.
      - name: What the sandbox refused (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/build-started" ] || { echo "Hello's build did not start"; exit 0; }
          denials="$RUNNER_TEMP/denials.log"
          log show --style compact --start "$(cat "$RUNNER_TEMP/build-started")" \
            --predicate 'sender == "Sandbox" AND eventMessage CONTAINS "deny("' > "$denials"
          lines=$(wc -l < "$denials" | tr -d ' ')
          echo "$lines lines, the first 300 of them:"
          head -n 300 "$denials"

  # ---------------------------------------------------------------------------
  # Stage0 (Windows): stage0-pe32's chain, from its 1,623-byte seed to kaem,
  # built by the executable this repo ships as one derivation per command of
  # x86/mescc-tools-mini.cmd.  Each link has to be the file stage0-pe32's own
  # CI builds with cmd.exe, byte for byte, and hex0 has to be the seed.  Then
  # mescc-tools-extra's thirteen programs, built by those links, each run
  # once, and kaem, mescc-tools and mescc-tools-extra as bin directories
  # whose programs are executable in their NARs, with kaem.runCommand running
  # scripts from them.  No store cache, for the reason E2E (Windows) has none.
  #
  # x64 and ARM64 Windows each run all of it, as stage0-pe32's CI runs its
  # chain on both: the links are i686, which x64 Windows runs through WoW64
  # and ARM64 Windows through its x86 emulator, and either can fail where the
  # other does not.  Both run the one x64 nova-nix that Stage0 (nova-nix)
  # builds, the build a release ships for Windows, since the ARM64 image has
  # no GHC.  ARM64 Windows runs it through its x64 emulator, and its system is
  # still the x86_64-windows compiled into it, so it builds the i686
  # derivations there as it does on x64.
  # ---------------------------------------------------------------------------

  stage0-nova-nix:
    name: Stage0 (nova-nix)
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # The store's key names this plan (.github/actions/cabal-store).
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      # bin/ beside share/, the layout a release archive ships: the data dir
      # Cabal compiles in is in this runner's Cabal store, which the runners
      # below do not have, and the chain's sources are fetched through
      # <nix/fetchurl.nix>.  nova-nix.exe needs no DLL beyond Windows' own, so
      # these two files are all of it.
      - name: Stage nova-nix
        shell: bash
        run: |
          set -euo pipefail
          cabal install exe:nova-nix --install-method=copy --installdir=staged/bin --overwrite-policy=always
          mkdir -p staged/share/nova-nix/nix
          cp data/nix/fetchurl.nix staged/share/nova-nix/nix/

      # Kept for the 30 days a run can be re-run in: a re-run of the failed
      # Stage0 legs alone does not run this job again.
      - name: Upload nova-nix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage0-nova-nix
          path: staged/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  stage0-windows:
    name: Stage0 (${{ matrix.name }})
    needs: [stage0-nova-nix]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: windows-11-arm
            name: Windows ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Into the temp root, so the executable is $RUNNER_TEMP/bin/nova-nix.exe
      # with share/ beside bin/.
      - name: Download nova-nix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage0-nova-nix
          path: ${{ runner.temp }}

      # Every source pkgs/windows fetches, from the public cache where it
      # holds it, so the builds below fetch none.  They name no substituter
      # and substitute nothing.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # build prints the out path as its last stdout line.  Building a link
      # builds the links below it, so each later build finds them valid.
      - name: Build the chain
        shell: bash
        run: |
          set -euo pipefail
          for attr in hex0 hex1 hex2 catm M0 cc_x86 M2 M1 hex2-new kaem-unwrapped; do
            out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "stage0-pe32.$attr" | tail -n 1)
            path=$(cygpath -u "$out")
            echo "$attr $path" >> "$RUNNER_TEMP/links.txt"
          done
          cat "$RUNNER_TEMP/links.txt"

      # Each link's SHA-256 as stage0-pe32's CI prints it for a81c837, the
      # commit pkgs/windows/by-name/st/stage0-pe32/sources.nix pins.  hex0's
      # is the seed's own: the build already refuses any other hex0, since
      # hex0 is fixed-output to it, and this checks the bytes from outside.
      - name: Each link is the one stage0-pe32 builds
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while read -r attr want; do
            path=$(awk -v attr="$attr" '$1 == attr { print $2 }' "$RUNNER_TEMP/links.txt")
            got=$(sha256sum "$path" | cut -d ' ' -f 1)
            if [ "$got" = "$want" ]; then
              echo "$got  $attr"
            else
              echo "::error::$attr is $got, stage0-pe32 builds $want"
              status=1
            fi
          done <<'EOF'
          hex0 b9db7be0fed7770be9fca46b7aa551b611fc60eaf1112a053531aae14aa46742
          hex1 889d18f1de1ffba70b2a8fa3915ed67b8ccff874fb20e63841cc5c301f890929
          hex2 5b74721141d8788e8334d68016d9360928e5e17e8364485a7b69279b0c2f657d
          catm b45fa38c731889344b37f91b124fddc643eb975b0d3b68bf6efbba07ed2e8c24
          M0 62519c24170f747b9cf2b4514c5967a2cc068f1d485743fedba736c73eb0dcf1
          cc_x86 a47b7cef346a2279c3aae684ad21d9316f04187730161997ab1a2a3a27b990e0
          M2 9109ba7e5fb65553aff021eef4152c19c2b774e7972c9e23b0266b21f56d0db2
          M1 ffa56be32281b490070b75ed1817d3d824bea884ae104c00b2052f7a94ec534f
          hex2-new e6edb0b87c8ca89e3302e141beaf4ef9140f1a90d2362a75d45eb628eebb0c4f
          kaem-unwrapped 6abd6689a9c5a79f7c4871267cecd3284b897e72701ed71064a5bc9f2cf2fd17
          EOF
          exit "$status"

      - name: Build mescc-tools-extra
        shell: bash
        run: |
          set -euo pipefail
          for name in sha256sum match mkdir untar ungz unbz2 unxz catm cp chmod rm replace wrap; do
            out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "stage0-pe32.mescc-tools-extra.$name" | tail -n 1)
            echo "$name $(cygpath -u "$out")" >> "$RUNNER_TEMP/extra.txt"
          done
          cat "$RUNNER_TEMP/extra.txt"

      # Each program once, from its store path, on the fixtures in
      # test/data/mescc-tools-extra: hello.txt, one line, and that line packed
      # four ways.  They were written on macOS, and the same commands write the
      # same bytes again (Python 3's tarfile, Apple gzip 487, bzip2 1.0.8, xz
      # 5.8.4):
      #   printf 'stage0-pe32 builds mescc-tools-extra\n' > hello.txt
      #   python3 -c 'import io, tarfile; d = open("hello.txt", "rb").read(); t = tarfile.open("hello.tar", "w", format=tarfile.USTAR_FORMAT); i = tarfile.TarInfo("files"); i.type = tarfile.DIRTYPE; i.mode = 0o755; t.addfile(i); i = tarfile.TarInfo("files/hello.txt"); i.size = len(d); i.mode = 0o644; t.addfile(i, io.BytesIO(d)); t.close()'
      #   gzip -9n < hello.txt > hello.txt.gz
      #   bzip2 -9 < hello.txt > hello.txt.bz2
      #   xz -9 --check=crc64 < hello.txt > hello.txt.xz
      # Each result is checked against a fixture, hello.txt's known SHA-256 or
      # bytes the runner's own printf and cat write, never against another
      # program under test.  rm, mkdir -p and untar exit 0 even when they
      # fail, so their results are checked on disk.  chmod's exit status says
      # only whether the file is there, since it ignores what chmod returns;
      # what it does to a file is checked by the marks build below.  wrap
      # bind-mounts /dev and /proc into the working directory to chroot
      # there, so it stops at its first mount, which M2libc's Windows mount
      # refuses.
      - name: mescc-tools-extra runs
        shell: bash
        run: |
          set -uo pipefail
          declare -A tool
          while read -r name path; do tool[$name]=$path; done < "$RUNNER_TEMP/extra.txt"
          run() { local name=$1; shift; "${tool[$name]}" "$@"; }
          status=0
          pass() { echo "ok    $1"; }
          fail() { echo "::error::$1"; status=1; }
          expect_exit() {
            local want=$1 code=0
            shift
            run "$@" || code=$?
            if [ "$code" = "$want" ]; then pass "$* exits $code"; else fail "$* exits $code, not $want"; fi
          }
          # cmp names the first byte that differs; the dumps show both files'
          # sizes and leading bytes, so a failure shows its cause.
          same() {
            if cmp "$1" "$2"; then
              pass "$3"
            else
              fail "$3: $2 is not $1"
              for file in "$1" "$2"; do
                echo "$file, $(wc -c < "$file") bytes:"
                od -A d -t x1 "$file" | head -n 8
              done
            fi
          }

          work="$(cygpath -u "$RUNNER_TEMP")/mescc-tools-extra"
          mkdir "$work"
          cp test/data/mescc-tools-extra/* "$work"
          cd "$work" || exit 1
          hello=1aa502522f8046e4c671fcff6da0e9bb3bbac2526fd653d93a71f98dd389b6ab

          got=$(run sha256sum hello.txt)
          if [ "$got" = "$hello  hello.txt" ]; then pass "sha256sum: $got"; else fail "sha256sum printed: $got"; fi
          printf '%s  hello.txt\n' "$hello" > hello.sha256
          expect_exit 0 sha256sum -c hello.sha256
          printf '%064d  hello.txt\n' 0 > wrong.sha256
          expect_exit 1 sha256sum -c wrong.sha256

          expect_exit 0 match same same
          expect_exit 1 match same other

          expect_exit 0 mkdir -p made/a/b
          if [ -d made/a/b ]; then pass "mkdir -p made/a/b made it"; else fail "mkdir -p made/a/b made nothing"; fi

          expect_exit 0 cp hello.txt copy.txt
          same hello.txt copy.txt "cp copies the bytes"
          expect_exit 0 catm twice.txt hello.txt hello.txt
          cat hello.txt hello.txt > twice-want.txt
          same twice-want.txt twice.txt "catm joins the bytes"
          expect_exit 0 replace --file hello.txt --match-on builds --replace-with built --output replaced.txt
          printf 'stage0-pe32 built mescc-tools-extra\n' > replaced-want.txt
          same replaced-want.txt replaced.txt "replace replaces"

          expect_exit 0 chmod 755 copy.txt
          expect_exit 1 chmod 755 missing.txt
          expect_exit 0 rm copy.txt
          if [ ! -e copy.txt ]; then pass "rm removed copy.txt"; else fail "rm left copy.txt"; fi

          expect_exit 0 untar --file hello.tar
          same hello.txt files/hello.txt "untar extracts files/hello.txt"
          expect_exit 0 ungz --file hello.txt.gz --output from-gz.txt
          same hello.txt from-gz.txt "ungz decompresses"
          expect_exit 0 unbz2 --file hello.txt.bz2 --output from-bz2.txt
          same hello.txt from-bz2.txt "unbz2 decompresses"
          expect_exit 0 unxz --file hello.txt.xz --output from-xz.txt
          same hello.txt from-xz.txt "unxz decompresses"

          mkdir wrapped
          cd wrapped || exit 1
          code=0
          said=$(run wrap "${tool[match]}" same same 2>&1) || code=$?
          if [ "$code" = 1 ] && [ "$said" = "Failed to mount directory dev/null" ]; then
            pass "wrap stops at its first mount"
          else
            fail "wrap exited $code and said: $said"
          fi
          exit "$status"

      # kaem-unwrapped laying out kaem, mescc-tools and mescc-tools-extra as
      # bin directories with mescc-tools-extra's mkdir, cp and chmod.  Each
      # path is kept as Windows spells it too, for PowerShell.
      - name: Build the bin directories
        shell: bash
        run: |
          set -euo pipefail
          for attr in kaem mescc-tools mescc-tools-extra; do
            out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "stage0-pe32.$attr" | tail -n 1)
            echo "$attr $(cygpath -u "$out")" >> "$RUNNER_TEMP/bins.txt"
            echo "$attr $out" >> "$RUNNER_TEMP/bins-windows.txt"
          done
          cat "$RUNNER_TEMP/bins.txt"

      # Each file of each bin directory is the program it was copied from,
      # byte for byte.
      - name: Each bin directory holds its programs
        shell: bash
        run: |
          set -uo pipefail
          declare -A store
          while read -r attr path; do store[$attr]=$path; done < "$RUNNER_TEMP/links.txt"
          while read -r name path; do store[mescc-tools-extra.$name]=$path; done < "$RUNNER_TEMP/extra.txt"
          while read -r attr path; do store[$attr]=$path; done < "$RUNNER_TEMP/bins.txt"
          status=0
          holds() {
            if cmp "${store[$1]}/bin/$2" "${store[$3]}"; then
              echo "ok    $1/bin/$2 is $3"
            else
              echo "::error::$1/bin/$2 is not $3"
              status=1
            fi
          }
          holds kaem kaem.exe kaem-unwrapped
          holds mescc-tools M2-Planet.exe M2
          holds mescc-tools M1.exe M1
          holds mescc-tools hex2.exe hex2-new
          for name in sha256sum match mkdir untar ungz unbz2 unxz catm cp chmod rm replace wrap; do
            holds mescc-tools-extra "$name.exe" "mescc-tools-extra.$name"
          done
          exit "$status"

      # chmod 555 marks each program executable as the nova.exec stream
      # beside it, which nova-nix reads as the bit.  PowerShell reads streams
      # through Win32, and the step above has already found every program.
      - name: Each bin directory marks its programs executable
        shell: pwsh
        run: |
          $failed = 0
          foreach ($line in Get-Content -LiteralPath "$env:RUNNER_TEMP/bins-windows.txt") {
            $attr, $path = $line -split ' ', 2
            foreach ($file in Get-ChildItem -LiteralPath (Join-Path $path 'bin') -File) {
              if (Get-Item -LiteralPath $file.FullName -Stream nova.exec -ErrorAction SilentlyContinue) {
                "ok    $attr/bin/$($file.Name) is marked executable"
              } else {
                "::error::$attr/bin/$($file.Name) is not marked executable"
                $failed++
              }
            }
          }
          if ($failed) { exit 1 }

      # test/data/run-command.nix's marks is fixed-output to the NAR hash its
      # tree has on POSIX, with bin/hello executable and hello.txt not, so it
      # builds only if what chmod 555 marked registers as executable and what
      # chmod 755 and then 644 left registers as not.
      - name: A file the build marks is executable in its NAR
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/run-command.nix -A marks

      # test/data/run-command.nix: hello, written by writeText, and copies, a
      # runCommand script that calls mkdir, cp and catm by bare name on
      # hello's store path.  Each output is checked against bytes the
      # runner's own printf and cat write.
      - name: runCommand runs a kaem script
        shell: bash
        run: |
          set -euo pipefail
          build() { "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/run-command.nix -A "$1" | tail -n 1; }
          hello=$(cygpath -u "$(build hello)")
          copies=$(cygpath -u "$(build copies)")
          work="$(cygpath -u "$RUNNER_TEMP")/run-command"
          mkdir "$work"
          printf 'stage0-pe32 runs a kaem script\n' > "$work/hello.txt"
          cat "$work/hello.txt" "$work/hello.txt" > "$work/twice.txt"
          status=0
          same() {
            if cmp "$1" "$2"; then
              echo "ok    $3"
            else
              echo "::error::$3: $2 is not $1"
              status=1
            fi
          }
          same "$work/hello.txt" "$hello" "writeText writes the text"
          same "$work/hello.txt" "$copies/a/b/hello.txt" "mkdir -p and cp copy it into a/b"
          same "$work/twice.txt" "$copies/twice.txt" "catm joins it twice"
          exit "$status"

      # kaem runs the script strict, so cp's failure stops it before the mkdir
      # that would make the output, and the build fails with kaem's reason.
      # --verbose echoes each command kaem runs, so the mkdir is never echoed.
      - name: A failing command fails runCommand
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/fails.log"
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/run-command.nix -A fails > /dev/null 2> "$log" || code=$?
          cat "$log"
          status=0
          fail() { echo "::error::$1"; status=1; }
          [ "$code" != 0 ] || fail "fails built"
          grep -Fqx 'Error opening source file missing.txt' "$log" || fail "cp did not report missing.txt"
          grep -Fqx 'Subprocess error 1' "$log" || fail "kaem did not report cp's exit status"
          grep -Fqx 'ABORTING HARD' "$log" || fail "kaem did not abort"
          if grep -Fq ' +> mkdir' "$log"; then fail "kaem ran the mkdir after cp failed"; fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # End-to-end (Linux): the full binary-cache loop against a real
  # nova-cache-server - push --compression zstd from one scratch store,
  # substitute into a second fresh store with signature verification on,
  # and NAR-compare the two trees - plus a derivation that forbids
  # substitutes, built beside the cache that holds its output and
  # substituted under always-allow-substitutes, and the memory gate: a
  # multi-hundred-MB path substitutes under a hard +RTS -M cap, so any
  # reintroduced whole-archive retention aborts the job. The unit suite's
  # loopback fixtures cover fetch integrity; this exercises a real cache's
  # HTTP surface (chunked transfer, connection reuse, signing handshake)
  # and the nova-nix/nova-cache two-repo interop.
  # ---------------------------------------------------------------------------

  e2e-loop:
    name: E2E (substitute loop)
    needs: [cabal-check]
    # Skipped on a push by the merge queue and on a draft (the comment above
    # ASCII source).
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-merge-queue[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # The Linux store, which caches.yml fills with the packages the
      # server builds with as well as nova-nix's: warp and wai-extra, which
      # nova-nix does not need.  The store's key names nova-nix's plan
      # (.github/actions/cabal-store).
      - name: Plan the build
        run: cabal build --enable-tests --dry-run

      - name: Restore the Cabal store
        uses: ./.github/actions/cabal-store
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          prefix: cabal-${{ runner.os }}
          plan-hash: ${{ hashFiles('dist-newstyle/cache/plan.json', 'cabal.project') }}
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}

      # The loop drives the installed executable - the artifact a user
      # gets - not a dist-newstyle build product.
      - name: Install nova-nix
        run: cabal install exe:nova-nix --install-method=copy --installdir="$RUNNER_TEMP/bin" --overwrite-policy=always

      # Installed in this project, so cabal resolves it under
      # cabal.project's index-state and constraints: the loop runs the
      # nova-cache that nova-nix's own build links, and a newer release
      # reaches it when the index-state moves.
      - name: Install nova-cache-server from Hackage
        run: cabal install nova-cache -f server --install-method=copy --installdir="$RUNNER_TEMP/bin" --overwrite-policy=always

      # GNU time prints the substituting process's peak RSS - the
      # observable behind the memory claim; the shell keyword of the same
      # name cannot measure a child's RSS, and the runner image does not
      # guarantee the binary.
      - name: Provision /usr/bin/time
        run: |
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi

      - name: Push/substitute loop with memory gate
        run: |
          NOVA_NIX_BIN="$RUNNER_TEMP/bin/nova-nix" \
          NOVA_CACHE_SERVER_BIN="$RUNNER_TEMP/bin/nova-cache-server" \
          E2E_WORK_DIR="$RUNNER_TEMP/e2e-loop" \
          .github/e2e-loop/loop.sh

      - name: Dump loop logs on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/e2e-loop/logs/*; do
            echo "== $f =="
            cat "$f" || true
          done
