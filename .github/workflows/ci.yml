name: CI

on:
  push:
    branches: [main]
  # No base-branch filter on pull_request: a stacked PR bases on its
  # predecessor, not main, and a [main] filter leaves it checkless -
  # unmergeable under branch protection's required contexts.
  pull_request:
  # The merge queue tests each entry against a temporary
  # gh-readonly-queue/main branch, so every required check must also
  # report there or the queue times the context out to a failure and
  # ejects the pull request.  Same jobs, matched by check name.
  # checks_requested is the only activity type the event has.
  merge_group:
    types: [checks_requested]
  workflow_call:
  # Run the suite against any branch without opening a pull request:
  # verifying a fix on a branch otherwise meant a throwaway PR, since
  # pull_request was the only trigger that reached a non-main ref.
  workflow_dispatch:


# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight, so that one
# is cancelled.  A run on main is never cancelled: it publishes the closure
# it built to the public cache, and a cancelled publish leaves the cache
# one run behind until the next push happens to complete.  Merge-group
# runs are the queue's own evidence and are left alone for the same reason.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The public cache's address and signing key, spelled once: the publish job
# pushes to it, E2E (public cache) substitutes from it, every job that
# builds from pkgs/windows takes its sources from it, the Mes and Bootstrap
# legs take the seed ladder's rungs from it in substitute mode, and all
# must agree.  A cache move or a key rotation is one edit here.
env:
  CACHE_URL: https://cache.novavero.ai
  CACHE_PUBLIC_KEY: cache.novavero.ai-1:9gQ7tLWMM+2tdC9H5sKMJltDIPfD7X2GWlZe8Aa8hHQ=

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  ascii:
    name: ASCII source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source must be ASCII-only
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.hs' '*.c' '*.h' '*.nix' '*.sh' '*.cabal' '*.md'; then
            echo "Non-ASCII characters found above; keep the source ASCII-only (no smart quotes, em-dashes, or Unicode arrows)."
            exit 1
          fi

  # The workflows lint everything but themselves: Haskell, C and source
  # encoding are all covered, while a .github/workflows change is validated
  # only by GitHub agreeing to parse it after the push.  actionlint checks
  # `uses:` refs, ${{ }} expressions, matrix references, job dependencies,
  # and runs shellcheck over every `run:` block.  Pinned rather than
  # floating: a lint that changes under you turns an unrelated PR red.
  actionlint:
    name: Actionlint
    needs: [ascii]
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the workflows
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

  # Fragments are pasted into CHANGELOG.md verbatim at release, so a malformed
  # one is only noticed while cutting the release, which is the worst time.
  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fragments are well-formed
        run: |
          status=0
          for fragment in changelog.d/*.md; do
            [ -e "$fragment" ] || continue
            if ! head -n1 "$fragment" | grep -q '^- \*\*'; then
              echo "$fragment: must open with a bold lead, '- **...**'" >&2
              status=1
            fi
            if [ ! -s "$fragment" ]; then
              echo "$fragment: is empty" >&2
              status=1
            fi
          done
          exit $status

  hlint:
    name: HLint
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
        with:
          version: "3.10"
      - uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2.4.10
        with:
          path: '["src/", "cli/", "app/", "test/"]'
          fail-on: warning

  ormolu:
    name: Ormolu
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version the repo is formatted with: formatting is
      # not stable across ormolu releases, and a floating version would
      # fail CI on untouched code when upstream ships one.  Upgrades
      # bump this and the local binary together.
      #
      # Built from Hackage, not fetched prebuilt: run-ormolu@v21
      # downloads binaries from mrkkrp/ormolu, and that repository
      # vanished from GitHub on 2026-08-20, taking every prebuilt
      # ormolu with it (the action then misreports the 404 as
      # "unformatted files").  The Hackage build depends on nothing but
      # the package index; the cached binary makes warm runs seconds.
      # Undo into the action if prebuilt assets return to a stable home
      # a released run-ormolu points at.
      - name: Cache formatter binary
        id: formatter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/ormolu
          key: ormolu-0.9.0.0-${{ runner.os }}

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'

      - name: Build ormolu 0.9.0.0 from Hackage
        if: steps.formatter-cache.outputs.cache-hit != 'true'
        run: cabal install ormolu-0.9.0.0 --install-method=copy --installdir="$HOME/.local/bin" --overwrite-policy=always

      - name: Check formatting
        run: git ls-files '*.hs' | xargs ormolu --mode check

  c99-lint:
    name: C99 Strict
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile C99 with strict warnings
        run: |
          for f in cbits/*.c; do
            echo "Checking $f ..."
            gcc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -Icbits "$f"
          done

  cabal-check:
    name: Cabal Check
    needs: [hlint, ormolu, c99-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - name: Validate package
        run: cabal check

  # ---------------------------------------------------------------------------
  # Build from the sdist, exactly as a Hackage user does (Linux-only).
  # CI otherwise builds the git tree, where cabal.project and dev-only
  # settings apply; the tarball is what users install, and divergence
  # (files missing from the sdist, constraints that only exist in-repo)
  # is invisible without this job.
  # ---------------------------------------------------------------------------

  sdist:
    name: Build from sdist
    needs: [cabal-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-sdist-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-sdist-

      - name: Build the tarball a Hackage user gets
        run: |
          cabal sdist -o "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/sdist/nova-nix-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/nova-nix-*/
          cabal build --enable-tests

  # ---------------------------------------------------------------------------
  # Exercise the C data layer under ASan/UBSan (Linux-only).  The C99-strict
  # job only compiles; this one RUNS the full suite with instrumented cbits,
  # so memory errors and UB in the manual-memory surface (arena, attrset,
  # thunk, bytecode, ...) fail CI instead of lurking.  Linux is the host:
  # sanitizer support under mingw is unreliable, and the eval C layer is
  # platform-independent, so Linux execution is real coverage.  The
  # Windows-only nn_winfs body stays compile-checked by the strict job.
  # ---------------------------------------------------------------------------

  sanitizers:
    name: ASan/UBSan
    needs: [cabal-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # Dependencies build unsanitized (the flags below are scoped to this
      # package), so the plain Linux dependency cache applies as-is.
      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-Linux-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-Linux-

      # Scoped via cabal.project.local so only this package's cbits compile
      # instrumented and only its executables link the sanitizer runtimes -
      # a command-line --ghc-options would rebuild every dependency too.
      # -fno-sanitize-recover makes every UBSan report fatal rather than a
      # log line CI would scroll past.  No -Werror here: the warnings gate
      # is the build matrix; this job's signal is runtime findings.
      - name: Scope sanitizer flags to this package
        run: |
          {
            echo "package nova-nix"
            echo "  ghc-options: -optc-fsanitize=address,undefined -optc-fno-sanitize-recover=all -optl-fsanitize=address,undefined"
          } > cabal.project.local

      - name: Build with instrumented cbits
        run: cabal build --enable-tests

      # detect_leaks=0: LeakSanitizer would report the GHC RTS's deliberate
      # process-lifetime allocations, not cbits defects - the arena's
      # bulk-free discipline is exercised by the suite itself.
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: cabal test

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  #
  # The graph is two tiers by design: cheap textual gates run serially
  # (ascii -> lints -> cabal-check), then every expensive job - the build
  # matrix, sdist, sanitizers, e2e - runs in parallel off cabal-check.
  # They are independent verdicts on the same commit, and serializing them
  # would add their durations instead of taking their maximum: e2e alone
  # is ~20 minutes, so putting the matrix before it would slow every green
  # run by its full build time for no extra signal.
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.os }})
    needs: [cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHC's macOS bindist names the Command Line Tools SDK as a library
      # directory of its rts, so every link reads that SDK's .tbd stubs
      # whichever toolchain is selected.  A runner image can ship Command
      # Line Tools newer than its default Xcode, and that Xcode's ld then
      # fails on the stubs with "tapi error: malformed file" before
      # anything of ours is linked.  Selecting the Command Line Tools pairs
      # the SDK with its own ld.  The step precedes GHC's setup so that the
      # install sees the same toolchain as every build after it.  Drop it
      # once the pinned GHC's rts package config no longer names that SDK.
      - name: Use the Command Line Tools linker
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      # --enable-tests compiles the test suite under -Werror too (a bare
      # `cabal build` skips test components entirely, so test-code warnings
      # would never fail CI) and shares one solver plan with the test step.
      - name: Build
        run: cabal build --enable-tests --ghc-options="-Werror"

      # Haddock is the library's documentation, published to Hackage with
      # each release, so it is built on every change: an export with no
      # documentation, or a reference that names no identifier or more than
      # one, fails here rather than shipping.  A missing link destination in
      # another package only means its documentation is not installed, and
      # is not checked.
      - name: Haddock documents every export and resolves every reference
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          cabal haddock nova-nix:lib:nova-nix 2>&1 | tee haddock.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          coverage=$(grep -E '^ *[0-9]+% \( *[0-9]+ / *[0-9]+\) in ' haddock.log || true)
          if [ -z "$coverage" ]; then
            echo "::error::haddock printed no coverage report to check"
            exit 1
          fi
          failed=0
          if grep -vE '^ *100% ' <<<"$coverage"; then
            echo "::error::the modules above export names with no Haddock"
            failed=1
          fi
          if grep -E 'Warning: .* is (out of scope|ambiguous)' haddock.log; then
            echo "::error::the references above do not name exactly one identifier"
            failed=1
          fi
          exit "$failed"

      # The store probes its volume's case sensitivity, and the one
      # answer the runners cannot give on their own is the sensitive
      # one on macOS: the runner's disk is default APFS, which folds, so
      # the suite's store/case-sensitive-volume group would skip there
      # and a broken probe would pass.  A case-sensitive APFS image
      # attached for the test step makes the group run against the real
      # pathconf answer.  Linux needs none (its temp directory already
      # qualifies) and Windows answers by construction.  The runner is
      # discarded with the job, so nothing detaches it.
      - name: Attach a case-sensitive volume
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 64m -fs "Case-sensitive APFS" -volname nova-cs "$RUNNER_TEMP/nova-cs.dmg"
          hdiutil attach "$RUNNER_TEMP/nova-cs.dmg" -mountpoint "$RUNNER_TEMP/nova-cs" -nobrowse
          echo "NOVA_NIX_TEST_CASE_SENSITIVE_DIR=$RUNNER_TEMP/nova-cs" >> "$GITHUB_ENV"

      # The suite runs directly rather than through cabal test, which
      # reports a suite killed by a signal as a bare FAIL: its exit status
      # survives, so a crash names its signal (128 + the number on POSIX).
      - name: Test
        timeout-minutes: 15
        shell: bash
        run: |
          set -u
          suite=$(cabal list-bin test:nova-nix-test)
          "$suite"
          status=$?
          if [ "$status" -gt 128 ]; then
            echo "::error::the test suite was killed by signal $((status - 128))"
          fi
          exit "$status"

      # A crash or a memory-pressure kill on macOS leaves a report the
      # runner keeps; print this job's, since the runner is discarded.
      - name: Crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$dir" -maxdepth 1 -newer "$GITHUB_WORKSPACE/nova-nix.cabal" \
              \( -name 'nova-nix-test*' -o -name 'JetsamEvent*' \) -print -exec head -c 200000 {} \; 2>/dev/null || true
          done

      # A released binary is a copied binary, and Cabal's datadir is baked in
      # at configure time, naming the machine that built it.  Both fallbacks
      # are checked with nova_nix_datadir pointed at nothing, so a pass can
      # only come from the path under test and never from the Cabal default.
      - name: The data dir survives relocation
        shell: bash
        run: |
          set -euo pipefail
          cabal install exe:nova-nix --install-method=copy --installdir=reloc-src --overwrite-policy=always
          root=$(mktemp -d)/nova-nix
          mkdir -p "$root/bin" "$root/share/nova-nix/nix"
          cp reloc-src/nova-nix* "$root/bin/"
          cp data/nix/fetchurl.nix "$root/share/nova-nix/nix/"
          exe="$root/bin/nova-nix"
          [ -x "$exe" ] || exe="$root/bin/nova-nix.exe"

          echo "== exe-relative share/ =="
          got=$(nova_nix_datadir=/nonexistent "$exe" eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)')
          [ "$got" = '"lambda"' ] || { echo "expected \"lambda\", got $got" >&2; exit 1; }

          echo "== NIX_DATA_DIR overrides it =="
          got=$(NIX_DATA_DIR="$PWD/data" nova_nix_datadir=/nonexistent "$exe" eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)')
          [ "$got" = '"lambda"' ] || { echo "expected \"lambda\", got $got" >&2; exit 1; }

          echo "== neither present is still a clean error, not a crash =="
          rm -rf "$root/share"
          if nova_nix_datadir=/nonexistent "$exe" eval --expr 'import <nix/fetchurl.nix>' 2>err.txt; then
            echo "expected a failure with no data dir" >&2; exit 1
          fi
          grep -q "was not found in the Nix search path" err.txt

      # With nothing setting cores, a builder is told of the CPU limit of
      # the cgroup v2 group nova-nix runs in, as upstream's getMaxCPU reads
      # it: under a 150% quota, cpu.max is "150000 100000", and that is 2.
      # The test suite runs the parsing over files it writes; this runs the
      # reads against the kernel's own.
      - name: A build in a cgroup with a CPU quota is told of its cores
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cabal list-bin exe:nova-nix)
          store=$(mktemp -d)
          out=$(sudo systemd-run --quiet --scope -p CPUQuota=150% \
            "$exe" --store "$store" build \
            --expr 'derivation { name = "cores"; system = builtins.currentSystem; builder = "/bin/sh"; args = [ "-c" "echo $NIX_BUILD_CORES > $out" ]; }' |
            tail -n 1)
          got=$(cat "$out")
          if [ "$got" != 2 ]; then
            echo "::error::a builder under a 150% CPU quota was told of $got cores, not 2"
            exit 1
          fi
          echo "ok    a builder under a 150% CPU quota is told of 2 cores"

      # SIGINT mid-evaluation is upstream's error, exit 1, where it once
      # ended the process by the signal with nothing said.  POSIX only:
      # Windows has no SIGINT to send.  set -m starts the job with SIGINT
      # at its default; a background job in a non-interactive shell would
      # otherwise ignore it.
      - name: An interrupt is reported
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          set -m
          exe=$(cabal list-bin exe:nova-nix)
          "$exe" eval --expr 'builtins.length (builtins.genericClosure { startSet = [ { key = 0; } ]; operator = item: [ { key = item.key + 1; } ]; })' 2>interrupt.txt &
          pid=$!
          sleep 3
          kill -INT "$pid"
          status=0
          wait "$pid" || status=$?
          cat interrupt.txt
          [ "$status" -eq 1 ] || { echo "expected exit 1 after SIGINT, got $status" >&2; exit 1; }
          grep -qx 'error: interrupted by the user' interrupt.txt

      # The README links to what owns each detail rather than copying it
      # (CONTRIBUTING.md).  What can drift mechanically is checked here: a
      # relative link, which Hackage renders as /package/<target> and 404s,
      # and a command or flag in a README console block that --help does not
      # list.
      - name: The README's links and commands are current
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cabal list-bin exe:nova-nix)
          help=$("$exe" --help)
          failed=0
          links=$(grep -noE '\]\([^)]*\)|^\[[^]]+\]:[[:space:]]+[^[:space:]]+' README.md || true)
          relative=$(grep -vE '\]\((https?://|#)|\]:[[:space:]]+https?://' <<<"$links" || true)
          if [ -n "$relative" ]; then
            printf '%s\n' "$relative"
            echo "::error file=README.md::the relative link above 404s on Hackage; link to the file on GitHub"
            failed=1
          fi
          commands=$(awk '/^```console/ { inside = 1; next } /^```/ { inside = 0 } inside && /nova-nix/' README.md)
          while read -r flag; do
            if ! grep -qE -- "(^| )${flag}( |,|$)" <<<"$help"; then
              echo "::error file=README.md::the README passes ${flag}, which nova-nix --help does not list"
              failed=1
            fi
          done < <(grep -oE '(^| )(-[A-Za-z]|--[a-z][a-z-]*)' <<<"$commands" | tr -d ' ' | sort -u)
          while read -r command; do
            if ! grep -qE "^  ${command}( |$)" <<<"$help"; then
              echo "::error file=README.md::the README runs nova-nix ${command}, which nova-nix --help does not list"
              failed=1
            fi
          done < <(sed -E 's/.*nova-nix(\.exe)? //' <<<"$commands" | awk '{ print ($1 == "store" ? $1 " " $2 : $1) }' | sort -u)
          exit "$failed"

      # CI is the only place that compiles for all three platforms, and it
      # discarded every result.  Keeping them means a Windows or macOS
      # failure can be reproduced on a real machine without installing a
      # toolchain there.  Staged after the tests so a binary that failed
      # them is never published.
      # bin/ beside share/ rather than a bare executable: the <nix/*> search
      # path resolves relative to the binary's own location, so an artifact
      # without share/ can evaluate but cannot build, which is most of what
      # someone downloads it to try.  Same layout a release archive ships.
      - name: Stage the executable
        shell: bash
        run: |
          set -euo pipefail
          cabal install exe:nova-nix --install-method=copy --installdir=staged/bin --overwrite-policy=always
          mkdir -p staged/share/nova-nix/nix
          cp data/nix/fetchurl.nix staged/share/nova-nix/nix/

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nova-nix-${{ matrix.name }}-${{ runner.arch }}
          path: staged/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # ---------------------------------------------------------------------------
  # End-to-end (Windows-only): the executable this repo ships, driving a real
  # build through the real stdenv - fetch the MinGW-w64 seed, build GNU hello
  # with it via genericBuild, and run the produced hello.exe.  Deliberately no
  # store cache: a warm store would let the builder skip the exact work this
  # job exists to exercise.
  # ---------------------------------------------------------------------------

  e2e-windows:
    name: E2E (Windows)
    needs: [cabal-check]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      # Installed rather than run from dist-newstyle: the bundled <nix/*>
      # search-path entry is the cabal data dir, which only exists for an
      # installed binary - and installing is how the README says to use it.
      - name: Install nova-nix
        run: cabal install exe:nova-nix --install-method=copy --installdir="$env:RUNNER_TEMP\bin" --overwrite-policy=always

      # A rooted path with no drive names the store's drive, C: for the
      # default C:\nix\store, so it reads the same file from every current
      # drive.  The file exists on C: only, so a pass from D:\ cannot come
      # from D:.
      - name: A path with no drive reads from the store's drive
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\bin\nova-nix.exe"
          $fixture = 'C:\probe\f.txt'
          [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($fixture)) | Out-Null
          [IO.File]::WriteAllText($fixture, 'probe')
          if (-not [IO.File]::Exists($fixture)) { Write-Error "fixture $fixture was not created"; exit 1 }
          if ([IO.File]::Exists('D:\probe\f.txt')) { Write-Error "D:\probe\f.txt exists, so D: would answer too"; exit 1 }
          $exprs = @(
            'builtins.pathExists "/probe/f.txt"',
            'builtins.pathExists /probe/f.txt',
            'builtins.readFile "/probe/f.txt" == "probe"',
            'builtins.pathExists "C:/probe/f.txt"',
            'builtins.pathExists "C:\\probe\\f.txt"'
          )
          foreach ($dir in 'C:\', 'D:\') {
            foreach ($expr in $exprs) {
              Push-Location $dir
              try {
                $got = (& $exe eval --expr $expr) -join "`n"
                $code = $LASTEXITCODE
              } finally {
                Pop-Location
              }
              Write-Host "from ${dir}: $expr -> $got"
              if ($code -ne 0 -or $got -ne 'true') {
                Write-Error "from ${dir}, $expr gave '$got' (exit $code), expected true"
                exit 1
              }
            }
          }

      - name: Provision the store root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\nix\store | Out-Null

      # Every source pkgs/windows fetches, from the public cache where it
      # holds it, so the builds below fetch none.  They name no substituter
      # and substitute nothing.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # pkgs/windows/hello.nix points at the by-name hello package, which
      # builds through the real stdenv (genericBuild, setup.sh) rather than
      # driving cmd.exe directly - the smallest thing that exercises a real
      # mkDerivation package.  The workspace lives on D: while the store is
      # anchored on C: - building from here is deliberate: it exercises
      # canonical /nix/store text rendered through the store dir.
      - name: Build hello.nix through the real stdenv
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\bin\nova-nix.exe"
          $out = (& $exe build pkgs\windows\hello.nix) | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { Write-Error "nova-nix build failed"; exit 1 }
          Write-Host "out path: $out"
          # setup.sh installs with `make install prefix=`, so autotools lands
          # the binary under bin/, not at the output root.
          $hello = Join-Path $out "bin\hello.exe"
          if (-not (Test-Path $hello)) { Write-Error "no bin\hello.exe in $out"; exit 1 }
          $got = (& $hello) -join "`n"
          Write-Host "output: $got"
          if ($got -ne "Hello, world!") {
            Write-Error "unexpected hello output: $got"
            exit 1
          }

      - name: Diagnose store layout on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($d in "C:\nix\store", "D:\nix\store") {
            Write-Host "== $d =="
            if (Test-Path $d) {
              Get-ChildItem $d -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }
            } else { Write-Host "(absent)" }
          }

  # ---------------------------------------------------------------------------
  # Stage0 (Windows): stage0-pe32's chain, from its 1,623-byte seed to kaem,
  # built by the executable this repo ships as one derivation per command of
  # x86/mescc-tools-mini.cmd.  Each link has to be the file stage0-pe32's own
  # CI builds with cmd.exe, byte for byte, and hex0 has to be the seed.  Then
  # mescc-tools-extra's thirteen programs, built by those links, each run
  # once, and kaem, mescc-tools and mescc-tools-extra as bin directories
  # whose programs are executable in their NARs, with kaem.runCommand running
  # scripts from them.  No store cache, for the reason E2E (Windows) has none.
  #
  # x64 and ARM64 Windows each run all of it, as stage0-pe32's CI runs its
  # chain on both: the links are i686, which x64 Windows runs through WoW64
  # and ARM64 Windows through its x86 emulator, and either can fail where the
  # other does not.  Both run the one x64 nova-nix that Stage0 (nova-nix)
  # builds, the build a release ships for Windows, since the ARM64 image has
  # no GHC.  ARM64 Windows runs it through its x64 emulator, and its system is
  # still the x86_64-windows compiled into it, so it builds the i686
  # derivations there as it does on x64.
  # ---------------------------------------------------------------------------

  stage0-nova-nix:
    name: Stage0 (nova-nix)
    needs: [cabal-check]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      # bin/ beside share/, the layout a release archive ships: the data dir
      # Cabal compiles in is in this runner's Cabal store, which the runners
      # below do not have, and the chain's sources are fetched through
      # <nix/fetchurl.nix>.  nova-nix.exe needs no DLL beyond Windows' own, so
      # these two files are all of it.
      - name: Stage nova-nix
        shell: bash
        run: |
          set -euo pipefail
          cabal install exe:nova-nix --install-method=copy --installdir=staged/bin --overwrite-policy=always
          mkdir -p staged/share/nova-nix/nix
          cp data/nix/fetchurl.nix staged/share/nova-nix/nix/

      # Kept for the 30 days a run can be re-run in: a re-run of the failed
      # Stage0 legs alone does not run this job again.
      - name: Upload nova-nix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage0-nova-nix
          path: staged/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  stage0-windows:
    name: Stage0 (${{ matrix.name }})
    needs: [stage0-nova-nix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: windows-11-arm
            name: Windows ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Into the temp root, so the executable is $RUNNER_TEMP/bin/nova-nix.exe
      # with share/ beside bin/.
      - name: Download nova-nix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage0-nova-nix
          path: ${{ runner.temp }}

      - name: Provision the store root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\nix\store | Out-Null

      # Every source pkgs/windows fetches, from the public cache where it
      # holds it, so the builds below fetch none.  They name no substituter
      # and substitute nothing.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # build prints the out path as its last stdout line.  Building a link
      # builds the links below it, so each later build finds them valid.
      - name: Build the chain
        shell: bash
        run: |
          set -euo pipefail
          for attr in hex0 hex1 hex2 catm M0 cc_x86 M2 M1 hex2-new kaem-unwrapped; do
            out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "stage0-pe32.$attr" | tail -n 1)
            path=$(cygpath -u "$out")
            echo "$attr $path" >> "$RUNNER_TEMP/links.txt"
          done
          cat "$RUNNER_TEMP/links.txt"

      # Each link's SHA-256 as stage0-pe32's CI prints it for ff1c2ad, the
      # commit pkgs/windows/by-name/st/stage0-pe32/sources.nix pins.  hex0's
      # is the seed's own: the build already refuses any other hex0, since
      # hex0 is fixed-output to it, and this checks the bytes from outside.
      - name: Each link is the one stage0-pe32 builds
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while read -r attr want; do
            path=$(awk -v attr="$attr" '$1 == attr { print $2 }' "$RUNNER_TEMP/links.txt")
            got=$(sha256sum "$path" | cut -d ' ' -f 1)
            if [ "$got" = "$want" ]; then
              echo "$got  $attr"
            else
              echo "::error::$attr is $got, stage0-pe32 builds $want"
              status=1
            fi
          done <<'EOF'
          hex0 b9db7be0fed7770be9fca46b7aa551b611fc60eaf1112a053531aae14aa46742
          hex1 889d18f1de1ffba70b2a8fa3915ed67b8ccff874fb20e63841cc5c301f890929
          hex2 5b74721141d8788e8334d68016d9360928e5e17e8364485a7b69279b0c2f657d
          catm b45fa38c731889344b37f91b124fddc643eb975b0d3b68bf6efbba07ed2e8c24
          M0 62519c24170f747b9cf2b4514c5967a2cc068f1d485743fedba736c73eb0dcf1
          cc_x86 a47b7cef346a2279c3aae684ad21d9316f04187730161997ab1a2a3a27b990e0
          M2 9109ba7e5fb65553aff021eef4152c19c2b774e7972c9e23b0266b21f56d0db2
          M1 ffa56be32281b490070b75ed1817d3d824bea884ae104c00b2052f7a94ec534f
          hex2-new 53ff3b520806cf0851ee160943580001edd5316fd92073dd4eb714ce8e4ae4aa
          kaem-unwrapped 044c93802e4eda29d5a98e6c1d3fb4146a228b5d01f30854a344a91238ee16f4
          EOF
          exit "$status"

      - name: Build mescc-tools-extra
        shell: bash
        run: |
          set -euo pipefail
          for name in sha256sum match mkdir untar ungz unbz2 unxz catm cp chmod rm replace wrap; do
            out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "stage0-pe32.mescc-tools-extra.$name" | tail -n 1)
            echo "$name $(cygpath -u "$out")" >> "$RUNNER_TEMP/extra.txt"
          done
          cat "$RUNNER_TEMP/extra.txt"

      # Each program once, from its store path, on the fixtures in
      # test/data/mescc-tools-extra: hello.txt, one line, and that line packed
      # four ways.  They were written on macOS, and the same commands write the
      # same bytes again (Python 3's tarfile, Apple gzip 487, bzip2 1.0.8, xz
      # 5.8.4):
      #   printf 'stage0-pe32 builds mescc-tools-extra\n' > hello.txt
      #   python3 -c 'import io, tarfile; d = open("hello.txt", "rb").read(); t = tarfile.open("hello.tar", "w", format=tarfile.USTAR_FORMAT); i = tarfile.TarInfo("files"); i.type = tarfile.DIRTYPE; i.mode = 0o755; t.addfile(i); i = tarfile.TarInfo("files/hello.txt"); i.size = len(d); i.mode = 0o644; t.addfile(i, io.BytesIO(d)); t.close()'
      #   gzip -9n < hello.txt > hello.txt.gz
      #   bzip2 -9 < hello.txt > hello.txt.bz2
      #   xz -9 --check=crc64 < hello.txt > hello.txt.xz
      # Each result is checked against a fixture, hello.txt's known SHA-256 or
      # bytes the runner's own printf and cat write, never against another
      # program under test.  rm, mkdir -p and untar exit 0 even when they
      # fail, so their results are checked on disk.  chmod's exit status says
      # only whether the file is there, since it ignores what chmod returns;
      # what it does to a file is checked by the marks build below.  wrap
      # bind-mounts /dev and /proc into the working directory to chroot
      # there, so it stops at its first mount, which M2libc's Windows mount
      # refuses.
      - name: mescc-tools-extra runs
        shell: bash
        run: |
          set -uo pipefail
          declare -A tool
          while read -r name path; do tool[$name]=$path; done < "$RUNNER_TEMP/extra.txt"
          run() { local name=$1; shift; "${tool[$name]}" "$@"; }
          status=0
          pass() { echo "ok    $1"; }
          fail() { echo "::error::$1"; status=1; }
          expect_exit() {
            local want=$1 code=0
            shift
            run "$@" || code=$?
            if [ "$code" = "$want" ]; then pass "$* exits $code"; else fail "$* exits $code, not $want"; fi
          }
          # cmp names the first byte that differs; the dumps show both files'
          # sizes and leading bytes, so a failure shows its cause.
          same() {
            if cmp "$1" "$2"; then
              pass "$3"
            else
              fail "$3: $2 is not $1"
              for file in "$1" "$2"; do
                echo "$file, $(wc -c < "$file") bytes:"
                od -A d -t x1 "$file" | head -n 8
              done
            fi
          }

          work="$(cygpath -u "$RUNNER_TEMP")/mescc-tools-extra"
          mkdir "$work"
          cp test/data/mescc-tools-extra/* "$work"
          cd "$work" || exit 1
          hello=1aa502522f8046e4c671fcff6da0e9bb3bbac2526fd653d93a71f98dd389b6ab

          got=$(run sha256sum hello.txt)
          if [ "$got" = "$hello  hello.txt" ]; then pass "sha256sum: $got"; else fail "sha256sum printed: $got"; fi
          printf '%s  hello.txt\n' "$hello" > hello.sha256
          expect_exit 0 sha256sum -c hello.sha256
          printf '%064d  hello.txt\n' 0 > wrong.sha256
          expect_exit 1 sha256sum -c wrong.sha256

          expect_exit 0 match same same
          expect_exit 1 match same other

          expect_exit 0 mkdir -p made/a/b
          if [ -d made/a/b ]; then pass "mkdir -p made/a/b made it"; else fail "mkdir -p made/a/b made nothing"; fi

          expect_exit 0 cp hello.txt copy.txt
          same hello.txt copy.txt "cp copies the bytes"
          expect_exit 0 catm twice.txt hello.txt hello.txt
          cat hello.txt hello.txt > twice-want.txt
          same twice-want.txt twice.txt "catm joins the bytes"
          expect_exit 0 replace --file hello.txt --match-on builds --replace-with built --output replaced.txt
          printf 'stage0-pe32 built mescc-tools-extra\n' > replaced-want.txt
          same replaced-want.txt replaced.txt "replace replaces"

          expect_exit 0 chmod 755 copy.txt
          expect_exit 1 chmod 755 missing.txt
          expect_exit 0 rm copy.txt
          if [ ! -e copy.txt ]; then pass "rm removed copy.txt"; else fail "rm left copy.txt"; fi

          expect_exit 0 untar --file hello.tar
          same hello.txt files/hello.txt "untar extracts files/hello.txt"
          expect_exit 0 ungz --file hello.txt.gz --output from-gz.txt
          same hello.txt from-gz.txt "ungz decompresses"
          expect_exit 0 unbz2 --file hello.txt.bz2 --output from-bz2.txt
          same hello.txt from-bz2.txt "unbz2 decompresses"
          expect_exit 0 unxz --file hello.txt.xz --output from-xz.txt
          same hello.txt from-xz.txt "unxz decompresses"

          mkdir wrapped
          cd wrapped || exit 1
          code=0
          said=$(run wrap "${tool[match]}" same same 2>&1) || code=$?
          if [ "$code" = 1 ] && [ "$said" = "Failed to mount directory dev/null" ]; then
            pass "wrap stops at its first mount"
          else
            fail "wrap exited $code and said: $said"
          fi
          exit "$status"

      # kaem-unwrapped laying out kaem, mescc-tools and mescc-tools-extra as
      # bin directories with mescc-tools-extra's mkdir, cp and chmod.  Each
      # path is kept as Windows spells it too, for PowerShell.
      - name: Build the bin directories
        shell: bash
        run: |
          set -euo pipefail
          for attr in kaem mescc-tools mescc-tools-extra; do
            out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "stage0-pe32.$attr" | tail -n 1)
            echo "$attr $(cygpath -u "$out")" >> "$RUNNER_TEMP/bins.txt"
            echo "$attr $out" >> "$RUNNER_TEMP/bins-windows.txt"
          done
          cat "$RUNNER_TEMP/bins.txt"

      # Each file of each bin directory is the program it was copied from,
      # byte for byte.
      - name: Each bin directory holds its programs
        shell: bash
        run: |
          set -uo pipefail
          declare -A store
          while read -r attr path; do store[$attr]=$path; done < "$RUNNER_TEMP/links.txt"
          while read -r name path; do store[mescc-tools-extra.$name]=$path; done < "$RUNNER_TEMP/extra.txt"
          while read -r attr path; do store[$attr]=$path; done < "$RUNNER_TEMP/bins.txt"
          status=0
          holds() {
            if cmp "${store[$1]}/bin/$2" "${store[$3]}"; then
              echo "ok    $1/bin/$2 is $3"
            else
              echo "::error::$1/bin/$2 is not $3"
              status=1
            fi
          }
          holds kaem kaem.exe kaem-unwrapped
          holds mescc-tools M2-Planet.exe M2
          holds mescc-tools M1.exe M1
          holds mescc-tools hex2.exe hex2-new
          for name in sha256sum match mkdir untar ungz unbz2 unxz catm cp chmod rm replace wrap; do
            holds mescc-tools-extra "$name.exe" "mescc-tools-extra.$name"
          done
          exit "$status"

      # chmod 555 marks each program executable as the nova.exec stream
      # beside it, which nova-nix reads as the bit.  PowerShell reads streams
      # through Win32, and the step above has already found every program.
      - name: Each bin directory marks its programs executable
        shell: pwsh
        run: |
          $failed = 0
          foreach ($line in Get-Content -LiteralPath "$env:RUNNER_TEMP/bins-windows.txt") {
            $attr, $path = $line -split ' ', 2
            foreach ($file in Get-ChildItem -LiteralPath (Join-Path $path 'bin') -File) {
              if (Get-Item -LiteralPath $file.FullName -Stream nova.exec -ErrorAction SilentlyContinue) {
                "ok    $attr/bin/$($file.Name) is marked executable"
              } else {
                "::error::$attr/bin/$($file.Name) is not marked executable"
                $failed++
              }
            }
          }
          if ($failed) { exit 1 }

      # test/data/run-command.nix's marks is fixed-output to the NAR hash its
      # tree has on POSIX, with bin/hello executable and hello.txt not, so it
      # builds only if what chmod 555 marked registers as executable and what
      # chmod 755 and then 644 left registers as not.
      - name: A file the build marks is executable in its NAR
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/run-command.nix -A marks

      # test/data/run-command.nix: hello, written by writeText, and copies, a
      # runCommand script that calls mkdir, cp and catm by bare name on
      # hello's store path.  Each output is checked against bytes the
      # runner's own printf and cat write.
      - name: runCommand runs a kaem script
        shell: bash
        run: |
          set -euo pipefail
          build() { "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/run-command.nix -A "$1" | tail -n 1; }
          hello=$(cygpath -u "$(build hello)")
          copies=$(cygpath -u "$(build copies)")
          work="$(cygpath -u "$RUNNER_TEMP")/run-command"
          mkdir "$work"
          printf 'stage0-pe32 runs a kaem script\n' > "$work/hello.txt"
          cat "$work/hello.txt" "$work/hello.txt" > "$work/twice.txt"
          status=0
          same() {
            if cmp "$1" "$2"; then
              echo "ok    $3"
            else
              echo "::error::$3: $2 is not $1"
              status=1
            fi
          }
          same "$work/hello.txt" "$hello" "writeText writes the text"
          same "$work/hello.txt" "$copies/a/b/hello.txt" "mkdir -p and cp copy it into a/b"
          same "$work/twice.txt" "$copies/twice.txt" "catm joins it twice"
          exit "$status"

      # kaem runs the script strict, so cp's failure stops it before the mkdir
      # that would make the output, and the build fails with kaem's reason.
      # --verbose echoes each command kaem runs, so the mkdir is never echoed.
      - name: A failing command fails runCommand
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/fails.log"
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/run-command.nix -A fails > /dev/null 2> "$log" || code=$?
          cat "$log"
          status=0
          fail() { echo "::error::$1"; status=1; }
          [ "$code" != 0 ] || fail "fails built"
          grep -Fqx 'Error opening source file missing.txt' "$log" || fail "cp did not report missing.txt"
          grep -Fqx 'Subprocess error 1' "$log" || fail "kaem did not report cp's exit status"
          grep -Fqx 'ABORTING HARD' "$log" || fail "kaem did not abort"
          if grep -Fq ' +> mkdir' "$log"; then fail "kaem ran the mkdir after cp failed"; fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Ladder (mode): how this run's Mes and Bootstrap legs come by the seed
  # ladder, the rungs pkgs/windows builds from its 1,623-byte seed.  Decided
  # once a run, from the files a pull request changes, by
  # .github/cache/ladder-mode.sh, which has the rules:
  #
  #   skip         documentation alone.  The legs do not run.  Neither is a
  #                required check, and the Stage0 legs, which are, still
  #                build their chain from the seed.
  #   seed         a change to the builder.  The legs build every rung
  #                from the seed and name no substituter.
  #   substitute   any other change.  The legs name the public cache as a
  #                substituter, so a rung the pull request leaves alone is
  #                downloaded and one it changes builds, its store path
  #                being one the cache lacks.  A leg fails if a rung the
  #                cache holds is built all the same
  #                (.github/cache/substitute-rungs.sh).  The checks under
  #                test/data build in every mode: each forbids substitutes.
  #
  # A run for anything but a pull request is seed.  A push to main publishes
  # what its legs build, so it has to build all of it.
  #
  # The changed files come from git, which needs no token and has no page
  # limit: a pull_request run checks out the merge commit GitHub makes of
  # the pull request and its base, and that commit's first parent is the
  # base.  The diff between the two is what the pull request changes in the
  # tree the legs build.
  # ---------------------------------------------------------------------------
  ladder-mode:
    name: Ladder (mode)
    # The merge queue runs neither leg, so it has no mode to decide.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      # Two commits deep: the merge commit and its parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # A wrong skip is a run that tests nothing and stays green, so the
      # rules are checked against their cases before they decide anything.
      - name: The rules decide their cases
        run: bash .github/cache/ladder-mode-cases.sh

      # --no-renames lists a renamed file under both of its names.  Git's
      # default lists the new one alone, and a builder file renamed to a
      # document would pass for documentation.  A checkout that is no merge
      # commit is refused: its first parent is the commit before it, not the
      # base, and the diff would be of the last commit alone.
      - name: Decide the mode
        id: decide
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
              echo "::error::the checkout is not a pull request's merge commit, so its first parent is not the base"
              exit 1
            fi
            mode=$(git diff --name-only --no-renames -z HEAD^1 HEAD | bash .github/cache/ladder-mode.sh)
          else
            mode=seed
          fi
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Mes (Windows): GNU Mes 0.28 on the Windows stage0 tools, as nixpkgs'
  # minimal-bootstrap/mes builds 0.27.1: mes-m2 from kaem.windows.run, the
  # Mes C library compiled by MesCC running on mes-m2, and mes.exe compiled
  # by MesCC.  test/data/mes.nix runs mes-m2 and mes with --version in a
  # build, as nixpkgs' get-version test does, and hello, which MesCC compiles
  # and links with mes, runs here.  exec-bit runs a program MesCC builds that
  # marks files with open and chmod, and registers only if nova-nix reads
  # each file's execute bit as its mode set it.  x64 and ARM64 Windows each
  # run all of it, for the reason Stage0 (Windows) runs on both, with the
  # nova-nix Stage0 (nova-nix) builds.  Each builds every rung from the seed
  # unless Ladder (mode) has it take the unchanged ones from the public
  # cache.
  #
  # From the seed the ARM64 leg takes about 37 minutes, most of them MesCC
  # compiling the libraries and mes under the x86 emulator, and the timeout
  # is twice that.
  # ---------------------------------------------------------------------------
  mes-windows:
    name: Mes (${{ matrix.name }})
    needs: [stage0-nova-nix, ladder-mode]
    # Not run in the merge queue.  Neither leg is a required check, so the
    # queue merges without waiting for them, and the push to main that
    # follows runs both on the same commit.  Not run for a pull request
    # that changes documentation alone, either.
    if: github.event_name != 'merge_group' && needs.ladder-mode.outputs.mode != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: windows-11-arm
            name: Windows ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 74
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nova-nix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage0-nova-nix
          path: ${{ runner.temp }}

      - name: Provision the store root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\nix\store | Out-Null

      # Every source pkgs/windows fetches, from the public cache where it
      # holds it, so the builds below fetch none.  Outside substitute mode
      # they name no substituter and substitute nothing.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # Substitute mode names the cache for every step below: nova-nix reads
      # these two settings from NIX_CONFIG, so no build there needs a flag.
      # A step writes it because the job's own env cannot: the workflow's
      # env, which holds the address and the key, is not a context that
      # jobs.<job_id>.env may read.  It comes after the sources step, which
      # names the cache by flag.
      - name: Name the public cache as a substituter
        if: needs.ladder-mode.outputs.mode == 'substitute'
        shell: bash
        run: |
          {
            echo 'NIX_CONFIG<<END_OF_NIX_CONFIG'
            echo "substituters = $CACHE_URL"
            echo "trusted-public-keys = $CACHE_PUBLIC_KEY"
            echo 'END_OF_NIX_CONFIG'
          } >> "$GITHUB_ENV"

      # This leg's rungs (pkgs/windows/rungs.nix), each downloaded where the
      # cache holds it and built where the pull request changes it.  The
      # script fails if a rung the cache holds is built.  nova-nix passes
      # over a narinfo that no trusted key signs and builds, so without the
      # check a key the cache no longer signs with would turn every run
      # back into a build from the seed and stay green.  The build steps
      # below then find each rung valid, and the time each prints is the
      # time to find it so.
      - name: Take the unchanged rungs from the public cache
        if: needs.ladder-mode.outputs.mode == 'substitute'
        shell: bash
        run: bash .github/cache/substitute-rungs.sh "$RUNNER_TEMP/bin/nova-nix.exe" mes

      # The stage0 tools, NYACC, and the source tree with mes-m2 in its bin
      # output, each timed.
      - name: Build mes-m2
        shell: bash
        run: |
          set -euo pipefail
          for attr in stage0-pe32.kaem stage0-pe32.mescc-tools stage0-pe32.mescc-tools-extra mes.nyacc mes.srcPost; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$attr"
            echo "== $attr built in $((SECONDS - start)) s"
          done

      # kaem runs the script strict, so a program that exits nonzero fails
      # the build, and the line it printed is in the build's log.
      - name: mes-m2 prints its version
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/mes-m2-version.log"
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/mes.nix -A mes-m2 > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::mes-m2 --version failed its build"; exit 1; fi
          if ! grep -Fqx 'mes (GNU Mes) 0.28' "$log"; then echo "::error::mes-m2 --version did not print mes (GNU Mes) 0.28"; exit 1; fi
          echo "ok    mes-m2 --version"

      # crt1, the four libraries and the directory MesCC links from, then
      # mes compiled and linked by MesCC on mes-m2, each timed.
      - name: Build the libraries and mes
        shell: bash
        run: |
          set -euo pipefail
          for attr in mes.libs mes.compiler; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$attr"
            echo "== $attr built in $((SECONDS - start)) s"
          done

      - name: mes prints its version
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/mes-version.log"
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/mes.nix -A mes > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::mes --version failed its build"; exit 1; fi
          if ! grep -Fqx 'mes (GNU Mes) 0.28' "$log"; then echo "::error::mes --version did not print mes (GNU Mes) 0.28"; exit 1; fi
          echo "ok    mes --version"

      # hello prints its first argument, or Mes, and exits with its argument
      # count, so a run with an argument checks argv and the exit status
      # crt1 hands back as well as the greeting.  Each output is checked
      # against bytes the runner's own printf writes.
      - name: A program MesCC builds runs
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/mes.nix -A hello | tail -n 1); then
            echo "::error::hello did not build"
            exit 1
          fi
          hello=$(cygpath -u "$out")/bin/hello.exe
          work="$(cygpath -u "$RUNNER_TEMP")/mes-hello"
          mkdir "$work"
          status=0
          runs() {
            local want_code=$1 want_out=$2 code=0
            shift 2
            "$hello" "$@" > "$work/out.txt" || code=$?
            printf '%s\n' "$want_out" > "$work/want.txt"
            if [ "$code" = "$want_code" ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    hello.exe${*:+ $*} prints $want_out and exits $code"
            else
              echo "::error::hello.exe${*:+ $*} exited $code, not $want_code, and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs 0 'Hello, Mes!'
          runs 1 'Hello, Windows!' Windows
          exit "$status"

      # test/data/mes.nix's exec-bit is fixed-output to the NAR hash its tree
      # has on POSIX, with open-0755 and chmod-0755 executable and open-0644
      # not, so it builds only if what Mes libc's open with mode 0755 and its
      # chmod 0755 marked registers as executable and what its open with mode
      # 0644 made registers as not.
      - name: A file a program MesCC builds marks is executable in its NAR
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/mes.nix -A exec-bit

      # The C library's sources for TinyCC.
      - name: Build the Mes C library sources
        shell: bash
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A mes.libc | tail -n 1)
          libc=$(cygpath -u "$out")
          status=0
          for file in libc.c crt1.c libtcc1.c libgetopt.c; do
            if [ -s "$libc/lib/$file" ]; then
              echo "ok    lib/$file, $(wc -c < "$libc/lib/$file") bytes"
            else
              echo "::error::lib/$file is missing or empty"
              status=1
            fi
          done
          exit "$status"

  # ---------------------------------------------------------------------------
  # Bootstrap (Windows): the rungs above Mes, from the seed.  TinyCC first,
  # tinycc-boot-mes to tinycc-mes, as nixpkgs' minimal-bootstrap/tinycc
  # builds them: janneke's bootstrappable TinyCC compiled by MesCC on mes
  # into a tcc that writes PE32, then by each round's tcc into the next, each
  # round compiling the Mes C library the next links with, and TinyCC's own
  # source compiled by the last of those rounds and then by itself.  Then
  # tinycc-native, that source as a native Windows compiler on msvcrt,
  # compiled twice, and GNU make and busybox-w32, compiled by it.
  # test/data/tinycc.nix runs the tccs with -version in a build, as nixpkgs'
  # get-version test does, and the programs each compiles and links run
  # here: hello for each, float, which prints the words of a double, from
  # tinycc-bootstrappable on, and printf-float, which prints a double
  # through %f, from tinycc-mes on.  test/data/gnumake.nix runs make with
  # --version and has it build a target through a pattern rule, and
  # test/data/busybox.nix runs busybox --version and has busybox's sh run a
  # script through the applets configure runs.  Last, the seed stdenv made
  # of those builds GNU Hello, which runs here, binutils, whose as, ar and
  # ld test/data/binutils.nix has build a program that runs, GCC 4.6.4's
  # C compiler and libgcc over MinGW-w64's headers, which
  # test/data/gcc-core.nix has compile sources whose assembly is compared
  # and a program that runs, and MinGW-w64's runtime, which that compiler
  # compiles and gcc46 lays out beside it, so that test/data/gcc46.nix has
  # gcc46 link a C program that runs.  x64 and ARM64 Windows each run all
  # of it, for the reason Stage0 (Windows) runs on both.  Each builds every
  # rung from the seed unless Ladder (mode) has it take the unchanged ones
  # from the public cache.
  #
  # From the seed the ARM64 leg takes about 116 minutes under the x86
  # emulator: about 39 of them MesCC compiling the Mes libraries, mes and
  # tcc, 48 tcc compiling GCC and 16 binutils.  The timeout is twice that.
  # ---------------------------------------------------------------------------
  bootstrap-windows:
    name: Bootstrap (${{ matrix.name }})
    needs: [stage0-nova-nix, ladder-mode]
    # Not run in the merge queue.  Neither leg is a required check, so the
    # queue merges without waiting for them, and the push to main that
    # follows runs both on the same commit.  Not run for a pull request
    # that changes documentation alone, either.
    if: github.event_name != 'merge_group' && needs.ladder-mode.outputs.mode != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            publish: true
          - os: windows-11-arm
            name: Windows ARM64
            publish: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 232
    # The x64 leg of a push to main publishes what it built (the last step),
    # with the token the publish job uses, a secret of the `cache`
    # environment.  That environment admits main alone, and GitHub refuses a
    # job that references it from any other ref, so the name is empty
    # everywhere else and the job references no environment.  One leg
    # publishes: both build the same store paths, and a cache holding some
    # from each would not hold the bytes either leg's checks ran on.
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.publish && 'cache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nova-nix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage0-nova-nix
          path: ${{ runner.temp }}

      - name: Provision the store root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\nix\store | Out-Null

      # Every source pkgs/windows fetches, from the public cache where it
      # holds it, so the builds below fetch none.  Outside substitute mode
      # they name no substituter and substitute nothing.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # Substitute mode names the cache for every step below: nova-nix reads
      # these two settings from NIX_CONFIG, so no build there needs a flag.
      # A step writes it because the job's own env cannot: the workflow's
      # env, which holds the address and the key, is not a context that
      # jobs.<job_id>.env may read.  It comes after the sources step, which
      # names the cache by flag.
      - name: Name the public cache as a substituter
        if: needs.ladder-mode.outputs.mode == 'substitute'
        shell: bash
        run: |
          {
            echo 'NIX_CONFIG<<END_OF_NIX_CONFIG'
            echo "substituters = $CACHE_URL"
            echo "trusted-public-keys = $CACHE_PUBLIC_KEY"
            echo 'END_OF_NIX_CONFIG'
          } >> "$GITHUB_ENV"

      # This leg's rungs (pkgs/windows/rungs.nix), each downloaded where the
      # cache holds it and built where the pull request changes it.  The
      # script fails if a rung the cache holds is built.  nova-nix passes
      # over a narinfo that no trusted key signs and builds, so without the
      # check a key the cache no longer signs with would turn every run
      # back into a build from the seed and stay green.  The build steps
      # below then find each rung valid, and the time each prints is the
      # time to find it so.
      - name: Take the unchanged rungs from the public cache
        if: needs.ladder-mode.outputs.mode == 'substitute'
        shell: bash
        run: bash .github/cache/substitute-rungs.sh "$RUNNER_TEMP/bin/nova-nix.exe" bootstrap

      # The stage0 tools and the Mes rung TinyCC builds on, each timed.
      - name: Build Mes
        shell: bash
        run: |
          set -euo pipefail
          for attr in stage0-pe32.kaem stage0-pe32.mescc-tools stage0-pe32.mescc-tools-extra mes.nyacc mes.srcPost mes.libs mes.compiler mes.libc; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$attr"
            echo "== $attr built in $((SECONDS - start)) s"
          done

      - name: Build tinycc-boot-mes
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A tinycc.boot-mes.compiler
          echo "== tinycc.boot-mes.compiler built in $((SECONDS - start)) s"

      # kaem runs the script strict, so a tcc that exits nonzero fails the
      # build, and the line it printed is in the build's log.  tcc.c prints
      # i386 Windows for TCC_TARGET_I386 with TCC_TARGET_PE.
      - name: tcc prints its version
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/tcc-version.log"
          want='tcc version 0.9.28-unstable-2024-07-07 (i386 Windows)'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A boot-mes > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::tcc -version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::tcc -version did not print $want"; exit 1; fi
          echo "ok    tcc -version"

      # crt1.o, libtcc1.a, libc.a and libgetopt.a, each compiled by
      # tinycc-boot-mes, timed.
      - name: Build the libraries
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A tinycc.boot-mes.libs | tail -n 1)
          echo "== tinycc.boot-mes.libs built in $((SECONDS - start)) s"
          libs=$(cygpath -u "$out")
          status=0
          for file in crt1.o libtcc1.a libc.a libgetopt.a; do
            if [ -s "$libs/lib/$file" ]; then
              echo "ok    lib/$file, $(wc -c < "$libs/lib/$file") bytes"
            else
              echo "::error::lib/$file is missing or empty"
              status=1
            fi
          done
          exit "$status"

      # hello prints its first argument, or TinyCC, and exits with its
      # argument count, so a run with an argument checks argv and the exit
      # status crt1 hands back as well as the greeting.  tcc links it with
      # no import table, as Mes libc reaches ntdll through the PEB.  Each
      # output is checked against bytes the runner's own printf writes.
      - name: A program tcc builds runs
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A hello | tail -n 1); then
            echo "::error::hello did not build"
            exit 1
          fi
          hello=$(cygpath -u "$out")/bin/hello.exe
          work="$(cygpath -u "$RUNNER_TEMP")/tcc-hello"
          mkdir "$work"
          status=0
          runs() {
            local want_code=$1 want_out=$2 code=0
            shift 2
            "$hello" "$@" > "$work/out.txt" || code=$?
            printf '%s\n' "$want_out" > "$work/want.txt"
            if [ "$code" = "$want_code" ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    hello.exe${*:+ $*} prints $want_out and exits $code"
            else
              echo "::error::hello.exe${*:+ $*} exited $code, not $want_code, and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs 0 'Hello, TinyCC!'
          runs 1 'Hello, Windows!' Windows
          exit "$status"

      # boot0 to boot3 and tinycc-bootstrappable, each tcc compiled by the
      # round before it with the library that round compiled, timed.
      - name: Build the bootstrappable rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in boot0 boot1 boot2 boot3 bootstrappable; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "tinycc.$round.libs"
            echo "== tinycc.$round built in $((SECONDS - start)) s"
          done

      - name: tinycc-bootstrappable prints its version
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/bootstrappable-version.log"
          want='tcc version 0.9.28-unstable-2024-07-07 (i386 Windows)'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A bootstrappable > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::tinycc-bootstrappable -version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::tinycc-bootstrappable -version did not print $want"; exit 1; fi
          echo "ok    tinycc-bootstrappable -version"

      # hello as tinycc-boot-mes's, and float, which prints the two words of
      # its argument count times 1.25 as a double, so it fails if the tcc
      # reads the literal, converts the count or multiplies wrongly.  Each
      # output is checked against bytes the runner's own printf writes.
      - name: Programs tinycc-bootstrappable builds run
        shell: bash
        run: |
          set -uo pipefail
          build() {
            "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A "$1" | tail -n 1
          }
          if ! hello=$(build bootstrappable-hello) || ! float=$(build bootstrappable-float); then
            echo "::error::bootstrappable-hello or bootstrappable-float did not build"
            exit 1
          fi
          hello=$(cygpath -u "$hello")/bin/hello.exe
          float=$(cygpath -u "$float")/bin/float.exe
          work="$(cygpath -u "$RUNNER_TEMP")/tcc-bootstrappable"
          mkdir "$work"
          status=0
          runs() {
            local exe=$1 want_code=$2 want_out=$3 code=0
            shift 3
            "$exe" "$@" > "$work/out.txt" || code=$?
            printf '%s\n' "$want_out" > "$work/want.txt"
            if [ "$code" = "$want_code" ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    ${exe##*/}${*:+ $*} prints $want_out and exits $code"
            else
              echo "::error::${exe##*/}${*:+ $*} exited $code, not $want_code, and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs "$hello" 0 'Hello, TinyCC!'
          runs "$hello" 1 'Hello, Windows!' Windows
          runs "$float" 0 '3ff40000 0'
          runs "$float" 0 '40040000 0' x
          exit "$status"

      # tccdefs, tinycc-mes-boot and tinycc-mes, as nixpkgs' mes.nix builds
      # them: TinyCC's own source compiled by tinycc-bootstrappable, then by
      # itself, each round's library compiled by its tcc, timed.
      - name: Build tinycc-mes
        shell: bash
        run: |
          set -euo pipefail
          for round in tinycc-mes.prev tinycc-mes; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$round.libs"
            echo "== $round built in $((SECONDS - start)) s"
          done

      - name: tinycc-mes prints its version
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/mes-version.log"
          want='tcc version 0.9.28-unstable-2025-12-03 (i386 Windows)'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A mes > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::tinycc-mes -version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::tinycc-mes -version did not print $want"; exit 1; fi
          echo "ok    tinycc-mes -version"

      # hello and float as tinycc-bootstrappable's, and printf-float, which
      # prints its argument count times 1.25 through printf's %f: Mes's
      # dtoab casts the double to long, a call to __fixdfdi, which this
      # round's libtcc1, TinyCC's own, has.  Each output is checked against
      # bytes the runner's own printf writes.
      - name: Programs tinycc-mes builds run
        shell: bash
        run: |
          set -uo pipefail
          build() {
            "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A "$1" | tail -n 1
          }
          if ! hello=$(build mes-hello) || ! float=$(build mes-float) || ! printf_float=$(build mes-printf-float); then
            echo "::error::mes-hello, mes-float or mes-printf-float did not build"
            exit 1
          fi
          hello=$(cygpath -u "$hello")/bin/hello.exe
          float=$(cygpath -u "$float")/bin/float.exe
          printf_float=$(cygpath -u "$printf_float")/bin/printf-float.exe
          work="$(cygpath -u "$RUNNER_TEMP")/tcc-mes"
          mkdir "$work"
          status=0
          runs() {
            local exe=$1 want_code=$2 want_out=$3 code=0
            shift 3
            "$exe" "$@" > "$work/out.txt" || code=$?
            printf '%s\n' "$want_out" > "$work/want.txt"
            if [ "$code" = "$want_code" ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    ${exe##*/}${*:+ $*} prints $want_out and exits $code"
            else
              echo "::error::${exe##*/}${*:+ $*} exited $code, not $want_code, and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs "$hello" 0 'Hello, TinyCC!'
          runs "$hello" 1 'Hello, Windows!' Windows
          runs "$float" 0 '3ff40000 0'
          runs "$float" 0 '40040000 0' x
          runs "$printf_float" 0 '1.25'
          runs "$printf_float" 0 '2.5' x
          exit "$status"

      # tinycc-native.prev, TinyCC's own source compiled by tinycc-mes as a
      # native Windows compiler, then tinycc-native, the same source compiled
      # by that, each round's runtime compiled by its tcc, timed.
      - name: Build tinycc-native
        shell: bash
        run: |
          set -euo pipefail
          for round in tinycc-native.prev tinycc-native; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$round.libs"
            echo "== $round built in $((SECONDS - start)) s"
          done

      # Both rounds compile the same source with the same command line and
      # link it against a runtime compiled from the same sources, and tcc
      # writes no timestamp, so tinycc-native's tcc.exe is
      # tinycc-native.prev's unless tinycc-mes, which compiled the first,
      # generated other code than a native tcc does.  The two compiling tccs
      # differ in what tcc's source does not read: the macros tinycc-mes
      # predefines from Mes's config.h, and __MINGW32__.  They differ also
      # in the C library that reads tcc's floating-point literals, strtod,
      # which is Mes's in tinycc-mes and msvcrt's in a native tcc.
      - name: tinycc-native reproduces itself
        shell: bash
        run: |
          set -uo pipefail
          if ! prev=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A tinycc-native.prev.compiler | tail -n 1) ||
            ! final=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A tinycc-native.compiler | tail -n 1); then
            echo "::error::tinycc-native.prev or tinycc-native did not build"
            exit 1
          fi
          prev=$(cygpath -u "$prev")/bin/tcc.exe
          final=$(cygpath -u "$final")/bin/tcc.exe
          if cmp "$prev" "$final"; then
            echo "ok    tinycc-native's tcc.exe is tinycc-native.prev's, $(wc -c < "$final") bytes"
          else
            echo "::error::tinycc-native's tcc.exe differs from tinycc-native.prev's"
            exit 1
          fi

      # The version line, as tinycc-mes's, whose defines are the same; and
      # the library directories tinycc-native searches, which must be the -B
      # directory alone: a tcc compiled with _WIN32 adds the Windows system
      # directory after it, and tinycc-mes's source removes that call.  The
      # build log ends a line at a carriage return, so msvcrt's CRLF lines
      # match whole.
      - name: tinycc-native prints its version and searches no system directory
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/native-version.log"
          want='tcc version 0.9.28-unstable-2025-12-03 (i386 Windows)'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A native > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::tinycc-native -version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::tinycc-native -version did not print $want"; exit 1; fi
          echo "ok    tinycc-native -version"
          if ! libs=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A tinycc-native.libs | tail -n 1); then
            echo "::error::tinycc-native.libs did not build"
            exit 1
          fi
          base=${libs##*/}
          libdir=${base##*\\}/lib
          log="$RUNNER_TEMP/native-search-dirs.log"
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A native-search-dirs > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::tinycc-native -print-search-dirs failed its build"; exit 1; fi
          dirs=$(sed -n '/^libraries:$/,/^libtcc1:$/p' "$log" | sed '1d;$d')
          count=$(printf '%s\n' "$dirs" | grep -c .)
          dir=${dirs#"  "}
          if [ "$count" != 1 ] || [ "${dir%"$libdir"}" = "$dir" ]; then
            echo "::error::tinycc-native searches $count library directories, not $libdir alone"
            exit 1
          fi
          echo "ok    tinycc-native searches $dir alone"

      # hello, float and printf-float as tinycc-mes's, linked by
      # tinycc-native against msvcrt.dll and kernel32.dll; winsock, which it
      # links with -lws2_32, so that it fails unless -l finds ws2_32.def,
      # and which prints 0x1234 through ws2_32.dll's htons, in network byte
      # order; math, which it links with -lm, so that it fails unless -l
      # finds the runtime's empty libm.a, and which prints a square root
      # through msvcrt.dll's sqrt; and mingw32, which compiles only if
      # tinycc-native predefines __MINGW32__.  msvcrt's stdout is a text stream, which writes each
      # newline as a carriage return and a newline, and its printf prints %f
      # with six decimals.
      - name: Programs tinycc-native builds run
        shell: bash
        run: |
          set -uo pipefail
          build() {
            "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/tinycc.nix -A "$1" | tail -n 1
          }
          if ! build native-mingw32 > /dev/null; then
            echo "::error::native-mingw32 did not build; the log above says whether tinycc-native lacks __MINGW32__"
            exit 1
          fi
          echo "ok    tinycc-native predefines __MINGW32__"
          if ! hello=$(build native-hello) || ! float=$(build native-float) || ! printf_float=$(build native-printf-float) || ! winsock=$(build native-winsock) || ! math=$(build native-math); then
            echo "::error::native-hello, native-float, native-printf-float, native-winsock or native-math did not build"
            exit 1
          fi
          hello=$(cygpath -u "$hello")/bin/hello.exe
          float=$(cygpath -u "$float")/bin/float.exe
          printf_float=$(cygpath -u "$printf_float")/bin/printf-float.exe
          winsock=$(cygpath -u "$winsock")/bin/winsock.exe
          math=$(cygpath -u "$math")/bin/math.exe
          work="$(cygpath -u "$RUNNER_TEMP")/tcc-native"
          mkdir "$work"
          status=0
          runs() {
            local exe=$1 want_code=$2 want_out=$3 code=0
            shift 3
            "$exe" "$@" > "$work/out.txt" || code=$?
            printf '%s\r\n' "$want_out" > "$work/want.txt"
            if [ "$code" = "$want_code" ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    ${exe##*/}${*:+ $*} prints $want_out and exits $code"
            else
              echo "::error::${exe##*/}${*:+ $*} exited $code, not $want_code, and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs "$hello" 0 'Hello, TinyCC!'
          runs "$hello" 1 'Hello, Windows!' Windows
          runs "$float" 0 '3ff40000 0'
          runs "$float" 0 '40040000 0' x
          runs "$printf_float" 0 '1.250000'
          runs "$printf_float" 0 '2.500000' x
          runs "$winsock" 0 '3412'
          runs "$math" 0 '1.414214'
          runs "$math" 0 '2.000000' x
          exit "$status"

      # A check that cannot fail is a run that tests nothing and stays green,
      # so the build-path check is run against its cases before it decides
      # anything.
      - name: The build-path check decides its cases
        shell: bash
        run: bash .github/bootstrap/no-build-path-cases.sh

      # No round's tcc.exe names the store directory or its build directory
      # (.github/bootstrap/no-build-path.sh says why).
      - name: No TinyCC round's tcc.exe names the store or its build directory
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for round in tinycc.boot-mes tinycc.boot0 tinycc.boot1 tinycc.boot2 tinycc.boot3 tinycc.bootstrappable tinycc-mes.prev tinycc-mes tinycc-native.prev tinycc-native; do
            if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$round.compiler" | tail -n 1); then
              echo "::error::$round.compiler did not build"
              status=1
              continue
            fi
            bash .github/bootstrap/no-build-path.sh "$round.compiler" "$out" bin/tcc.exe || status=1
          done
          exit "$status"

      # GNU make, compiled by tinycc-native, timed.
      - name: Build GNU make
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A gnumake
          echo "== gnumake built in $((SECONDS - start)) s"

      # make --version prints its version line, and make builds greeting.txt
      # from greeting.in through a pattern rule whose recipe is cmd.exe's
      # copy, which make runs from a batch file, having no sh.exe on PATH.
      - name: GNU make runs
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/make-version.log"
          want='GNU Make 4.4.1'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/gnumake.nix -A version > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::make --version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::make --version did not print $want"; exit 1; fi
          echo "ok    make --version"
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/gnumake.nix -A pattern-rule | tail -n 1); then
            echo "::error::make did not build greeting.txt"
            exit 1
          fi
          greeting=$(cygpath -u "$out")
          printf 'Hello from make\n' > "$RUNNER_TEMP/greeting-want.txt"
          if cmp "$RUNNER_TEMP/greeting-want.txt" "$greeting"; then
            echo "ok    make built greeting.txt through its pattern rule"
          else
            echo "::error::greeting.txt is not greeting.in's text:"
            od -A d -t x1 "$greeting" | head -n 8
            exit 1
          fi

      # busybox-w32, compiled by tinycc-native, timed.
      - name: Build busybox-w32
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A busybox-w32
          echo "== busybox-w32 built in $((SECONDS - start)) s"

      # busybox --version prints its version line, and busybox's sh runs
      # test/data/busybox.nix's script through the applets configure runs,
      # writing a line of what each did; a line whose test fails is left
      # out.  The lines are checked against bytes the runner's own printf
      # writes.
      - name: busybox-w32 runs
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/busybox-version.log"
          want='BusyBox v1.39.0.git-6354-g5f09fb446 ()'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/busybox.nix -A version > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::busybox --version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::busybox --version did not print $want"; exit 1; fi
          echo "ok    busybox --version"
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/busybox.nix -A configure-tools | tail -n 1); then
            echo "::error::busybox sh did not run configure-tools.sh"
            exit 1
          fi
          lines=$(cygpath -u "$out")
          expected="$RUNNER_TEMP/configure-tools-expected.txt"
          printf '%s\n' \
            'sh arithmetic 42' \
            'sh expansion configure igure.ac 12' \
            'sh case ac' \
            'sh function hello world' \
            'sh loop abc' \
            'sh child child here status 3' \
            'mkdir -p' \
            'cat one,two,three,' \
            'cp mv' \
            'rm -r' \
            'printf done 007 ff' \
            'test' \
            'sed CC is gcc -O2' \
            'sed -n two' \
            'grep -c 2' \
            'grep -q' \
            'grep -E two,three,' \
            'grep -v three' \
            'awk 14' \
            'awk -F c 3' \
            'expr 5 conftest' \
            'tr ABCDEF' > "$expected"
          if cmp "$expected" "$lines"; then
            echo "ok    busybox sh ran configure-tools.sh, $(wc -l < "$lines") lines as expected"
          else
            echo "::error::configure-tools.sh's lines differ from those expected:"
            diff "$expected" "$lines"
            exit 1
          fi

      # The seed stdenv's commands, busybox-w32's applets, and GNU Hello
      # built with it: pkgs/windows' hello package, configured, compiled
      # and installed by busybox's sh, its applets, GNU make and
      # tinycc-native, each timed.
      - name: Build GNU Hello with the seed stdenv
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A seedStdenv.applets
          echo "== seedStdenv.applets built in $((SECONDS - start)) s"
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/seed-stdenv.nix -A hello
          echo "== hello built in $((SECONDS - start)) s"

      # hello prints its greeting, or the one --greeting gives it, and its
      # version, each line ending in a carriage return, as msvcrt's
      # text-mode stdout writes it.  Each greeting is checked against bytes
      # the runner's own printf writes, and the first line of --version
      # with its carriage return removed.
      - name: GNU Hello built with the seed stdenv runs
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/seed-stdenv.nix -A hello | tail -n 1); then
            echo "::error::hello did not build"
            exit 1
          fi
          hello=$(cygpath -u "$out")/bin/hello.exe
          work="$(cygpath -u "$RUNNER_TEMP")/seed-hello"
          mkdir "$work"
          status=0
          runs() {
            local want_out=$1 code=0
            shift
            "$hello" "$@" > "$work/out.txt" || code=$?
            printf '%s\r\n' "$want_out" > "$work/want.txt"
            if [ "$code" = 0 ] && cmp "$work/want.txt" "$work/out.txt"; then
              echo "ok    hello.exe${*:+ $*} prints $want_out"
            else
              echo "::error::hello.exe${*:+ $*} exited $code and printed $(wc -c < "$work/out.txt") bytes:"
              od -A d -t x1 "$work/out.txt" | head -n 8
              status=1
            fi
          }
          runs 'Hello, world!'
          runs 'Hello from the seed' --greeting='Hello from the seed'
          code=0
          out=$("$hello" --version) || code=$?
          version=${out%%$'\n'*}
          version=${version%$'\r'}
          if [ "$code" = 0 ] && [ "$version" = 'hello (GNU Hello) 2.12.3' ]; then
            echo "ok    hello.exe --version prints $version"
          else
            echo "::error::hello.exe --version exited $code and printed $version"
            status=1
          fi
          exit "$status"

      # GNU Hello as the seed stdenv builds it, with configure's default
      # CFLAGS, names neither the store directory nor its build directory
      # (.github/bootstrap/no-build-path.sh says why).
      - name: GNU Hello built with the seed stdenv names no store or build directory
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/seed-stdenv.nix -A hello | tail -n 1); then
            echo "::error::hello did not build"
            exit 1
          fi
          bash .github/bootstrap/no-build-path.sh hello "$out" bin/hello.exe

      # GNU binutils for i686-w64-mingw32, configured, compiled and
      # installed in the seed stdenv by tinycc-native, timed.
      - name: Build binutils
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A binutils
          echo "== binutils built in $((SECONDS - start)) s"

      # ld --version prints its version line.  Then busybox's sh runs
      # test/data/binutils.nix's script, in which as assembles a function
      # that returns 42, ar archives the object, ld links it as a program's
      # entry point and the program runs, and ar archives and extracts a
      # file holding a 0x1A byte and a CR LF; it writes what nm, ar and
      # objdump read back of each file, the program's exit status and
      # whether the extracted file is the archived one, a line for each,
      # and a line whose step fails is left out.  The lines are
      # checked against bytes the runner's own printf writes.
      - name: binutils runs
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/ld-version.log"
          want='GNU ld (GNU Binutils) 2.41'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/binutils.nix -A version > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::ld --version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::ld --version did not print $want"; exit 1; fi
          echo "ok    ld --version"
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/binutils.nix -A answer | tail -n 1); then
            echo "::error::busybox sh did not run answer.sh"
            exit 1
          fi
          lines=$(cygpath -u "$out")
          expected="$RUNNER_TEMP/answer-expected.txt"
          printf '%s\n' \
            '00000000 T _answer' \
            'answer.o' \
            'answer.exe:     file format pei-i386' \
            'answer.exe exits 42' \
            'ctrlz.bin comes out of its archive whole' > "$expected"
          if cmp "$expected" "$lines"; then
            echo "ok    as, ar and ld built answer.exe, which exits 42, and ar kept a 0x1A byte"
          else
            echo "::error::answer.sh's lines differ from those expected:"
            diff "$expected" "$lines"
            exit 1
          fi

      # MinGW-w64's headers, its dirent functions and GCC 4.6.4's C
      # compiler for i686-w64-mingw32 with libgcc: the headers installed,
      # and the library and the compiler configured, compiled and installed,
      # in the seed stdenv by tinycc-native, and libgcc by that compiler in
      # the same build, each timed.
      - name: Build gcc-core
        shell: bash
        run: |
          set -euo pipefail
          for attr in mingw-w64-headers mingw-w64-dirent gcc-core; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$attr"
            echo "== $attr built in $((SECONDS - start)) s"
          done

      # The driver prints its version line.  Then busybox's sh runs
      # test/data/gcc-core.nix's script, in which the compiler compiles
      # text.c to assembly, reads windows.h, and compiles answer.c to an
      # object that ld links as a program's entry point and that runs; it
      # writes the assembly, a line for the headers, what nm reads back of
      # the object and the program's exit status, and a step that fails
      # leaves its lines out.  The lines are compared with
      # test/data/gcc-core-answer.txt, the same sources compiled by GCC
      # 4.6.4 as another compiler built it: cc1 computes every constant in
      # text.c and the multiplier answer.c's modulo becomes, so a cc1 that
      # tcc compiled wrongly writes other lines or a program that does not
      # exit with 42.
      - name: gcc-core runs
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/gcc-version.log"
          want='i686-w64-mingw32-gcc.exe (GCC) 4.6.4'
          code=0
          "$RUNNER_TEMP/bin/nova-nix.exe" build test/data/gcc-core.nix -A version > /dev/null 2> "$log" || code=$?
          cat "$log"
          if [ "$code" != 0 ]; then echo "::error::gcc --version failed its build"; exit 1; fi
          if ! grep -Fqx "$want" "$log"; then echo "::error::gcc --version did not print $want"; exit 1; fi
          echo "ok    gcc --version"
          if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/gcc-core.nix -A answer | tail -n 1); then
            echo "::error::busybox sh did not run answer.sh"
            exit 1
          fi
          lines=$(cygpath -u "$out")
          expected=test/data/gcc-core-answer.txt
          if cmp "$expected" "$lines"; then
            echo "ok    gcc-core wrote the assembly expected of text.c, read windows.h, and built answer.exe, which exits 42"
          else
            echo "::error::answer.sh's lines differ from $expected:"
            diff "$expected" "$lines"
            exit 1
          fi

      # MinGW-w64's runtime, configured, compiled and installed in the seed
      # stdenv by gcc-core, and gcc46, gcc-core's tree with the runtime in
      # its prefix, copied by busybox's sh, each timed.
      - name: Build gcc46
        shell: bash
        run: |
          set -euo pipefail
          for attr in mingw-w64-crt gcc46; do
            start=$SECONDS
            "$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/default.nix -A "$attr"
            echo "== $attr built in $((SECONDS - start)) s"
          done

      # busybox's sh runs test/data/gcc46.nix's two scripts.  crt lists
      # every file the runtime installs and crt2.o's global symbols, which
      # a configure test decides without failing the build.  hello has gcc46
      # compile and link a program with no flag naming a directory, runs
      # it, and writes what it prints and its exit status, the DLLs it
      # imports, and the two libgcc functions its 64-bit division and
      # remainder call.  Each output is compared with the file of
      # test/data named for it, written from the same sources built by GCC
      # 4.6.4 as another compiler built it.
      - name: gcc46 links a program that runs
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for check in crt hello; do
            expected=test/data/gcc46-$check-answer.txt
            if ! out=$("$RUNNER_TEMP/bin/nova-nix.exe" build test/data/gcc46.nix -A "$check" | tail -n 1); then
              echo "::error::busybox sh did not run $check's script"
              status=1
              continue
            fi
            lines=$(cygpath -u "$out")
            if cmp "$expected" "$lines"; then
              echo "ok    $check wrote the lines of $expected"
            else
              echo "::error::$check's lines differ from $expected:"
              diff "$expected" "$lines"
              status=1
            fi
          done
          exit "$status"

      # The ladder, as this job built it and its checks ran on it: --all is
      # every valid path but the derivations in a store this job filled
      # from empty.  It runs last, so a ladder that fails a check above is
      # never published.  The checks' own outputs go with it and are never
      # taken back: each forbids substitutes (test/data/check.nix).  push
      # skips what the cache already serves, as it does every source, and
      # an absent secret arrives as an empty key file, which push refuses.
      - name: Publish the ladder to the public cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.publish
        shell: bash
        env:
          NOVA_CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/cache-key"
          trap 'rm -f "$keyfile"' EXIT
          (umask 077; printf '%s' "$NOVA_CACHE_API_KEY" > "$keyfile")
          "$RUNNER_TEMP/bin/nova-nix.exe" push --store 'C:\nix\store' \
            --cache "$CACHE_URL" --key-file "$keyfile" \
            --compression zstd --all

  # ---------------------------------------------------------------------------
  # Publish (public cache): refresh the public cache with the closure main
  # builds, so it serves the current one rather than whatever was pushed by
  # hand last.  A job of its own rather than a step of e2e-windows: the
  # token is a secret of the `cache` environment, whose deployment branch
  # rule admits main alone, and GitHub refuses a job that references the
  # environment from any other ref.  On e2e-windows that refusal would hit
  # E2E (Windows), a required check on every pull request.  The gate is a
  # repository setting only an admin changes, where an `if:` lives in the
  # file any push can edit; the `if:` kept here makes other refs skip the
  # job instead of failing it.
  #
  # The closure is built again here, with the public cache as a substituter:
  # after the first publish, everything a push left alone substitutes and
  # only the delta builds, and --all then finds the rest already cached.  A
  # toolchain bump is the cold case, a second full build.  What e2e-windows
  # ran stays on its own runner; the bytes pushed are this job's, so this
  # job runs its own Hello first and one that does not print is never
  # published.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish (public cache)
    needs: [e2e-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: cache
      url: ${{ env.CACHE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Install nova-nix
        run: cabal install exe:nova-nix --install-method=copy --installdir="$env:RUNNER_TEMP\bin" --overwrite-policy=always

      - name: Provision the store root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\nix\store | Out-Null

      # Every source pkgs/windows fetches, for --all below to publish: one
      # the cache holds comes from it, and one it lacks is fetched from its
      # upstream host here, the once.
      - name: Take the sources from the public cache
        shell: bash
        run: bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe"

      # build prints the out path as its last stdout line; the [subst] and
      # [build] lines go to stderr and stay in the job log.  LC_ALL pinned
      # as E2E (public cache) pins it: the greeting is compared literally,
      # and hello configures NLS in when it finds libintl, which the seed
      # ships.  The build never sees it: the builder scrubs the ambient
      # environment down to SystemRoot, SystemDrive and windir.
      - name: Build hello.nix, substituting what the cache already has, and run it
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/hello.nix \
            --substituter "$CACHE_URL" \
            --trusted-key "$CACHE_PUBLIC_KEY" | tail -n 1)
          echo "out path: $out"
          got=$("$(cygpath -u "$out")/bin/hello.exe")
          echo "output: $got"
          [ "$got" = "Hello, world!" ] || { echo "unexpected hello output: $got" >&2; exit 1; }

      # --all is every valid path but the derivations in a store this job
      # filled from empty: the closure, and every source pkgs/windows
      # fetches, each fixed-output and so the same bytes wherever it was
      # fetched.  push skips what the cache already serves and prints both
      # counts itself.  An absent secret arrives as an empty key file, which
      # push refuses.
      - name: Publish the closure to the public cache
        shell: bash
        env:
          NOVA_CACHE_API_KEY: ${{ secrets.NOVA_CACHE_API_KEY }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/cache-key"
          trap 'rm -f "$keyfile"' EXIT
          (umask 077; printf '%s' "$NOVA_CACHE_API_KEY" > "$keyfile")
          "$RUNNER_TEMP/bin/nova-nix.exe" push --store 'C:\nix\store' \
            --cache "$CACHE_URL" --key-file "$keyfile" \
            --compression zstd --all

  # ---------------------------------------------------------------------------
  # End-to-end (public cache): the loop the Linux job proves against a
  # throwaway server, run on Windows against the cache users are given.
  # A fresh store, the public cache as the only substituter, and the build
  # must come entirely from it: a single [build] line means the cache is
  # missing part of the current closure and the job turns red, instead of
  # a silent local rebuild hiding the gap.  Main pushes only, after
  # the publish job above has refreshed the cache from this same tree.
  # ---------------------------------------------------------------------------
  e2e-public-cache:
    name: E2E (public cache)
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Install nova-nix
        run: cabal install exe:nova-nix --install-method=copy --installdir="$env:RUNNER_TEMP\bin" --overwrite-policy=always

      # The store root wants pre-creating on the runner, as the Windows job
      # found; cygpath keeps the separators Windows-native so the store dir
      # the binary renders paths through has one spelling.
      - name: Substitute the whole closure from the public cache
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          store=$(cygpath -w "$RUNNER_TEMP/public-store")
          mkdir -p "$RUNNER_TEMP/public-store"
          log="$RUNNER_TEMP/substitute.log"
          out=$("$RUNNER_TEMP/bin/nova-nix.exe" build pkgs/windows/hello.nix \
            --store "$store" \
            --substituter "$CACHE_URL" \
            --trusted-key "$CACHE_PUBLIC_KEY" \
            2> "$log" | tail -n 1)
          echo "out path: $out"
          grep -F '[subst]' "$log" || { echo "nothing was substituted from the public cache" >&2; cat "$log" >&2; exit 1; }
          if grep -F '[build]' "$log"; then
            echo "the public cache is missing part of the current closure: the lines above were built locally" >&2
            exit 1
          fi
          got=$("$(cygpath -u "$out")/bin/hello.exe")
          echo "output: $got"
          [ "$got" = "Hello, world!" ] || { echo "unexpected hello output: $got" >&2; exit 1; }

      # The publish job above pushed every source pkgs/windows fetches, so
      # each has to come from the cache here.  A [build] line is a source
      # the cache lacks, which every other job then fetches from its
      # upstream host on every run.
      - name: Every source comes from the public cache
        shell: bash
        run: |
          set -euo pipefail
          store=$(cygpath -w "$RUNNER_TEMP/public-store")
          log="$RUNNER_TEMP/sources.log"
          if ! bash .github/cache/realise-sources.sh "$RUNNER_TEMP/bin/nova-nix.exe" --store "$store" 2> "$log"; then
            cat "$log" >&2
            exit 1
          fi
          if grep -F '[build]' "$log"; then
            echo "the public cache is missing the sources above: each was fetched from its upstream host" >&2
            exit 1
          fi
          echo "$(grep -c -F '[subst]' "$log") sources came from the public cache"

      - name: Dump the substitution log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/substitute.log" || true

  # ---------------------------------------------------------------------------
  # End-to-end (Linux): the full binary-cache loop against a real
  # nova-cache-server - push --compression zstd from one scratch store,
  # substitute into a second fresh store with signature verification on,
  # and NAR-compare the two trees - plus a derivation that forbids
  # substitutes, built beside the cache that holds its output and
  # substituted under always-allow-substitutes, and the memory gate: a
  # multi-hundred-MB path substitutes under a hard +RTS -M cap, so any
  # reintroduced whole-archive retention aborts the job. The unit suite's
  # loopback fixtures cover fetch integrity; this exercises a real cache's
  # HTTP surface (chunked transfer, connection reuse, signing handshake)
  # and the nova-nix/nova-cache two-repo interop.
  # ---------------------------------------------------------------------------

  e2e-loop:
    name: E2E (substitute loop)
    needs: [cabal-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      # Own key family, not the build matrix's: this job adds the server's
      # dependencies (warp, wai-extra) to the store, and the server is
      # installed unpinned, so the store can change without any hashed
      # file changing - the run_id suffix makes every run save its store,
      # and the restore-keys pick up the newest previous one.
      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-e2e-loop-${{ hashFiles('nova-nix.cabal') }}-${{ github.run_id }}
          restore-keys: |
            cabal-e2e-loop-${{ hashFiles('nova-nix.cabal') }}-
            cabal-e2e-loop-

      # The loop drives the installed executable - the artifact a user
      # gets - not a dist-newstyle build product.
      - name: Install nova-nix
        run: cabal install exe:nova-nix --install-method=copy --installdir="$RUNNER_TEMP/bin" --overwrite-policy=always

      # Deliberately unpinned: half this job's value is cross-repo
      # interop against the server as released, so a nova-cache release
      # that breaks the loop fails here first, not in production.
      - name: Install nova-cache-server from Hackage
        run: cabal install nova-cache -f server --install-method=copy --installdir="$RUNNER_TEMP/bin" --overwrite-policy=always

      # GNU time prints the substituting process's peak RSS - the
      # observable behind the memory claim; the shell keyword of the same
      # name cannot measure a child's RSS, and the runner image does not
      # guarantee the binary.
      - name: Provision /usr/bin/time
        run: |
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi

      - name: Push/substitute loop with memory gate
        run: |
          NOVA_NIX_BIN="$RUNNER_TEMP/bin/nova-nix" \
          NOVA_CACHE_SERVER_BIN="$RUNNER_TEMP/bin/nova-cache-server" \
          E2E_WORK_DIR="$RUNNER_TEMP/e2e-loop" \
          .github/e2e-loop/loop.sh

      - name: Dump loop logs on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/e2e-loop/logs/*; do
            echo "== $f =="
            cat "$f" || true
          done
