name: Publish

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never cancel a publish: assets are uploaded one at a time and a release that
# is half-populated is worse than a slow one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Drop the default GITHUB_TOKEN to read-only by default; only the release job
# widens it.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  parity:
    name: Parity
    uses: ./.github/workflows/parity.yml

  # The tree is the source of truth: the tag must NAME the committed version,
  # never rewrite it.  Its own job because two consumers depend on it, and a
  # mistyped tag must fail before a public release exists to be found by it.
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the tag against the committed version and changelog
        id: tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          ESCAPED=${TAG_VERSION//./\\.}
          if ! grep -Eq "^version:[[:space:]]*${ESCAPED}[[:space:]]*$" nova-nix.cabal; then
            echo "tag v${TAG_VERSION} does not match the committed version:" >&2
            grep '^version:' nova-nix.cabal >&2
            exit 1
          fi
          if ! grep -Eq "^## ${ESCAPED}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for ${TAG_VERSION}" >&2
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

  # Per-platform release archives.  Built here rather than reused from the CI
  # matrix: a release asset is not a bare executable, it carries the data dir
  # the <nix/*> search path resolves through, so a downloaded nova-nix can
  # build rather than only evaluate.
  package:
    name: Package (${{ matrix.name }})
    needs: [check-tag, ci, parity]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: tar.gz
          - os: macos-latest
            name: macos
            ext: tar.gz
          - os: windows-latest
            name: windows
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Build the executable
        run: cabal install exe:nova-nix --install-method=copy --installdir=staged --overwrite-policy=always

      # bin/ beside share/ is the layout resolveDataDir looks for, so the
      # archive works unpacked anywhere with nothing set.  pkgs/ rides along
      # because it is what there is to build: every path in it is either
      # relative to itself or the <nix/*> entry share/ already provides, so
      # the README's own first command runs against the unpacked copy
      # instead of needing the repository cloned beside it.
      - name: Assemble the archive
        shell: bash
        run: |
          set -euo pipefail
          arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          stem="nova-nix-${{ matrix.name }}-${arch}"
          mkdir -p "$stem/bin" "$stem/share/nova-nix/nix"
          cp staged/nova-nix* "$stem/bin/"
          cp data/nix/fetchurl.nix "$stem/share/nova-nix/nix/"
          cp -R pkgs "$stem/"
          cp LICENSE NOTICE README.md "$stem/"
          echo "stem=$stem" >> "$GITHUB_ENV"

      # The asset has to work before it is published, not after someone
      # reports that it does not.  nova_nix_datadir is pointed at nothing so
      # a pass can only come from the archive's own share/ directory.  The
      # recipes are asserted present rather than built: what they do when
      # built is the Windows E2E job's verdict on every commit, while a
      # copy that silently landed them nowhere is only visible here.
      - name: Smoke-test the assembled archive
        shell: bash
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          set -euo pipefail
          exe="$stem/bin/nova-nix"
          [ -x "$exe" ] || exe="$stem/bin/nova-nix.exe"
          got=$(nova_nix_datadir=/nonexistent "$exe" eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)')
          [ "$got" = '"lambda"' ] || { echo "archive cannot resolve <nix/*>: $got" >&2; exit 1; }
          # check-tag proves the tag names the committed version.  This proves
          # the binary in the archive was built from it, which is the half
          # that reads a source tree nobody has confirmed the build used.
          got=$("$exe" --version)
          [ "$got" = "nova-nix ${VERSION}" ] \
            || { echo "archive reports ${got}, tag says nova-nix ${VERSION}" >&2; exit 1; }
          for recipe in pkgs/windows/hello.nix pkgs/windows/stdenv.nix pkgs/windows/setup.sh; do
            [ -f "$stem/$recipe" ] || { echo "archive is missing $recipe" >&2; exit 1; }
          done

      # The step above runs on the machine that built the binary, where a
      # full GHC toolchain sits on PATH, so it cannot tell a self-contained
      # executable from one quietly finding its DLLs next door.  PATH cut to
      # the system directories is the download's actual situation: a
      # dependency that starts linking zlib, zstd or libgcc dynamically
      # fails here rather than on the first person to unpack the zip.
      # Windows only, because it is the only platform whose loader consults
      # PATH at all.
      - name: The archive runs with no toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:nova_nix_datadir = "/nonexistent"
          $got = & "$env:stem\bin\nova-nix.exe" eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "the archive's binary does not start without the build machine's PATH"
            exit 1
          }
          if ($got -ne '"lambda"') {
            Write-Error "archive cannot resolve <nix/*> on a bare PATH: $got"
            exit 1
          }

      - name: Create the archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "$stem.zip" "$stem" >/dev/null
          else
            tar czf "$stem.tar.gz" "$stem"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: nova-nix-*.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  # Hackage is not published from here.  A release can be deleted and cut
  # again; a Hackage version cannot, so spending one is a separate decision
  # taken at a separate time, and hackage.yml is dispatched by hand once a
  # release has proved itself.
  release:
    name: GitHub release
    needs: [check-tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # Generated after the download, so every line hashes the exact bytes
      # that get uploaded.
      - name: Checksums
        working-directory: assets
        run: sha256sum nova-nix-* > SHA256SUMS

      # Draft first: releases/latest/download is the installer's URL, and a
      # published release with no assets attached yet 404s for every consumer
      # that hits it in the window.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)
          for what changed in this release.

          Each archive unpacks to \`bin/\` beside \`share/\` and \`pkgs/\`. Run
          \`bin/nova-nix\` from anywhere: no toolchain, and nothing to configure.
          The bundled recipes build as they stand, so on Windows:

          \`\`\`console
          > bin\\nova-nix.exe build pkgs\\windows\\hello.nix
          \`\`\`

          Verify the download with \`sha256sum -c SHA256SUMS\`.
          EOF
          gh release create "v${VERSION}" \
            --draft \
            --title "nova-nix ${VERSION}" \
            --notes-file notes.md \
            assets/*

      - name: Assert every asset attached, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          set -euo pipefail
          count=$(gh release view "v${VERSION}" --json assets --jq '.assets | length')
          if [ "$count" -ne 4 ]; then
            echo "expected 4 assets (3 archives + SHA256SUMS), found ${count}" >&2
            gh release view "v${VERSION}" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          gh release edit "v${VERSION}" --draft=false
