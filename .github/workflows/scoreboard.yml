name: Scoreboard

# How much of nixpkgs nova-nix evaluates, and how much of that matches
# upstream Nix: profiling/bench.sh's scoreboard walks each nixpkgs tree the
# parity job pins with both evaluators, and writes both counts to the job
# summary, then the resource figures of one memory-bounded nova-nix process
# over the set that evaluates.  Dispatched with the memory measure, it runs
# bench.sh's memory suite instead, over a slice of one tree's walk.  A
# measurement and not a gate: branch protection does not require it, so it
# runs only when dispatched or when a pull request changes the scoreboard
# itself, and never in the merge queue.

on:
  workflow_dispatch:
    inputs:
      measure:
        description: The scoreboard of every pinned tree, or the memory suite over a slice of one
        type: choice
        options:
          - scoreboard
          - memory
        default: scoreboard
      channel:
        description: The pinned tree the memory suite walks, by parity.yml's channel
        type: string
        default: "24.11"
      slice:
        description: The attributes the memory suite's slice holds
        type: string
        default: "2000"
  pull_request:
    paths:
      - .github/workflows/scoreboard.yml
      - profiling/bench.sh
      - profiling/scoreboard.nix
      - profiling/walk.nix
      - profiling/scoreboard-fixture/**

# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

# A newer push to a pull request supersedes the walk in flight.  The two
# measures queue apart, so that neither waits behind the other.
concurrency:
  group: scoreboard-${{ inputs.measure || 'scoreboard' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pairings are parity.yml's matrix rows, read from it, so the two
  # workflows measure the same trees and a bumped row needs no edit here.
  # The memory suite takes the one row of the channel dispatched.
  pairings:
    name: Pairings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read parity.yml's matrix
        id: read
        env:
          MEASURE: ${{ inputs.measure }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          include=$(yq -o=json -I=0 '.jobs.parity.strategy.matrix.include' .github/workflows/parity.yml)
          if [ "$MEASURE" = memory ]; then
            include=$(jq -c --arg channel "$CHANNEL" 'map(select(.channel == $channel))' <<<"$include")
          fi
          echo "$include"
          [ "$(jq 'length' <<<"$include")" -gt 0 ] || { echo "parity.yml lists no pairing to measure" >&2; exit 1; }
          echo "include=$include" >> "$GITHUB_OUTPUT"

  scoreboard:
    # Not the parity rows' names, which are check names of their own.
    name: ${{ inputs.measure == 'memory' && 'Memory over' || 'Walk' }} nixpkgs ${{ matrix.channel }} with Nix ${{ matrix.nix }}
    needs: [pairings]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pairings.outputs.include) }}
    # Six hours is GitHub's ceiling for a hosted job, and a job that reaches
    # its own limit is cancelled, which skips the summaries and the uploads.
    # The walk's and the resource pass's own limits leave the job room for
    # the setup before them, a cold Cabal build included, and for the steps
    # after each.
    timeout-minutes: 355
    env:
      NIX_VERSION: ${{ matrix.nix }}
      NIXPKGS_REV: ${{ matrix.rev }}
      LABEL: nixpkgs-${{ matrix.channel }}
      # bench.sh bounds the evaluators' memory at MEMORY_MAX, its
      # SCOREBOARD_MEMORY_MAX, below the 16 GB of RAM a hosted runner has
      # for a public repository, with 4 GB left for the system, the runner
      # itself and the Nix daemon: at the bound the kernel's OOM killer ends
      # an evaluator, and the runner stays up.  Each bounded step runs
      # bench.sh in a transient systemd scope whose cgroup systemd hands to
      # the runner user (Delegate=yes with User= and Group=), so that
      # bench.sh keeps itself outside the bound and every evaluator inside
      # it.  OOMPolicy=continue keeps systemd from stopping the scope when
      # the kernel ends an evaluator in it.  The runner's passwordless sudo
      # creates the scope and --uid runs bench.sh in it as the runner user.
      # The runner's sudoers refuses -E and sudo resets the environment, so
      # --setenv passes on what bench.sh reads from the step: PATH, for the
      # toolchain, NIXPKGS_PATH and the bound.  systemd-run expands $ in the
      # command it runs, as ExecStart= does, so that command names no
      # variable of its own.
      MEMORY_MAX: 12G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/install

      - name: Verify the oracle version
        run: |
          set -euo pipefail
          actual=$(nix-instantiate --version)
          expected="nix-instantiate (Nix) $NIX_VERSION"
          echo "$actual"
          [ "$actual" = "$expected" ] || { echo "expected $expected" >&2; exit 1; }

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"

      - name: Cache Cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-Linux-${{ hashFiles('nova-nix.cabal') }}
          restore-keys: cabal-Linux-

      # The parity job's key, so the two share one cached tree per revision.
      - name: Cache the pinned nixpkgs tree
        id: nixpkgs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nixpkgs-ref
          key: parity-nixpkgs-${{ runner.os }}-${{ env.NIXPKGS_REV }}

      - name: Fetch the pinned nixpkgs tree
        if: steps.nixpkgs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init nixpkgs-ref
          git -C nixpkgs-ref remote add origin https://github.com/NixOS/nixpkgs
          git -C nixpkgs-ref fetch --depth 1 origin "$NIXPKGS_REV"
          git -C nixpkgs-ref checkout --detach FETCH_HEAD

      # Validate cache hits too; neither evaluator may silently use another
      # revision or a modified tracked file from a restored tree.
      - name: Verify nixpkgs (both evaluators read this same tree)
        run: |
          set -euo pipefail
          actual=$(git -C nixpkgs-ref rev-parse HEAD)
          echo "nixpkgs rev: $actual"
          [ "$actual" = "$NIXPKGS_REV" ] || { echo "unexpected nixpkgs revision" >&2; exit 1; }
          git -C nixpkgs-ref diff --exit-code HEAD --
          [ -z "$(git -C nixpkgs-ref ls-files --others --exclude-standard)" ] \
            || { echo "unexpected untracked files in nixpkgs" >&2; exit 1; }
          echo "NIXPKGS=$PWD/nixpkgs-ref" >> "$GITHUB_ENV"

      - name: Build nova-nix
        id: build
        run: cabal build exe:nova-nix bench:attrset-memory

      # Minutes, where the walk below takes hours: a walk that misreads
      # either evaluator fails here first.  The budget is below the
      # fixture's attribute count, so each walk resumes after a spent budget
      # as well as after each failure tryEval cannot catch.  The memory
      # suite then runs on a slice of the fixture: both evaluators' passes
      # visit the same attributes, the census places every pointer it
      # meets, and the census of regions does too, finds nothing reached
      # after a close found it unreached, and finds that no tenure
      # collector frees anything a mark reaches.
      - name: Check the walk on its fixture
        timeout-minutes: 10
        env:
          SCOREBOARD_BUDGET: "4"
          MEMORY_SLICE: "12"
        run: |
          set -euo pipefail
          NIXPKGS_PATH="$PWD/profiling/scoreboard-fixture" profiling/bench.sh fixture --scoreboard
          for walk in upstream nova-nix; do
            diff profiling/scoreboard-fixture/expected.txt "profiling/results/fixture/$walk/results.txt"
          done
          NIXPKGS_PATH="$PWD/profiling/scoreboard-fixture" profiling/bench.sh fixture --memory
          memory=profiling/results/fixture/memory
          diff <(sort "$memory/nova-nix/visited.txt") <(sort "$memory/upstream/visited.txt")
          grep -qx 'mark.unplaced 0' "$memory/census/census.txt"
          grep -qx 'regions.unplaced 0' "$memory/regions/regions.txt"
          grep -qx 'regions.resurrected.count 0' "$memory/regions/regions.txt"
          for budget in 0 1048576 16777216 268435456; do
            grep -qx "regions.tenure.reached $budget 0" "$memory/regions/regions.txt"
            grep -qx "regions.tenure.resurrected $budget 0 0" "$memory/regions/regions.txt"
          done

      # The two evaluators walk at once, under the one bound.  A process
      # the OOM killer ends there is retried at the attribute it was on, as
      # bench.sh retries a heap overflow.  The Nix installer's
      # NIX_SSL_CERT_FILE is passed on too, for a fetch upstream makes.
      - name: Walk nixpkgs with both evaluators
        id: walk
        if: inputs.measure != 'memory'
        timeout-minutes: 180
        run: |
          sudo systemd-run --scope --quiet \
            --uid="$(id -un)" --gid="$(id -gn)" \
            -p User="$(id -un)" -p Group="$(id -gn)" -p Delegate=yes -p OOMPolicy=continue \
            --setenv=PATH="$PATH" --setenv=NIXPKGS_PATH="$NIXPKGS" \
            --setenv=NIX_SSL_CERT_FILE="$NIX_SSL_CERT_FILE" \
            --setenv=SCOREBOARD_MEMORY_MAX="$MEMORY_MAX" \
            profiling/bench.sh "$LABEL" --scoreboard

      - name: Job summary
        if: ${{ !cancelled() && steps.walk.outcome != 'skipped' }}
        run: |
          {
            if [ -s "profiling/results/$LABEL/scoreboard.md" ]; then
              cat "profiling/results/$LABEL/scoreboard.md"
            else
              echo "## nova-nix scoreboard: $LABEL"
              echo
              echo "The walk did not finish; the uploaded results hold what it settled."
            fi
            echo
            echo "nixpkgs revision \`$NIXPKGS_REV\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The fixture's results too, which are what a failed check needs.
      # Uploaded before the resource pass starts, so that a pass that takes
      # the runner down costs only its own figures: no step runs on a runner
      # that has gone.
      - name: Upload the results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard-${{ env.LABEL }}
          path: profiling/results/
          if-no-files-found: warn
          retention-days: 14

      # One process of each evaluator over every attribute its walk
      # evaluated, one after the other under the bound; bench.sh reports a
      # kill there as that pass's result.
      - name: Force what evaluated in one bounded process
        id: resources
        if: inputs.measure != 'memory'
        timeout-minutes: 120
        run: |
          sudo systemd-run --scope --quiet \
            --uid="$(id -un)" --gid="$(id -gn)" \
            -p User="$(id -un)" -p Group="$(id -gn)" -p Delegate=yes -p OOMPolicy=continue \
            --setenv=PATH="$PATH" --setenv=NIXPKGS_PATH="$NIXPKGS" \
            --setenv=SCOREBOARD_MEMORY_MAX="$MEMORY_MAX" \
            profiling/bench.sh "$LABEL" --resources

      - name: Resource summary
        if: ${{ !cancelled() && steps.resources.outcome != 'skipped' }}
        run: |
          {
            if [ -s "profiling/results/$LABEL/resources/resources.md" ]; then
              cat "profiling/results/$LABEL/resources/resources.md"
            else
              echo "## Resource pass: $LABEL"
              echo
              echo "The resource pass did not finish; the uploaded resources hold its output so far."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the resource pass
        if: ${{ !cancelled() && steps.resources.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard-${{ env.LABEL }}-resources
          path: profiling/results/${{ env.LABEL }}/resources/
          if-no-files-found: warn
          retention-days: 14

      # The memory suite's walks and passes run under the bound as the walk
      # does, MEMORY_SLICE passed on with the rest.
      - name: Measure memory over a slice of the walk
        id: memory
        if: inputs.measure == 'memory'
        timeout-minutes: 120
        env:
          MEMORY_SLICE: ${{ inputs.slice }}
        run: |
          sudo systemd-run --scope --quiet \
            --uid="$(id -un)" --gid="$(id -gn)" \
            -p User="$(id -un)" -p Group="$(id -gn)" -p Delegate=yes -p OOMPolicy=continue \
            --setenv=PATH="$PATH" --setenv=NIXPKGS_PATH="$NIXPKGS" \
            --setenv=NIX_SSL_CERT_FILE="$NIX_SSL_CERT_FILE" --setenv=MEMORY_SLICE="$MEMORY_SLICE" \
            --setenv=SCOREBOARD_MEMORY_MAX="$MEMORY_MAX" \
            profiling/bench.sh "$LABEL" --memory

      - name: Memory summary
        if: ${{ !cancelled() && steps.memory.outcome != 'skipped' }}
        run: |
          {
            if [ -s "profiling/results/$LABEL/memory/memory.md" ]; then
              cat "profiling/results/$LABEL/memory/memory.md"
            else
              echo "## nova-nix memory: $LABEL"
              echo
              echo "The memory suite did not finish; the uploaded results hold its output so far."
            fi
            echo
            echo "nixpkgs revision \`$NIXPKGS_REV\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the memory suite
        if: ${{ !cancelled() && steps.memory.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard-${{ env.LABEL }}-memory
          path: profiling/results/${{ env.LABEL }}/memory/
          if-no-files-found: warn
          retention-days: 14
